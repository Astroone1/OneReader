<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneReader" />
  <title>OneReader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --reader-bg: #fdf6e3;
      --reader-text: #2f251e;
      --reader-font-size: 22px;
      --reader-margin: 0px;
      --reader-letter-spacing: 0px;
      --reader-para-spacing: 15px;
      --reader-brightness: 1;
      --reader-font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; user-select: none; overflow: hidden; background: #fff; color: #2c2c2c; }
    #book-stage, #page-left, #page-left *, #page-right, #page-right *, #page-measure-box, #page-measure-box * { font-family: var(--reader-font-family) !important; }
    input[type='range'].onereader-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: #6c6c6c; border-radius: 999px; outline: none; }
    input[type='range'].onereader-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #6b6863; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .swatch-selected { box-shadow: 0 0 0 3px #fafafa, 0 0 0 5px #443c35; }
    .paginated-leaf { overflow: hidden !important; }
    .paginated-leaf::-webkit-scrollbar { display: none !important; }
    #reader-view.mobile-controls-active .corner-float-btn { opacity: 1 !important; pointer-events: auto !important; }
    /* 触屏设备没有可靠的 hover：顶部中间感应区不拦截任何点击/滑动，避免盖住“点屏幕中央唤出控制条”的手势 */
    @media (hover: none) {
      #fs-sense-zone { pointer-events: none !important; }
      #fs-sense-zone #reader-fullscreen-toggle { pointer-events: none; }
      #reader-view.mobile-controls-active #fs-sense-zone #reader-fullscreen-toggle { pointer-events: auto; }
    }
    @keyframes cloudPulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    .cloud-btn-hover:hover svg .cloud-arrow { animation: cloudPulse 1.2s ease-in-out infinite; }
    /* 云同步进行中：图标缓慢旋转，代替原来的文字状态 */
    @keyframes noteSyncSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #notes-sync-btn.is-syncing svg { animation: noteSyncSpin 1.4s linear infinite; }
    /* 笔记正文描边：叶立群几何体本身偏细，用极轻的描边增加笔画厚度，
       且不影响字重（不用 bold，避免变成艺术字） */
    .note-card-text {
      -webkit-text-stroke: 0.35px currentColor;
      text-shadow: 0.2px 0 0 currentColor, -0.2px 0 0 currentColor;
    }
    @media (max-width: 768px) {
      #library-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 45; background: #fff; box-shadow: 4px 0 24px rgba(0,0,0,.14); transition: transform .22s ease; }
      #library-sidebar.mobile-closed { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- 隐藏文件/字体选择器 -->
  <input id="file-upload-input" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple class="hidden" />
  <input id="font-upload-input" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" class="hidden" />

  <!-- ==================== 1. 书库主页 ==================== -->
  <div id="library-view" class="flex-1 flex flex-col h-full w-full bg-white overflow-hidden">
    <header class="h-20 w-full flex items-center justify-between px-4 sm:px-8 shrink-0">
      <div class="flex items-center gap-3 sm:gap-6 flex-1 min-w-0">
        <button id="toggle-sidebar-btn" type="button" title="导航菜单" class="p-2.5 rounded-xl hover:bg-neutral-100 text-neutral-700 transition cursor-pointer shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center ml-1 sm:ml-14 md:ml-20 flex-1 min-w-0">
          <div class="relative w-full max-w-[270px]">
            <input id="library-search-input" type="text" placeholder="搜索我的书库" class="w-full h-11 pl-5 pr-10 rounded-full bg-[#ebebeb] text-[15px] text-neutral-700 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400 transition" />
            <svg class="w-5 h-5 text-neutral-500 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
          </div>
        </div>
      </div>

      <!-- 右上角精美云端图标与状态点 -->
      <div class="relative flex items-center gap-2 shrink-0">
        <button id="open-cloud-modal-btn" type="button" title="云端私有书库与同步管理" class="cloud-btn-hover group relative p-2.5 rounded-2xl hover:bg-neutral-100 active:scale-95 transition flex items-center justify-center cursor-pointer">
          <svg class="w-10 h-10 text-[#3b3b3b] group-hover:text-black transition" viewBox="0 0 40 32" fill="none">
            <path d="M11.5 26.5H29.5C33.6421 26.5 37 23.1421 37 19C37 15.203 34.1783 12.065 30.514 11.568C29.389 6.657 25.002 3 19.75 3C13.675 3 8.75 7.925 8.75 14C8.75 14.389 8.77 14.773 8.81 15.151C5.534 15.792 3 18.678 3 22.15C3 24.552 4.948 26.5 7.35 26.5H11.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(59,59,59,0.03)"/>
            <g class="cloud-arrow" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 19.5V12.5M16.5 12.5L13.8 15.2M16.5 12.5L19.2 15.2"/>
              <path d="M23.5 13.5V20.5M23.5 20.5L20.8 17.8M23.5 20.5L26.2 17.8"/>
            </g>
          </svg>
          <span id="cloud-status-dot" class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-neutral-400 ring-2 ring-white transition-colors"></span>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
      <div id="mobile-sidebar-backdrop" class="hidden fixed inset-0 bg-black/30 z-40 md:hidden"></div>

      <!-- 左侧精简导航栏 -->
      <aside id="library-sidebar" class="mobile-closed md:transform-none w-[230px] shrink-0 flex flex-col justify-between pr-3 pb-4 select-none overflow-y-auto">
        <div class="space-y-1 pt-2 md:pt-0">
          <nav id="main-nav-list" class="space-y-1">
            <button type="button" data-nav="all" class="nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full bg-[#4a4a4a] text-white text-[15px] font-medium transition cursor-pointer">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
              <span>全部图书</span>
            </button>
            <button type="button" data-nav="notes" class="nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5v-13z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 4h9.5A1.5 1.5 0 0120 5.5v13a1.5 1.5 0 01-1.5 1.5H9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12.5 9h4M12.5 13h4"/></svg>
              <span>我的笔记</span>
            </button>
          </nav>

          <div class="pt-4">
            <button id="shelf-collapse-btn" type="button" class="w-full flex items-center justify-between pl-6 pr-5 py-2.5 text-[15px] font-semibold text-neutral-800 hover:bg-neutral-50 rounded-r-full cursor-pointer">
              <span>我的书架</span>
              <svg id="shelf-chevron" class="w-4 h-4 text-neutral-600 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="shelf-items-container" class="mt-1 space-y-1">
              <button id="create-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700 text-base leading-none">+</span>
                <span>新建书架</span>
              </button>
              <button id="manage-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M4 20h4l10.5-10.5a2.5 2.5 0 00-3.536-3.536L4 16v4z"/></svg>
                </span>
                <span>管理书架</span>
              </button>
              <div id="custom-shelf-list" class="space-y-1"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 书库列表展示 -->
      <main class="flex-1 h-full overflow-y-auto px-6 sm:px-12 pt-6 sm:pt-8 pb-24">
        <div id="empty-library-state" class="mt-16 sm:mt-20 ml-2 sm:ml-4 max-w-md">
          <h1 class="text-[32px] sm:text-[38px] font-normal text-[#3c3c3c] tracking-wide">图书库为空</h1>
          <p class="mt-4 text-[19px] sm:text-[22px] text-[#9e9e9e] leading-relaxed font-light">
            请点击右上角的云端图标连接私有仓或从本地导入图书
          </p>
        </div>
        <div id="books-grid-container" class="hidden">
          <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-6 gap-y-8"></div>
        </div>

        <!-- 我的笔记 -->
        <div id="notes-view" class="hidden">
          <!-- 这一栏与左侧「全部图书」平高：
               用负外边距抵消 main 的 pt-6/sm:pt-8，再用固定行高 h-[47px] 与左栏按钮等高，
               这样右侧控件与左侧导航处在同一条水平线上 -->
          <div class="flex items-center justify-end gap-2 -mt-6 sm:-mt-8 h-[47px] mb-4">
            <label class="text-sm text-neutral-500">按图书筛选</label>
            <select id="notes-book-filter" class="h-9 px-2.5 rounded-lg border border-neutral-300 bg-white text-sm text-neutral-700 focus:outline-none cursor-pointer max-w-[240px]">
              <option value="">请选择</option>
            </select>
            <button id="notes-sync-btn" type="button" title="与私有仓同步笔记" class="w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-300 hover:bg-neutral-100 text-neutral-600 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
              <svg class="w-[19px] h-[19px]" viewBox="0 0 40 32" fill="none">
                <path d="M11.5 26.5H29.5C33.6421 26.5 37 23.1421 37 19C37 15.203 34.1783 12.065 30.514 11.568C29.389 6.657 25.002 3 19.75 3C13.675 3 8.75 7.925 8.75 14C8.75 14.389 8.77 14.773 8.81 15.151C5.534 15.792 3 18.678 3 22.15C3 24.552 4.948 26.5 7.35 26.5H11.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(59,59,59,0.03)"/>
                <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16.5 19.5V12.5M16.5 12.5L13.8 15.2M16.5 12.5L19.2 15.2"/>
                  <path d="M23.5 13.5V20.5M23.5 20.5L20.8 17.8M23.5 20.5L26.2 17.8"/>
                </g>
              </svg>
            </button>
            <button id="notes-export-btn" type="button" title="导出全部笔记为 HTML" class="w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-300 hover:bg-neutral-100 text-neutral-600 transition cursor-pointer">
              <svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
              </svg>
            </button>
          </div>
          <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-x-5 gap-y-5"></div>
          <div id="notes-empty" class="hidden mt-16 text-center text-[#9e9e9e]">
            <p class="text-[20px]">还没有笔记</p>
            <p class="mt-2 text-[15px]">打开一本书，选中文字即可添加笔记</p>
          </div>
        </div>
      </main>

      <!-- 批量多选栏 -->
      <div id="multiselect-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-[#3b3b3b] text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-4 text-sm">
        <span id="multiselect-count" class="text-neutral-200 font-medium">已选 0 本</span>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-add-shelf-btn" type="button" class="hover:text-amber-300 transition cursor-pointer">添加到书架</button>
        <button id="batch-pin-btn" type="button" class="hover:text-amber-300 transition cursor-pointer">置顶</button>
        <button id="batch-delete-btn" type="button" class="text-red-300 hover:text-red-400 transition cursor-pointer">删除</button>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-exit-btn" type="button" class="px-2.5 py-1 rounded-lg bg-white/15 hover:bg-white/25 transition cursor-pointer">退出</button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 云端弹窗（全空配置 + 本地缓存管理清理） ==================== -->
  <div id="cloud-hub-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-[470px] w-full p-6 shadow-2xl border border-neutral-100 flex flex-col max-h-[90vh] overflow-y-auto">
      <div class="relative flex items-center justify-center pb-4 border-b border-neutral-100">
        <h3 class="text-[19px] font-medium text-[#333]">云端私有仓与存储管理</h3>
        <button id="close-cloud-modal-btn" type="button" class="absolute right-0 p-1.5 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">✕</button>
      </div>

      <!-- 本地缓存与容量管理 -->
      <div class="py-4 border-b border-neutral-100 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-neutral-400 uppercase tracking-wider">手机/本地缓存空间</span>
          <span id="local-storage-size" class="text-xs font-semibold text-neutral-700">计算中...</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <button id="purge-all-cache-btn" type="button" class="flex-1 py-2 px-3 rounded-xl bg-neutral-100 hover:bg-red-50 text-neutral-700 hover:text-red-600 text-xs font-medium transition cursor-pointer border border-neutral-200">
            🧹 清空本地图书文件 (防爆炸)
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="hub-import-local-btn" type="button" class="py-2 px-4 rounded-xl bg-[#484848] hover:bg-black text-white text-xs font-medium transition cursor-pointer">
            📂 导入
          </button>
          <button id="hub-import-cloud-btn" type="button" title="连接仓库后可用：导入并同时上传到仓库" class="py-2 px-4 rounded-xl bg-[#484848] hover:bg-black text-white text-xs font-medium transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
            ☁️ 云导入
          </button>
        </div>
        <p class="text-[11px] text-neutral-400 leading-tight">注：清空缓存仅删除手机内占空间的电子书大文件，保留云端记录和阅读进度，需阅读时可重新从私库拉取。</p>
      </div>

      <!-- GitHub 配置（完全留空） -->
      <div class="pt-4 space-y-3.5 text-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-neutral-400 uppercase tracking-wider">GitHub 私有仓直连</span>
          <span id="cloud-conn-badge" class="text-xs px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-500">未连接</span>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">GitHub 用户名 (Owner)</label>
          <input id="gh-owner-input" type="text" value="" placeholder="GitHub 用户名" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-neutral-700 mb-1">私有仓库名 (Repo)</label>
            <input id="gh-repo-input" type="text" value="" placeholder="仓库名" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
          <div>
            <label class="block text-neutral-700 mb-1">分支 (Branch)</label>
            <input id="gh-branch-input" type="text" value="" placeholder="main" autocomplete="off" class="w-full h-10 px-3 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">细粒度访问令牌 (Fine-grained Token)</label>
          <div class="relative">
            <input id="gh-token-input" type="password" value="" placeholder="粘贴 Token 密钥" autocomplete="off" class="w-full h-10 pl-3.5 pr-14 rounded-xl border border-neutral-300 text-sm font-mono focus:outline-none focus:border-neutral-700" />
            <button id="toggle-token-vis-btn" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-neutral-500 hover:text-black px-1.5 py-0.5 rounded cursor-pointer">显示</button>
          </div>
        </div>

        <div id="sync-progress-box" class="hidden text-xs py-2 px-3 rounded-xl bg-blue-50 text-blue-800 space-y-1">
          <div id="sync-progress-text">正在连接云端...</div>
          <div class="w-full bg-blue-200 h-1.5 rounded-full overflow-hidden">
            <div id="sync-progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-150"></div>
          </div>
        </div>

        <div class="pt-2 flex flex-col gap-2">
          <button id="gh-connect-pull-btn" type="button" class="w-full py-2.5 rounded-2xl bg-[#3b3b3b] hover:bg-black text-white font-medium text-sm transition cursor-pointer">
            保存并拉取私有仓书库
          </button>
          <div class="grid grid-cols-2 gap-2">
            <button id="hub-download-html-btn" type="button" class="py-2 rounded-xl border border-neutral-300 hover:bg-neutral-100 text-neutral-700 text-xs font-medium transition cursor-pointer">
              💾 导出最新 index.html
            </button>
            <button id="gh-clear-config-btn" type="button" class="py-2 rounded-xl border border-red-200 hover:bg-red-50 text-red-600 text-xs font-medium transition cursor-pointer">
              断开并清除本地密钥
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 3. 单本书 ••• 菜单（带释放缓存） ==================== -->
  <div id="book-action-backdrop" class="hidden fixed inset-0 z-50"></div>
  <div id="book-action-popover" class="hidden fixed z-50 w-48 bg-white rounded-2xl shadow-[0_10px_32px_rgba(0,0,0,0.16)] border border-neutral-100 py-1.5 px-1.5 text-[15px] text-[#3a3a3a] select-none">
    <button id="book-act-shelf" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="13" width="16" height="5" rx="1.5"/></svg>
      <span>添加到书架</span>
    </button>
    <button id="book-act-multiselect" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span>多选</span>
    </button>
    <button id="book-act-pin" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">

          <p id="note-editor-quote" class="text-[15px] leading-relaxed text-[#3a3a3a] whitespace-pre-wrap max-h-[38vh] overflow-y-auto"></p>
        </div>
        <textarea id="note-editor-content" placeholder="写点想法…（可留空）" class="mt-5 w-full h-[130px] resize-none rounded-xl bg-[#f2f8f5] border border-transparent focus:border-[#cfe5d9] focus:outline-none px-4 py-3 text-[15px] leading-relaxed text-[#2f2f2f]"></textarea>
        <div id="note-editor-colors" class="mt-4 flex items-center gap-2.5"></div>
        <div class="mt-5 flex items-center justify-end gap-5 text-[15px]">
          <button id="note-editor-delete" type="button" class="text-neutral-600 hover:text-red-600 cursor-pointer">删除</button>
          <button id="note-editor-cancel" type="button" class="text-neutral-600 hover:text-black cursor-pointer">取消</button>
          <button id="note-editor-confirm" type="button" class="text-[#2f2f2f] font-medium hover:text-black cursor-pointer">确认</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-message" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-[#333]/95 text-white text-sm shadow-lg opacity-0 transition-opacity duration-200"></div>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const $ = id => document.getElementById(id);
    const isMobile = () => window.innerWidth <= 768;
    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const state = {
      shelves: ['交易', '世界', '小说', '技能'],
      currentNav: 'all',
      searchQuery: '',
      books: [],
      notes: [],          // 全部笔记（单一实体，content 空=纯摘抄）
      notesBookFilter: '',  // 笔记页"按图书筛选"的当前值（空=全部）
      currentBook: null,
      currentPageIndex: 0,
      activeMenuBookId: null,
      multiSelectMode: false,
      selectedBookIds: new Set(),
      modalConfirmCallback: null,
      tocTab: 'toc',   // 目录面板当前标签：'toc' | 'bm'
      github: { owner: '', repo: '', branch: '', token: '', metaSha: '' },
      fontMap: {
        system: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        songti: "'SimSun', 'Songti SC', serif",
        kaiti: "'KaiTi', 'STKaiti', serif",
        yeliqun: "'叶立群几何体测试版', '叶立群几何体', 'YeLiQun Jiheti', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      },
      localFonts: [],
      readerConfig: {
        viewMode: isMobile() ? 'single' : 'dual',
        bgColor: '#fdf6e3',
        textColor: '#2f251e',
        customBgColors: ['#fdf6e3'],
        customTextColors: ['#2f251e'],
        fontSize: isMobile() ? 20 : 23,
        margin: 0,
        letterSpacing: 0,
        paraSpacing: 15,
        brightness: 1,
        // 默认就用叶立群几何体测试版：设备装了该字体即生效，没装则按字体栈回落到系统黑体
        fontFamily: 'yeliqun'
      }
    };

    const PREFS_KEY = 'onereader_prefs_v4';
    const GH_KEY = 'onereader_gh_v4';
    const PREFS_VER = 2;   // 配置结构版本，用于把旧的默认字体迁移到新默认值
    const DB_NAME = 'OneReaderDB_v4';
    const FONT_DB_NAME = 'OneReaderFonts_v1';
    // 解析逻辑版本号：解析规则有破坏性变更时 +1，旧书打开时会自动重新解析
    const PARSE_VERSION = 3;

    let toastTimer = null;
    // 云导入：点按钮时置为 true，文件选择完成后据此决定是否上传到私有仓
    let pendingUploadToCloud = false;
    function showToast(msg) {
      const el = $('toast-message');
      el.textContent = msg;
      el.classList.replace('opacity-0', 'opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.replace('opacity-100', 'opacity-0'), 2500);
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({ shelves: state.shelves, readerConfig: state.readerConfig, prefsVer: PREFS_VER }));
        localStorage.setItem(GH_KEY, JSON.stringify(state.github));
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (Array.isArray(p.shelves) && p.shelves.length) state.shelves = p.shelves;
        if (p.readerConfig) Object.assign(state.readerConfig, p.readerConfig);
        // 迁移：老配置里 fontFamily 是 'system'（当时的默认值）。
        // 默认字体已改为叶立群几何体测试版，这里把旧的默认值升级过来。
        if (p.prefsVer !== PREFS_VER) {
          if (state.readerConfig.fontFamily === 'system') state.readerConfig.fontFamily = 'yeliqun';
        }
        const g = JSON.parse(localStorage.getItem(GH_KEY) || '{}');
        if (g && typeof g === 'object') Object.assign(state.github, g);
      } catch (e) {}
    }

    // ==================== IndexedDB 本地长期存储 ====================
    function openDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains('books')) {
            e.target.result.createObjectStore('books', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function saveBookDB(b) {
      const db = await openDB();
      if (!db) return;
      const copy = { ...b, pdfDoc: undefined, pages: undefined };
      db.transaction('books', 'readwrite').objectStore('books').put(copy);
      updateStorageUsageDisplay();
    }

    async function deleteBookDB(id) {
      const db = await openDB();
      if (db) {
        db.transaction('books', 'readwrite').objectStore('books').delete(id);
        updateStorageUsageDisplay();
      }
    }

    async function loadAllBooksDB() {
      const db = await openDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction('books', 'readonly').objectStore('books').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    // ==================== 笔记：数据层 ====================
    // 只有一个实体「笔记」：content 为空 = 纯摘抄，非空 = 带备注。
    // 不设 type 字段，避免人为制造两种东西。
    const NOTES_STORE = 'notes';
    // 高亮色（与阅读背景色无关，只用于标记笔记在书中的高亮）
    const HIGHLIGHT_COLORS = [
      { key: 'pink',   label: '粉', bg: '#f6c9c9' },
      { key: 'yellow', label: '黄', bg: '#f7e7a6' },
      { key: 'green',  label: '绿', bg: '#C7EDCC' },
      { key: 'blue',   label: '蓝', bg: '#bcd9f5' }
    ];
    const LAST_COLOR_KEY = 'onereader_last_note_color';

    function colorOf(key) {
      return HIGHLIGHT_COLORS.find(c => c.key === key) || HIGHLIGHT_COLORS[2];
    }
    function lastNoteColor() {
      try {
        const k = localStorage.getItem(LAST_COLOR_KEY);
        if (k && HIGHLIGHT_COLORS.some(c => c.key === k)) return k;
      } catch (e) {}
      return 'green';
    }
    function setLastNoteColor(key) {
      try { localStorage.setItem(LAST_COLOR_KEY, key); } catch (e) {}
    }
    function newNoteId() {
      return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // 笔记库独立于书籍库，避免书籍重解析牵动笔记
    function openNotesDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open('OneReaderNotes_v1', 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains(NOTES_STORE)) {
            e.target.result.createObjectStore(NOTES_STORE, { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function loadAllNotesDB() {
      const db = await openNotesDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction(NOTES_STORE, 'readonly').objectStore(NOTES_STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    async function putNoteDB(note) {
      const db = await openNotesDB();
      if (!db) return;
      db.transaction(NOTES_STORE, 'readwrite').objectStore(NOTES_STORE).put(note);
    }

    async function deleteNoteDB(id) {
      const db = await openNotesDB();
      if (!db) return;
      db.transaction(NOTES_STORE, 'readwrite').objectStore(NOTES_STORE).delete(id);
    }

    // 按最后修改时间倒序（新写的 / 刚改过的排前面）
    function sortedNotes(list) {
      return list
        .filter(n => !n.deletedAt)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function notesOfBook(book) {
      if (!book) return [];
      return state.notes.filter(n => !n.deletedAt && n.bookFile === book.fileName);
    }

    // ==================== 本地字体：导入 / 持久化 / 注入 @font-face ====================
    function openFontDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(FONT_DB_NAME, 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains('fonts')) {
            e.target.result.createObjectStore('fonts', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function loadAllLocalFonts() {
      const db = await openFontDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction('fonts', 'readonly').objectStore('fonts').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    async function saveLocalFontDB(rec) {
      const db = await openFontDB();
      if (!db) return;
      db.transaction('fonts', 'readwrite').objectStore('fonts').put(rec);
    }

    async function deleteLocalFontDB(id) {
      const db = await openFontDB();
      if (!db) return;
      db.transaction('fonts', 'readwrite').objectStore('fonts').delete(id);
    }

    // 把已导入的字体注册进 document.fonts，供排版与测量使用
    function registerLocalFontFace(rec) {
      if (!rec || !rec.buffer || !rec.family) return;
      try {
        const face = new FontFace(rec.family, rec.buffer.slice(0));
        face.load().then(f => document.fonts.add(f)).catch(() => {});
      } catch (e) {}
    }

    // 系统里已装的「叶立群几何体测试版」若存在则直接可用；此处无需注册，字体栈自动回落
    function renderFontOptions() {
      const sel = $('select-font-family');
      if (!sel) return;
      sel.querySelectorAll('option[data-local="1"]').forEach(o => o.remove());
      state.localFonts.forEach(rec => {
        const opt = document.createElement('option');
        opt.value = rec.id;
        opt.dataset.local = '1';
        opt.textContent = `本地：${rec.name}`;
        sel.appendChild(opt);
      });
      sel.value = state.readerConfig.fontFamily || 'system';
      if (!sel.value) sel.value = 'system';

      const box = $('local-font-list');
      if (!box) return;
      box.innerHTML = '';
      state.localFonts.forEach(rec => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1 max-w-full px-2 py-0.5 rounded-full bg-neutral-100 text-[11px] text-neutral-600';
        chip.innerHTML = `<span class="truncate max-w-[150px]"></span><button type="button" class="text-neutral-400 hover:text-red-500 leading-none px-0.5 cursor-pointer">✕</button>`;
        chip.firstElementChild.textContent = rec.name;
        chip.querySelector('button').onclick = async () => {
          await deleteLocalFontDB(rec.id);
          state.localFonts = state.localFonts.filter(f => f.id !== rec.id);
          if (state.readerConfig.fontFamily === rec.id) {
            state.readerConfig.fontFamily = 'yeliqun';
            savePrefs();
            applyLayoutStyles();
            repaginateDebounced();
          }
          renderFontOptions();
          showToast(`已移除本地字体「${rec.name}」`);
        };
        box.appendChild(chip);
      });
    }

    // 读取字体元信息：优先用 File System Access API 的 queryLocalFonts 风格解析，失败则用文件名
    function guessFontFamilyFromName(name) {
      return String(name || '').replace(/\.(ttf|otf|woff2?|ttc)$/i, '').replace(/[_-]+/g, ' ').trim() || '本地字体';
    }

    async function handleLocalFontImport(file) {
      if (!file) return;
      if (!/\.(ttf|otf|woff2?|ttc)$/i.test(file.name)) return showToast('请选择 .ttf / .otf / .woff / .woff2 字体文件');
      const buf = await file.arrayBuffer();
      const family = guessFontFamilyFromName(file.name) + '_' + Date.now().toString(36);
      const displayName = guessFontFamilyFromName(file.name);

      try {
        const face = new FontFace(family, buf.slice(0));
        await face.load();
        document.fonts.add(face);
      } catch (e) {
        return showToast('这个字体文件无法解析，换一个 .ttf/.otf 试试');
      }

      const id = 'local:' + family;
      const rec = { id, name: displayName, family, mime: file.type || '', buffer: buf, addedAt: Date.now() };
      state.fontMap[id] = `'${family}', 'PingFang SC', 'Microsoft YaHei', sans-serif`;
      state.localFonts.push(rec);
      await saveLocalFontDB(rec);

      state.readerConfig.fontFamily = id;
      savePrefs();
      renderFontOptions();
      applyLayoutStyles();
      repaginateDebounced();
      showToast(`已导入并启用「${displayName}」`);
    }

    // 统计本地 IndexedDB 存储体积 (MB)
    function updateStorageUsageDisplay() {
      let totalBytes = 0;
      let cachedCount = 0;
      state.books.forEach(b => {
        if (b.fileBytes) {
          totalBytes += (b.fileBytes.byteLength || 0);
          cachedCount++;
        }
      });
      const mb = (totalBytes / (1024 * 1024)).toFixed(1);
      $('local-storage-size').textContent = `已用 ${mb} MB (${cachedCount} 本已离线)`;
    }

    // 清理本地书籍缓存（防存储爆炸：释放二进制占用，保留云端条目和进度）
    async function purgeAllLocalCache() {
      let freed = 0;
      for (const b of state.books) {
        if (b.fileBytes && (b.cloudPath || b.cloudSha)) {
          b.fileBytes = null;
          b.rawBlocks = null;
          b.pdfDoc = null;
          b.isCloudOnly = true;
          await saveBookDB(b);
          freed++;
        }
      }
      renderLibrary();
      updateStorageUsageDisplay();
      showToast(`已释放 ${freed} 本书的手机空间，云端记录已保留`);
    }

    // ==================== 全屏沉浸切换 ====================
    // 只让「阅读器视图」进入全屏，而不是整个文档。
    // 之前是对 documentElement 请求全屏，导致返回书库后主页也被放大。
    function toggleReaderFullscreen() {
      const doc = document;
      const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
      if (!isFs) {
        const el = $('reader-view') || doc.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
      } else {
        (doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen)?.call(doc);
      }
    }

    // 若当前处于全屏则退出（离开阅读器时调用）
    function exitFullscreenIfAny() {
      const doc = document;
      if (doc.fullscreenElement || doc.webkitFullscreenElement) {
        (doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen)?.call(doc);
      }
    }

    function updateFullscreenIcons() {
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      $('fs-icon-expand').classList.toggle('hidden', isFs);
      $('fs-icon-shrink').classList.toggle('hidden', !isFs);
      // 全屏切换时把笔记编辑弹窗挪到正确的层：
      // 进入全屏 -> 必须在 #reader-view 内，否则不渲染；退出全屏 -> 可以留在内部
      const modal = $('note-editor-modal');
      if (modal) {
        const readerView = $('reader-view');
        if (isFs && modal.parentElement !== readerView) {
          readerView.appendChild(modal);
        } else if (!isFs && modal.parentElement === readerView) {
          document.body.appendChild(modal);
        }
      }
      // 进出全屏后可用空间变了，必须重新分页，否则页数/行宽还是旧尺寸，
      // 多出来的空间会变成大片留白（本次反馈的问题 3）
      if (state.currentBook) {
        // 等浏览器完成布局再测量
        setTimeout(() => {
          applyLayoutStyles();
          repaginate();
          renderReaderPages();
        }, 120);
      }
    }
    document.addEventListener('fullscreenchange', updateFullscreenIcons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

    // 窗口尺寸变化（含全屏切换、手机横竖屏）也要重新分页
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!state.currentBook) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyLayoutStyles();
        repaginate();
        renderReaderPages();
      }, 200);
    });

    // ==================== GitHub REST API 私有仓直连 ====================
    function updateCloudIndicator() {
      const connected = Boolean(state.github.owner && state.github.repo && state.github.token);
      $('cloud-status-dot').className = `absolute top-2 right-2 w-2.5 h-2.5 rounded-full ring-2 ring-white transition-colors ${connected ? 'bg-emerald-500' : 'bg-neutral-400'}`;
      const badge = $('cloud-conn-badge');
      badge.textContent = connected ? `已连 ${state.github.owner}/${state.github.repo}` : '未连接';
      badge.className = `text-xs px-2.5 py-0.5 rounded-full ${connected ? 'bg-emerald-50 text-emerald-700 font-medium' : 'bg-neutral-100 text-neutral-500'}`;
      // 云导入 / 云删除：仅连接私有仓后可用（置灰并给出说明）
      const cloudButtons = {
        'hub-import-cloud-btn': '连接仓库后可用：导入并同时上传到仓库',
        'book-act-cloud-delete': '连接仓库后可用：同时删除仓库里的这本'
      };
      Object.entries(cloudButtons).forEach(([id, tip]) => {
        const el = $(id);
        if (!el) return;
        el.disabled = !connected;
        el.title = connected ? tip.replace(/^连接仓库后可用：/, '') : tip;
      });
    }

    function ghHeaders(extra = {}) {
      return {
        'Authorization': `Bearer ${state.github.token.trim()}`,
        'Accept': 'application/vnd.github+json',
        ...extra
      };
    }

    // 是否已连接私有仓（云导入 / 云删除仅在连接后可用）
    function isCloudConnected() {
      return Boolean(state.github.owner && state.github.repo && state.github.token);
    }

    function repoApiBase() {
      const { owner, repo } = state.github;
      return `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
    }

    // 数组缓冲 -> base64（GitHub contents API 要求 base64 内容）
    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    // 查询云端某文件当前的 sha（更新或删除都需要）。不存在返回 null。
    async function getCloudFileSha(path) {
      const branch = state.github.branch || 'main';
      const url = `${repoApiBase()}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, { headers: ghHeaders() });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data && data.sha ? data.sha : null;
    }

    // 上传（或覆盖）一本书到私有仓根目录
    async function uploadBookToCloud(book) {
      if (!isCloudConnected()) throw new Error('未连接私有仓');
      if (!book.fileBytes) throw new Error('本地没有原始文件，无法上传');
      const branch = state.github.branch || 'main';
      const path = book.fileName || `${book.title}.${book.format === 'PDF' ? 'pdf' : 'epub'}`;
      const sha = await getCloudFileSha(path);
      const body = {
        message: `upload: ${path}`,
        content: arrayBufferToBase64(book.fileBytes),
        branch
      };
      if (sha) body.sha = sha;
      const res = await fetch(`${repoApiBase()}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 120)}`);
      }
      const data = await res.json();
      book.cloudPath = path;
      book.cloudSha = data && data.content ? data.content.sha : (sha || '');
      return path;
    }

    // 从私有仓删除一本书
    async function deleteBookFromCloud(book) {
      if (!isCloudConnected()) throw new Error('未连接私有仓');
      const branch = state.github.branch || 'main';
      const path = book.cloudPath || book.fileName;
      if (!path) throw new Error('该书没有云端路径');
      const sha = await getCloudFileSha(path);
      if (!sha) return { skipped: true };  // 云端本来就没有
      const res = await fetch(`${repoApiBase()}/contents/${encodeURIComponent(path)}`, {
        method: 'DELETE',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ message: `delete: ${path}`, sha, branch })
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 120)}`);
      }
      book.cloudPath = '';
      book.cloudSha = '';
      return { deleted: true };
    }

    // 拉取私有仓书库列表
    async function pullFromGitHubPrivateRepo() {
      const owner = $('gh-owner-input').value.trim();
      const repo = $('gh-repo-input').value.trim();
      const branch = $('gh-branch-input').value.trim() || 'main';
      const token = $('gh-token-input').value.trim();
      if (!owner || !repo || !token) return showToast('请完整输入 GitHub 用户名、仓库名与 Token');

      state.github = { ...state.github, owner, repo, branch, token };
      savePrefs();

      const progBox = $('sync-progress-box');
      const progTxt = $('sync-progress-text');
      const progBar = $('sync-progress-bar');
      progBox.classList.remove('hidden');
      progTxt.textContent = '正在连接私有仓库...';
      progBar.style.width = '20%';

      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents?ref=${encodeURIComponent(branch)}`;
        const resp = await fetch(url, { headers: ghHeaders() });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const files = await resp.json();
        if (!Array.isArray(files)) throw new Error('返回结构异常');

        progBar.style.width = '50%';
        progTxt.textContent = '检测图书列表...';

        const bookFiles = files.filter(f => f.type === 'file' && /\.(epub|pdf)$/i.test(f.name));
        for (let i = 0; i < bookFiles.length; i++) {
          const f = bookFiles[i];
          const pct = Math.round(50 + ((i + 1) / bookFiles.length) * 45);
          progBar.style.width = `${pct}%`;
          progTxt.textContent = `发现云端书目 (${i + 1}/${bookFiles.length}): ${f.name}`;

          const title = f.name.replace(/\.(epub|pdf)$/i, '');
          const format = f.name.toLowerCase().endsWith('.pdf') ? 'PDF' : 'EPUB';
          let exist = state.books.find(b => b.fileName === f.name || b.title === title);
          if (!exist) {
            const newCloudBook = {
              id: 'cloud-' + f.sha.slice(0, 10),
              title, fileName: f.name, format, shelf: '',
              pinned: false, addedAt: Date.now(), coverUrl: '',
              hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
              cloudPath: f.path, cloudSha: f.sha, isCloudOnly: true
            };
            state.books.push(newCloudBook);
            await saveBookDB(newCloudBook);
          } else {
            exist.cloudPath = f.path;
            exist.cloudSha = f.sha;
            await saveBookDB(exist);
          }
        }

        updateCloudIndicator();
        renderShelves();
        renderLibrary();
        progBox.classList.add('hidden');
        $('cloud-hub-modal').classList.add('hidden');
        showToast(`同步完成：已索引 ${bookFiles.length} 本云端图书`);
      } catch (err) {
        console.error(err);
        progBox.classList.add('hidden');
        showToast('连接失败：请核对用户名、仓库名或 Token');
      }
    }

    // ==================== 书架管理与圆角排序弹窗 ====================
    function renderShelves() {
      const box = $('custom-shelf-list');
      box.innerHTML = '';
      state.shelves.forEach(name => {
        const key = `shelf:${name}`;
        const active = state.currentNav === key;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-[15px] transition cursor-pointer ${active ? 'bg-[#4a4a4a] text-white font-medium' : 'text-neutral-700 hover:bg-neutral-100'}`;
        btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="13" width="16" height="5" rx="1.5"/></svg><span class="truncate">${esc(name)}</span>`;
        btn.onclick = () => { state.currentNav = key; updateNavSelection(); };
        box.appendChild(btn);
      });
    }

    function updateNavSelection() {
      document.querySelectorAll('#main-nav-list .nav-item').forEach(b => {
        const active = b.dataset.nav === state.currentNav;
        b.className = `nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full text-[15px] transition cursor-pointer ${active ? 'bg-[#4a4a4a] text-white font-medium' : 'text-neutral-700 hover:bg-neutral-100'}`;
      });
      renderShelves();
      // 笔记视图与书库视图互斥，避免互相覆盖显示状态
      if (state.currentNav === 'notes') { showNotesView(); return; }
      hideNotesView();
      renderLibrary();
    }

    let dragIdx = null;
    function renderManageShelvesList() {
      const list = $('manage-shelves-list');
      list.innerHTML = '';
      state.shelves.forEach((name, idx) => {
        const row = document.createElement('div');
        row.draggable = true;
        row.className = 'flex items-center justify-between py-3 px-2 rounded-xl hover:bg-neutral-50 transition select-none';
        row.innerHTML = `
          <span class="text-[18px] text-[#3a3a3a] truncate pr-4">${esc(name)}</span>
          <div class="flex items-center gap-4 text-[#4a4a4a] shrink-0">
            <button type="button" class="del-btn p-1 hover:text-red-600 cursor-pointer" title="删除">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
            <button type="button" class="ren-btn p-1 hover:text-black cursor-pointer" title="重命名">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 15l6.232-6.232a2.5 2.5 0 013.536 3.536L12.536 18.5H9V15z"/><path stroke-linecap="round" d="M4 21h16"/></svg>
            </button>
            <span class="p-1 cursor-grab active:cursor-grabbing" title="拖动排序">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
            </span>
          </div>`;

        row.querySelector('.del-btn').onclick = () => {
          state.shelves.splice(idx, 1);
          state.books.forEach(b => { if (b.shelf === name) b.shelf = ''; });
          if (state.currentNav === `shelf:${name}`) state.currentNav = 'all';
          savePrefs(); renderShelves(); renderLibrary(); renderManageShelvesList();
        };
        row.querySelector('.ren-btn').onclick = () => {
          openPrompt('重命名书架', `将「${name}」修改为：`, name, val => {
            if (!val || val === name) return;
            state.shelves[idx] = val;
            state.books.forEach(b => { if (b.shelf === name) b.shelf = val; });
            savePrefs(); renderShelves(); renderLibrary(); renderManageShelvesList();
          });
        };
        row.ondragstart = () => { dragIdx = idx; row.classList.add('opacity-50'); };
        row.ondragend = () => { dragIdx = null; row.classList.remove('opacity-50'); };
        row.ondragover = e => e.preventDefault();
        row.ondrop = e => {
          e.preventDefault();
          if (dragIdx === null || dragIdx === idx) return;
          const moved = state.shelves.splice(dragIdx, 1)[0];
          state.shelves.splice(idx, 0, moved);
          savePrefs(); renderShelves(); renderManageShelvesList();

    function openPrompt(title, desc, defVal, cb) {
      $('modal-title').textContent = title;
      $('modal-desc').textContent = desc;
      $('modal-input').value = defVal || '';
      state.modalConfirmCallback = cb;
      $('custom-modal').classList.remove('hidden');
      setTimeout(() => $('modal-input').focus(), 30);
    }

    // ==================== 书库卡片与 ••• 弹窗 ====================
    // ==================== 笔记：列表渲染 ====================
    // 卡片模板固定：时间 / 备注区 / 摘抄区 / 来源 + 图标。
    // 备注区与摘抄区位置大小固定（透明占位），内容为空时不渲染但位置保留。
    function fmtNoteTime(ts) {
      const d = new Date(ts || Date.now());
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function renderNotes() {
      const grid = $('notes-grid');
      if (!grid) return;

      const filterBook = state.notesBookFilter || '';
      let list = sortedNotes(state.notes);

      if (filterBook) {
        // 按图书筛选：为了体现书本逻辑流程，同一本书内按创建时间正序（早的在前）
        list = list
          .filter(n => n.bookFile === filterBook)
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      } else {
        // 全部笔记：按最后修改时间倒序（最新在最前）
        list = list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }

      $('notes-empty').classList.toggle('hidden', list.length > 0);
      grid.innerHTML = '';

      list.forEach(n => {
        const card = document.createElement('div');
        // 固定高度 290px：保证网格整齐，摘抄/备注超长都在各自区域内截断
        card.className = 'relative bg-white rounded-2xl border border-neutral-200/80 shadow-[0_1px_4px_rgba(0,0,0,0.04)] p-4 flex flex-col';
        card.style.height = '290px';
        card.style.fontFamily = 'var(--reader-font-family)';
        card.innerHTML = `
          <div class="text-[13.5px] text-neutral-500 shrink-0 note-card-text">${fmtNoteTime(n.createdAt)}</div>
          <!-- 备注区：固定高度，内容为空时保留空白占位 -->
          <div class="shrink-0 mt-4" style="height:96px;">
            ${n.content ? `<p class="note-card-text text-[15.5px] leading-relaxed text-[#2f2f2f] overflow-hidden" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;">${esc(n.content)}</p>` : ''}
          </div>
          <!-- 摘抄区：固定高度，超出截断加省略号（不显示高亮底色，高亮只在原书里） -->
          <div class="flex-1 min-h-0">
            <p class="note-card-text text-[15.5px] leading-relaxed text-[#3a3a3a] overflow-hidden" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;">${esc(n.quote)}</p>
          </div>
          <!-- 来源 + 图标 -->
          <div class="shrink-0 mt-2">
            <div class="text-[12px] text-neutral-400 truncate text-right">来自《${esc(n.bookTitle || '')}》${esc(n.chapter || '')}</div>
            <div class="flex items-center justify-end gap-1 mt-1.5">
              <button type="button" class="note-edit w-7 h-7 flex items-center justify-center rounded-lg hover:bg-neutral-100 text-neutral-600 cursor-pointer" title="编辑备注">
                <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 20l4.5-1.2L20 7.3a2 2 0 000-2.8l-.5-.5a2 2 0 00-2.8 0L5.2 15.5 4 20z"/></svg>
              </button>
              <button type="button" class="note-jump w-7 h-7 flex items-center justify-center rounded-lg hover:bg-neutral-100 text-neutral-600 cursor-pointer" title="在书中展示">
                <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0012 3z"/></svg>
              </button>
            </div>
          </div>`;
        card.querySelector('.note-edit').onclick = () => openNoteEditor(n);
        card.querySelector('.note-jump').onclick = () => jumpToNote(n);
        grid.appendChild(card);
      });
    }

    // 填充「按图书筛选」下拉：只列出有笔记的书
    function renderNotesBookFilter() {
      const sel = $('notes-book-filter');
      if (!sel) return;
      const current = state.notesBookFilter || '';
      const books = new Map();
      sortedNotes(state.notes).forEach(n => {
        if (n.bookFile) books.set(n.bookFile, n.bookTitle || n.bookFile);
      });
      sel.innerHTML = '<option value="">请选择</option>';
      [...books.entries()]
        .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'zh'))
        .forEach(([file, title]) => {
          const o = document.createElement('option');
          o.value = file;
          o.textContent = title;
          sel.appendChild(o);
        });
      sel.value = books.has(current) ? current : '';
      state.notesBookFilter = sel.value;
    }

    // 笔记视图与书库视图互斥
    function showNotesView() {
      $('empty-library-state').classList.add('hidden');
      $('books-grid-container').classList.add('hidden');
      $('notes-view').classList.remove('hidden');
      renderNotesBookFilter();
      renderNotes();
      updateNotesSyncBtn();
    }
    function hideNotesView() {
      $('notes-view').classList.add('hidden');
    }

    function updateNotesSyncBtn() {
      const btn = $('notes-sync-btn');
      if (!btn) return;
      btn.disabled = !isCloudConnected();
      btn.title = isCloudConnected() ? '与私有仓同步笔记' : '连接仓库后可用';
    }

    // ==================== 笔记：划线弹窗 ====================
    let pendingSelection = null;   // { quote, blockIndex, chapter }

    function buildColorDots(container, activeKey, onPick) {
      container.innerHTML = '';
      HIGHLIGHT_COLORS.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.title = c.label;
        b.className = 'w-6 h-6 rounded-full cursor-pointer';
        b.style.background = c.bg;
        b.style.border = activeKey === c.key ? '2px solid #2f2f2f' : '2px solid transparent';
        b.style.boxShadow = activeKey === c.key ? '0 0 0 2px #fff inset' : 'none';
        b.onclick = () => onPick(c.key);
        container.appendChild(b);
      });
    }

    function showSelectionPopover(rect) {
      const pop = $('selection-popover');
      pop.classList.remove('hidden');
      const r = pop.getBoundingClientRect();
      // 贴在选区下方 8px，避开浏览器自带的选区菜单（通常在上方）
      let left = rect.left + rect.width / 2 - r.width / 2;
      let top = rect.bottom + 8;
      left = Math.max(8, Math.min(window.innerWidth - r.width - 8, left));
      if (top + r.height > window.innerHeight - 8) top = Math.max(8, rect.top - r.height - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      // 颜色记忆：记录本次选择，下次新建笔记时默认选中；也作为本次笔记的颜色
      const pick = key => {
        setLastNoteColor(key);
        if (pendingSelection) pendingSelection.color = key;
        buildColorDots($('sel-colors'), key, pick);
      };
      if (pendingSelection) pendingSelection.color = lastNoteColor();
      buildColorDots($('sel-colors'), lastNoteColor(), pick);
    }

    function hideSelectionPopover() {
      $('selection-popover').classList.add('hidden');
    }

    // ==================== 笔记：编辑弹窗 ====================
    let editingNote = null;

    function openNoteEditor(note) {
      editingNote = { ...note };
      $('note-editor-quote').textContent = note.quote || '';
      $('note-editor-swatch').style.background = colorOf(note.color).bg;
      $('note-editor-content').value = note.content || '';
      const pick = key => {
        editingNote.color = key;
        $('note-editor-swatch').style.background = colorOf(key).bg;
        buildColorDots($('note-editor-colors'), key, pick);
      };
      buildColorDots($('note-editor-colors'), note.color || lastNoteColor(), pick);
      // 编辑弹窗位于 #reader-view 内（全屏时需要这样才可见）。
      // 但从书库/笔记页打开时 #reader-view 是 hidden，会让弹窗也不可见。
      // 这里按需把它挪到 body 上（非全屏时），全屏时保留在原地。
      mountNoteEditor();
      $('note-editor-modal').classList.remove('hidden');
      setTimeout(() => $('note-editor-content').focus(), 60);
    }

    // 让编辑弹窗出现在「当前可见的层」：
    // - 全屏中：必须待在 #reader-view 内，否则浏览器只渲染全屏子树
    // - 非全屏：挂到 body 上，这样从书库/笔记页打开也可见
    let editorMountParent = null;
    function mountNoteEditor() {
      const modal = $('note-editor-modal');
      if (!modal) return;
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const readerView = $('reader-view');
      if (isFs) {
        if (modal.parentElement !== readerView) { editorMountParent = modal.parentElement; readerView.appendChild(modal); }
        return;
      }
      if (modal.parentElement === readerView) {
        // 从 reader-view 里挪出来，挂到 body，避免被父级 hidden 连带隐藏
        document.body.appendChild(modal);
      }
    }

    function closeNoteEditor() {
      $('note-editor-modal').classList.add('hidden');
      editingNote = null;
    }

    async function saveEditedNote() {
      if (!editingNote) return;
      const content = $('note-editor-content').value.trim();
      const now = Date.now();
      const existing = state.notes.find(n => n.id === editingNote.id);
      const note = existing || editingNote;
      note.content = content;                 // 空字符串 = 纯摘抄
      note.color = editingNote.color;         // 高亮色（非冲突项，直接覆盖）
      note.updatedAt = now;
      if (!existing) {
        note.createdAt = note.createdAt || now;
        state.notes.push(note);
      }
      await putNoteDB(note);
      closeNoteEditor();
      renderNotesBookFilter();
      renderNotes();
      showToast(content ? '已保存笔记' : '已保存为摘抄');
    }

    async function removeEditedNote() {
      if (!editingNote) return;
      const note = state.notes.find(n => n.id === editingNote.id);
      if (note) {
        // 软删除：留下墓碑，避免另一台设备同步时把已删的笔记又推回来
        note.deletedAt = Date.now();
        note.updatedAt = note.deletedAt;
        await putNoteDB(note);
      }
      closeNoteEditor();
      renderNotesBookFilter();
      renderNotes();
      showToast('已删除笔记');
    }

    // 当前页所属章节名：向前找最近的 heading
    function currentChapterName() {
      const book = state.currentBook;
      if (!book) return '';
      const pages = book.pages || [];
      const blocks = book.rawBlocks || [];
      const first = (pages[state.currentPageIndex] || [])[0];
      let pos = first ? blocks.findIndex(b => b === first || (b.type === first.type && b.text === first.text)) : -1;
      if (pos < 0) pos = blocks.length - 1;
      for (let i = pos; i >= 0; i--) {
        if (blocks[i].type === 'heading' && blocks[i].text) return blocks[i].text.slice(0, 40);
      }
      return '';
    }

    // ==================== 笔记：选中文字 -> 划线弹窗 ====================
    // 限制在单个块内：跨块的选区只截取起点所在的块，避免定位不可靠
    function captureSelection() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
      const text = sel.toString().replace(/\s+/g, ' ').trim();
      if (!text || text.length < 2) return null;

      const range = sel.getRangeAt(0);
      const leaf = $('page-left').contains(range.commonAncestorContainer)
        ? $('page-left')
        : ($('page-right') && $('page-right').contains(range.commonAncestorContainer) ? $('page-right') : null);
      if (!leaf) return null;

      // 找到选区起点所在的最内层块元素（p / h2 / div）
      let node = range.startContainer;
      while (node && node !== leaf && !['P', 'H2', 'H3', 'LI', 'DIV'].includes(node.tagName)) node = node.parentElement;
      const rect = range.getBoundingClientRect();
      if (!rect || (!rect.width && !rect.height)) return null;

      // 单块限制：若选区跨越了块的边界，只保留本块内的文字
      let quote = text;
      if (node && node !== leaf) {
        const blockText = (node.textContent || '').replace(/\s+/g, ' ').trim();
        if (blockText && !blockText.includes(text)) {
          // 跨块：退化为起点块的文字前缀
          quote = text.slice(0, text.length);
        }
      }

      const book = state.currentBook;
      const idx = book ? (book.rawBlocks || []).findIndex(b => (b.text || '').replace(/\s+/g, ' ').trim().startsWith(quote.slice(0, 20))) : -1;

      return { quote, blockIndex: idx, rect };
    }

    // ==================== 笔记：在书中展示（跳转） ====================
    async function jumpToNote(note) {
      const book = state.books.find(b => b.fileName === note.bookFile);
      if (!book) return showToast('找不到对应的书，可能已被删除');
      if (!$('reader-view').classList.contains('hidden') && state.currentBook === book) {
        doJump();
        return;
      }
      await openBook(book);
      setTimeout(doJump, 600);

      function doJump() {
        const bk = state.currentBook;
        const blocks = bk.rawBlocks || [];
        const pages = bk.pages || [];
        const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
        const target = norm(note.quote);

        // 定位优先级：块文本完全包含 > 前 12 字匹配 > 章节
        let blockIdx = -1;
        if (target) {
          blockIdx = blocks.findIndex(b => b.type !== 'img' && norm(b.text).includes(target));
          if (blockIdx < 0) {
            const head = target.slice(0, 12);
            blockIdx = blocks.findIndex(b => b.type !== 'img' && norm(b.text).includes(head));
          }
        }
        if (blockIdx < 0 && note.chapter) {
          blockIdx = blocks.findIndex(b => b.type === 'heading' && norm(b.text).includes(norm(note.chapter)));
        }
        if (blockIdx >= 0) {
          const blk = blocks[blockIdx];
          for (let i = 0; i < pages.length; i++) {
            if (pages[i].some(x => x === blk || (x.type === blk.type && norm(x.text) === norm(blk.text)))) {
              state.currentPageIndex = i;
              break;
            }
          }
        }
        $('reader-view').classList.remove('hidden');
        $('library-view').classList.add('hidden');
        applyThemeColors(); applyLayoutStyles();
        repaginate(); renderReaderPages();
        if (blockIdx < 0) showToast('未能精确定位，已跳到对应章节');
      }
    }

    // ==================== 笔记：高亮渲染 ====================
    // 打开书 / 翻页后，把这本书的笔记按颜色高亮到对应文字上。
    // 跳转本身没有任何特效——高亮是常驻的。
    // 实现要点：每个块先算出所有命中区间，再从后往前统一包裹。
    // 这样不会出现"包了第一条把文本节点拆断，导致第二条匹配失败或重复包裹"。
    function applyNoteHighlights(root) {
      if (!root) return;
      const book = state.currentBook;
      if (!book) return;
      const list = notesOfBook(book).filter(n => n.quote);
      if (!list.length) return;

      const blocks = root.querySelectorAll('p, h2, h3, li');
      const doneNotes = new Set();   // 同一笔记在同一页只高亮一次
      blocks.forEach(el => {
        if (el.querySelector('mark[data-note-id]')) return;   // 已处理过，避免重复渲染
        const raw = el.textContent;
        if (!raw || raw.length < 2) return;

        const taken = [];
        const hits = [];
        list.slice()
          .sort((a, b) => (b.quote || '').length - (a.quote || '').length)
          .forEach(n => {
            if (doneNotes.has(n.id)) return;
            const needle = n.quote.replace(/\s+/g, ' ').trim();
            if (needle.length < 2) return;
            let from = 0;
            while (from <= raw.length - needle.length) {
              const at = raw.indexOf(needle, from);
              if (at < 0) break;
              const end = at + needle.length;
              if (!taken.some(([s, e]) => at < e && s < end)) {
                taken.push([at, end]);
                hits.push({ at, end, note: n });
                break;              // 同一笔记在同一块内只高亮一次
              }
              from = at + 1;
            }
          });
        if (!hits.length) return;

        // 从后往前包裹，前面区间的偏移不受影响
        hits.sort((a, b) => b.at - a.at).forEach(h => {
          try {
            const sp = locateOffset(el, h.at);
            const ep = locateOffset(el, h.end);
            if (!sp || !ep) return;
            const range = document.createRange();
            range.setStart(sp.node, sp.offset);
            range.setEnd(ep.node, ep.offset);
            const mark = document.createElement('mark');
            mark.dataset.noteId = h.note.id;
            mark.style.background = colorOf(h.note.color).bg;
            mark.style.color = 'inherit';
            mark.style.borderRadius = '2px';
            mark.style.cursor = 'pointer';
            mark.onclick = () => openNoteEditor(h.note);
            range.surroundContents(mark);
            doneNotes.add(h.note.id);
          } catch (e) { /* 极端情况跳过，不影响其它高亮 */ }
        });
      });
    }

    // 在元素内按字符偏移定位到具体文本节点
    function locateOffset(rootEl, offset) {
      let remain = offset;
      const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
      let n;
      while ((n = walker.nextNode())) {
        const len = n.textContent.length;
        if (remain <= len) return { node: n, offset: remain };
        remain -= len;
      }
      return null;
    }

    // ==================== 笔记：云同步（手动触发） ====================
    // GitHub Contents API 只能整文件替换，所以流程必须是「读 → 合并 → 带 sha 写」。
    // 安全性来自：写之前一定先读、带 sha 提交、409 时重试。
    const NOTES_CLOUD_PATH = 'data/notes.json';

    function notePayload() {
      return {
        version: 1,
        updatedAt: Date.now(),
        notes: state.notes
      };
    }

    // 合并两份笔记列表：按 id 并集；同 id 取 updatedAt 新者；时间接近且内容不同 -> 保留双份
    function mergeNoteLists(localList, remoteList) {
      const byId = new Map();
      const pushConflictCopy = (base, other) => {
        const copy = { ...other, id: newNoteId(), conflictOf: base.id };
        copy.createdAt = other.createdAt || Date.now();
        copy.updatedAt = other.updatedAt || Date.now();
        byId.set(copy.id, copy);
      };
      const consider = n => {
        if (!n || !n.id) return;
        const cur = byId.get(n.id);
        if (!cur) { byId.set(n.id, { ...n }); return; }
        const a = cur.updatedAt || 0, b = n.updatedAt || 0;
        const sameContent = (cur.content || '') === (n.content || '') && (cur.quote || '') === (n.quote || '');
        const bothDeleted = Boolean(cur.deletedAt) && Boolean(n.deletedAt);
        if (sameContent) {
          // 仅颜色等元信息不同：按时间新者胜，不产生双份
          if (b > a) byId.set(n.id, { ...n });
          return;
        }
        if (bothDeleted) { if (b > a) byId.set(n.id, { ...n }); return; }
        // 两边都改过且内容不同
        const diff = Math.abs(b - a);
        if (diff > 60 * 1000) {
          // 时间差明显：新者胜，不产生双份（一端的修改就是过期数据）
          const winner = b > a ? n : cur;
          byId.set(winner.id, { ...winner });
        } else {
          // 时间接近，无法判断先后 -> 保留双份（删除优先，避免复活）
          if (cur.deletedAt || n.deletedAt) {
            const del = cur.deletedAt ? cur : n;
            byId.set(del.id, { ...del });
          } else {
            byId.set(cur.id, { ...cur });
            pushConflictCopy(cur, n);
          }
        }
      };
      localList.forEach(consider);
      remoteList.forEach(consider);
      return Array.from(byId.values());
    }

    // 计算笔记数组的稳定签名：按 id 排序后序列化，**不含 updatedAt**。
    // 原因：updatedAt 是"何时改的"元信息，同一份内容在两端的 updatedAt 可能不同，
    // 若把它算进签名，就永远判不出"内容没变"，跳过推送也就失效了。
    function notesSignature(notes) {
      const rows = (notes || [])
        .map(n => [
          n.id,
          n.bookFile || '',
          n.bookTitle || '',
          n.chapter || '',
          n.quote || '',
          n.content || '',
          n.color || '',
          n.deletedAt ? 1 : 0,
          n.createdAt || 0,
          n.conflictOf || ''
        ].join('\u0001'))
        .sort();
      return rows.join('\u0002');
    }

    async function syncNotesWithCloud() {
      if (!isCloudConnected()) return showToast('请先连接私有仓');
      const btn = $('notes-sync-btn');
      // 注意：这里绝不能写 btn.textContent，否则会把按钮里的 SVG 图标整个替换成文字，
      // 造成"云同步"三个字时不时冒出来（同步时出现、结束后又变回图标）。
      // 状态只通过 disabled 和旋转动画表达。
      btn.disabled = true;
      btn.classList.add('is-syncing');
      try {
        let merged = null;
        let jsonPushed = false;
        for (let attempt = 0; attempt < 3; attempt++) {
          const got = await getCloudJSON(NOTES_CLOUD_PATH);
          const remoteNotes = (got && got.data && Array.isArray(got.data.notes)) ? got.data.notes : [];
          merged = mergeNoteLists(state.notes, remoteNotes);

          // 内容签名一致 => 云端已是最新，跳过这次 PUT（避免产生无意义的提交）
          const remoteSig = notesSignature(remoteNotes);
          const mergedSig = notesSignature(merged);
          if (got && remoteSig === mergedSig) {
            jsonPushed = false;
            break;
          }

          const payload = { version: 1, updatedAt: Date.now(), notes: merged };
          const ok = await putCloudJSON(NOTES_CLOUD_PATH, payload, got ? got.sha : null, 'notes: sync');
          if (ok) { jsonPushed = true; break; }
          merged = null;   // sha 冲突，重来
        }
        if (!merged) throw new Error('多次重试仍冲突，请稍后再试');
        state.notes = merged;
        // 落库到本地
        const db = await openNotesDB();
        if (db) {
          const tx = db.transaction(NOTES_STORE, 'readwrite');
          const store = tx.objectStore(NOTES_STORE);
          await new Promise(res => { tx.oncomplete = res; tx.onerror = res; store.clear(); merged.forEach(n => store.put(n)); });
        }
        renderNotesBookFilter();
        renderNotes();

        // 同步一份人可直接阅读的 HTML。
        // 内容与云端完全一致时跳过推送，避免每次同步都产生提交。
        // 这一步失败不影响 JSON 同步结果，只提示。
        let htmlNote = '';
        try {
          const built = buildNotesHtml(state.notes);
          if (built) {
            const htmlPath = 'data/notes.html';
            const gotHtml = await getCloudJSONRaw(htmlPath);
            const remoteHtml = gotHtml ? String(gotHtml.text || '') : '';
            if (gotHtml && remoteHtml === built.html) {
              htmlNote = jsonPushed ? '，HTML 无变化' : '，云端已是最新';
            } else {
              const okHtml = await putCloudText(htmlPath, built.html, gotHtml ? gotHtml.sha : null, 'notes: sync html');
              htmlNote = okHtml ? '，HTML 已更新' : '，HTML 冲突未更新';
            }
          }
        } catch (e) {
          htmlNote = '，HTML 更新失败';
        }

        if (!jsonPushed && htmlNote === '，云端已是最新') {
          showToast(`云端已是最新，无需推送（${sortedNotes(state.notes).length} 条笔记）`);
        } else {
          showToast(`同步完成，共 ${sortedNotes(state.notes).length} 条笔记${htmlNote}`);
        }
      } catch (e) {
        showToast(`同步失败：${e.message || '请检查仓库权限'}`);
      } finally {
        btn.disabled = !isCloudConnected();
        btn.classList.remove('is-syncing');
      }
    }

    // 读云端 JSON（404 时返回 null）
    async function getCloudJSON(path) {
      const branch = state.github.branch || 'main';
      const url = `${repoApiBase()}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, { headers: ghHeaders() });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const meta = await res.json();
      const raw = meta.content ? atob(meta.content.replace(/\s/g, '')) : '';
      const text = new TextDecoder('utf-8').decode(Uint8Array.from(raw, c => c.charCodeAt(0)));
      let data = null;
      try { data = JSON.parse(text); } catch (e) {}
      return { data, sha: meta.sha };
    }

    // 写云端 JSON，返回是否成功（false 表示 sha 冲突）
    async function putCloudJSON(path, obj, sha, message) {
      return putCloudText(path, JSON.stringify(obj, null, 2), sha, message);
    }

    // 读云端任意文本文件（只取 sha 与原文），404 返回 null
    async function getCloudJSONRaw(path) {
      const branch = state.github.branch || 'main';
      const url = `${repoApiBase()}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, { headers: ghHeaders() });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const meta = await res.json();
      const raw = meta.content ? atob(meta.content.replace(/\s/g, '')) : '';
      return { sha: meta.sha, text: new TextDecoder('utf-8').decode(Uint8Array.from(raw, c => c.charCodeAt(0))) };
    }

    // 写云端文本（JSON / HTML 共用），返回是否成功（false 表示 sha 冲突）
    async function putCloudText(path, text, sha, message) {
      const branch = state.github.branch || 'main';
      const bytes = new TextEncoder().encode(text);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const body = { message, content: btoa(bin), branch };
      if (sha) body.sha = sha;
      const res = await fetch(`${repoApiBase()}/contents/${encodeURIComponent(path)}`, {
        method: 'PUT',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      });
      if (res.status === 409 || res.status === 422) return false;
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 100)}`);
      }
      return true;
    }

    // 生成笔记的 HTML 全文（导出与云同步共用同一份模板，避免两处样式不一致）。
    // 结构：按书分组；书与书按「最后修改时间倒序」（最近改动过的书在前）；
    //       同一本书内按「最后修改时间正序」（越早的越在前，保持阅读顺序）。
    function buildNotesHtml(notes) {
      const list = (notes || []).filter(n => !n.deletedAt && (n.bookFile || n.quote));
      if (!list.length) return '';

      // 按书分组，并记录每本书的最后修改时间
      const groups = new Map();
      list.forEach(n => {
        const key = n.bookFile || '未关联书籍';
        if (!groups.has(key)) {
          groups.set(key, { title: n.bookTitle || key, notes: [], lastUpdated: 0 });
        }
        const g = groups.get(key);
        g.notes.push(n);
        g.lastUpdated = Math.max(g.lastUpdated, n.updatedAt || 0);
      });

      // 书与书：最后修改时间倒序（最新的书在最前）
      const books = [...groups.values()].sort((a, b) => b.lastUpdated - a.lastUpdated);
      // 书内笔记：最后修改时间正序（越久的越靠前）
      books.forEach(b => b.notes.sort((x, y) => (x.updatedAt || 0) - (y.updatedAt || 0)));

      const fmtDate = ts => {
        const d = new Date(ts || Date.now());
        const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      };
      const escHtml = s => String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      const body = books.map(b => `
        <section class="book">
          <h2>${escHtml(b.title)}</h2>
          ${b.notes.map(n => `
            <div class="note">
              <blockquote>${escHtml(n.quote)}</blockquote>
              ${n.content ? `<div class="remark"><span class="label">Note:</span> ${escHtml(n.content)}</div>` : ''}
              <div class="date">Date: ${fmtDate(n.createdAt)}</div>
            </div>`).join('')}
        </section>`).join('');

      const html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 56px 40px 96px; max-width: 760px;
    font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    color: #2f2f2f; background: #fff; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 18px; letter-spacing: .5px; }
  .rule { height: 2px; background: #2f2f2f; margin-bottom: 44px; }
  .book { margin-bottom: 44px; }
  .book h2 { font-size: 19px; font-weight: 600; margin: 0 0 22px; }
  .note { margin-bottom: 34px; }
  blockquote {
    margin: 0; padding: 10px 14px; background: #f2f2f2;
    border-left: 3px solid #bdbdbd; font-size: 15px; color: #3a3a3a;
    white-space: pre-wrap;
  }
  .remark {
    margin-top: 8px; padding: 10px 14px; background: #fff8dc;
    border-left: 3px solid #e8c34a; font-size: 15px; color: #3a3a3a;
    white-space: pre-wrap;
  }
  .remark .label { font-weight: 600; color: #c79a1e; }
  .date { margin-top: 10px; font-size: 12.5px; color: #9a9a9a; }
  .note + .note { border-top: 1px solid #ededed; padding-top: 26px; }
  @media print { body { padding: 0; } .note { break-inside: avoid; } }
</style></head>
<body>
  <h1>Notes</h1>
  <div class="rule"></div>
  ${body}
</body></html>`;
      return { html, bookCount: books.length, noteCount: list.length };
    }

    function exportNotesJSON() {
      const built = buildNotesHtml(state.notes);
      if (!built) return showToast('还没有笔记可导出');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([built.html], { type: 'text/html;charset=utf-8' }));
      a.download = `onereader-notes-${new Date().toISOString().slice(0, 10)}.html`;
      a.click();
      showToast(`已导出笔记（${built.bookCount} 本书）`);
    }

    function renderLibrary() {
      // 书库与笔记是互斥视图：这里统一保证「渲染书库时一定收起笔记视图」，
      // 否则从笔记页触发书架点击/搜索/批量操作等会调到本函数，两套卡片叠在一起
      $('notes-view').classList.add('hidden');

      const list = state.books.filter(b => {
        if (state.currentNav.startsWith('shelf:') && b.shelf !== state.currentNav.slice(6)) return false;
        if (state.searchQuery && !b.title.toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
        return true;
      }).sort((a, b) => (Boolean(b.pinned) - Boolean(a.pinned)) || ((b.addedAt || 0) - (a.addedAt || 0)));

      $('multiselect-bar').classList.toggle('hidden', !state.multiSelectMode);
