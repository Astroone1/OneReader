    // ==================== 2. 导入并解析 PDF / EPUB ====================
    async function handleFilesImport(fileList) {
      if (!fileList || fileList.length === 0) return;

      for (const file of Array.from(fileList)) {
        const ext = file.name.split('.').pop().toLowerCase();
        const bookTitle = file.name.replace(/\.(pdf|epub)$/i, '');

        try {
          if (ext === 'epub') {
            if (!window.JSZip) {
              showToast('EPUB 解析组件正在加载，请稍后重试');
              return;
            }
            showToast(`正在解析 EPUB：${bookTitle}...`);
            const rawBlocks = await parseEpubFile(file);
            const newBook = {
              id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
              title: bookTitle,
              format: 'EPUB',
              shelf: '交易',
              favorite: false,
              isTrash: false,
              addedAt: Date.now(),
              rawBlocks,
              pages: []
            };
            state.books.push(newBook);
            renderLibrary();
            openBookInReader(newBook);
            showToast(`已导入并打开《${bookTitle}》`);
          } else if (ext === 'pdf') {
            if (!window.pdfjsLib) {
              showToast('PDF 解析组件正在加载，请稍后重试');
              return;
            }
            showToast(`正在载入 PDF：${bookTitle}...`);
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await window.pdfjsLib.getDocument({
              data: arrayBuffer,
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise;
            const newBook = {
              id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
              title: bookTitle,
              format: 'PDF',
              shelf: '交易',
              favorite: false,
              isTrash: false,
              addedAt: Date.now(),
              pdfDoc,
              numPages: pdfDoc.numPages
            };
            state.books.push(newBook);
            renderLibrary();
            openBookInReader(newBook);
            showToast(`已导入《${bookTitle}》（共 ${pdfDoc.numPages} 页）`);
          } else {
            showToast('仅支持导入 .pdf 或 .epub 格式文件');
          }
        } catch (err) {
          console.error('解析文件出错:', err);
          showToast(`解析《${file.name}》失败，请检查文件是否完整`);
        }
      }
    }

    // 路径规范化工具：处理 EPUB 内部相对路径与 URL 编码
    function resolveEpubPath(baseDir, relativeHref) {
      if (!relativeHref) return '';
      let clean = relativeHref.split('#')[0].split('?')[0];
      try {
        clean = decodeURIComponent(clean);
      } catch (e) {}
      if (clean.startsWith('/')) clean = clean.slice(1);

      const rawParts = (baseDir ? baseDir + clean : clean).split('/');
      const stack = [];
      for (const part of rawParts) {
        if (!part || part === '.') continue;
        if (part === '..') {
          stack.pop();
        } else {
          stack.push(part);
        }
      }
      return stack.join('/');
    }

    // 在 JSZip 实例中模糊匹配文件
    function findZipEntry(zip, targetPath) {
      if (!targetPath) return null;
      const direct = zip.file(targetPath);
      if (direct) return direct;

      const lowerTarget = targetPath.toLowerCase();
      const allKeys = Object.keys(zip.files);
      for (const k of allKeys) {
        if (zip.files[k].dir) continue;
        let decodedK = k;
        try {
          decodedK = decodeURIComponent(k);
        } catch (e) {}
        if (k.toLowerCase() === lowerTarget || decodedK.toLowerCase() === lowerTarget) {
          return zip.file(k);
        }
      }
      const baseName = lowerTarget.split('/').pop();
      for (const k of allKeys) {
        if (zip.files[k].dir) continue;
        if (k.toLowerCase().endsWith('/' + baseName) || k.toLowerCase() === baseName) {
          return zip.file(k);
        }
      }
      return null;
    }

    // 预处理 XHTML 字符串：修复自闭合 <title/>、<style/>、<head/> 等标签在 text/html 模式下吞掉后续 <body> 的问题
    function sanitizeXhtmlForHtmlParser(rawHtml) {
      if (!rawHtml) return '';
      return rawHtml
        .replace(/<\?xml[^>]*\?>/gi, '')
        .replace(/<(title|style|textarea|iframe|head|noscript)(\s[^>]*)?\/>/gi, '<$1$2></$1>')
        .replace(/<head[\s>][\s\S]*?<\/head>/gi, '');
    }

    // 解析章节 HTML/XHTML 文档
    function parseChapterDocument(parser, rawHtml) {
      const cleaned = sanitizeXhtmlForHtmlParser(rawHtml);
      try {
        const xmlDoc = parser.parseFromString(rawHtml, 'application/xhtml+xml');
        const parseErr = xmlDoc.querySelector('parsererror');
        if (!parseErr && (xmlDoc.body || xmlDoc.documentElement)) {
          return xmlDoc;
        }
      } catch (e) {}
      return parser.parseFromString(cleaned, 'text/html');
    }

    // 从单个章节 DOM 中提取所有结构化段落、标题、目录链接与插图
    function extractChapterBlocksFromDoc(doc, entryName, chapterDir, imageBlobMap) {
      const body =
        doc.body ||
        doc.getElementsByTagName('body')[0] ||
        doc.documentElement;
      if (!body) return [];

      body.querySelectorAll('script, style, head, title, meta, link').forEach(el => el.remove());

      const items = [];
      let chapterHeading = '';

      function walk(node) {
        if (!node) return;

        if (node.nodeType === Node.TEXT_NODE) {
          const txt = node.textContent.replace(/\s+/g, ' ').trim();
          if (txt) {
            items.push({ type: 'p', text: txt, sourceFile: entryName });
          }
          return;
        }

        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = (node.localName || node.tagName || '').toLowerCase();

        if (['script', 'style', 'head', 'title', 'meta', 'link', 'noscript'].includes(tag)) {
          return;
        }

        // 图片节点 <img> 或 SVG <image>
        if (tag === 'img' || tag === 'image') {
          const rawSrc =
            node.getAttribute('src') ||
            node.getAttribute('xlink:href') ||
            node.getAttribute('href') ||
            (node.getAttributeNS ? node.getAttributeNS('http://www.w3.org/1999/xlink', 'href') : '') ||
            '';
          if (rawSrc) {
            const resolvedImgPath = resolveEpubPath(chapterDir, rawSrc).toLowerCase();
            const imgFileName = resolvedImgPath.split('/').pop();
            const blobUrl = imageBlobMap[resolvedImgPath] || imageBlobMap[imgFileName];
            if (blobUrl) {
              items.push({ type: 'img', src: blobUrl, sourceFile: entryName });
            }
          }
          return;
        }

        // 标题节点 h1 - h6
        if (/^h[1-6]$/.test(tag)) {
          const txt = node.textContent.replace(/\s+/g, ' ').trim();
          if (txt) {
            if (!chapterHeading && items.length === 0) {
              chapterHeading = txt;
            } else {
              items.push({ type: 'heading', text: txt, sourceFile: entryName });
            }
          }
          return;
        }

        const BLOCK_TAGS = /^(div|p|h[1-6]|ul|ol|li|dl|dt|dd|blockquote|table|thead|tbody|tr|td|th|section|article|aside|header|footer|main|figure|figcaption|pre|hr)$/i;
        const hasChildBlocks = Array.from(node.children).some(child =>
          BLOCK_TAGS.test(child.localName || child.tagName || '')
        );
        const hasChildImg = Array.from(node.getElementsByTagName('*')).some(el => {
          const t = (el.localName || el.tagName || '').toLowerCase();
          return t === 'img' || t === 'image';
        });

        // 叶子块级节点
        if (!hasChildBlocks && !hasChildImg) {
          const hasBr = Array.from(node.children).some(
            c => (c.localName || c.tagName || '').toLowerCase() === 'br'
          );
          if (hasBr) {
            const cloned = node.cloneNode(true);
            cloned.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            const lines = cloned.textContent
              .split(/\n+/)
              .map(s => s.replace(/\s+/g, ' ').trim())
              .filter(Boolean);
            lines.forEach(line => {
              items.push({ type: 'p', text: line, sourceFile: entryName });
            });
            return;
          }

          const txt = node.textContent.replace(/\s+/g, ' ').trim();
          if (!txt) return;

          const linkEl = tag === 'a' ? node : node.querySelector('a[href]');
          if (linkEl && linkEl.textContent.trim().length >= txt.length * 0.6) {
            const href = linkEl.getAttribute('href') || '';
            items.push({
              type: 'link',
              text: txt,
              href: resolveEpubPath(chapterDir, href),
              sourceFile: entryName
            });
          } else if (tag === 'blockquote') {
            items.push({ type: 'quote', text: txt, sourceFile: entryName });
          } else {
            items.push({ type: 'p', text: txt, sourceFile: entryName });
          }
          return;
        }

        Array.from(node.childNodes).forEach(child => walk(child));
      }

      walk(body);

      // 兜底保障：若常规递归未提取到任何块，但 body.textContent 确实有文字，则按换行切分提取
      if (items.length === 0 && !chapterHeading) {
        const clonedBody = body.cloneNode(true);
        clonedBody.querySelectorAll('br, p, div, li, tr, h1, h2, h3, h4, h5, h6').forEach(el => {
          el.appendChild(doc.createTextNode('\n'));
        });
        const rawLines = (clonedBody.textContent || '')
          .split(/\n+/)
          .map(line => line.replace(/\s+/g, ' ').trim())
          .filter(Boolean);
        rawLines.forEach(line => {
          items.push({ type: 'p', text: line, sourceFile: entryName });
        });
      }

      const dedupedItems = [];
      for (const item of items) {
        const prev = dedupedItems[dedupedItems.length - 1];
        if (prev && prev.type === item.type && prev.text && prev.text === item.text) {
          continue;
        }
        dedupedItems.push(item);
      }

      const chapterBlocks = [];
      if (chapterHeading || dedupedItems.length > 0) {
        let chapterMarked = false;
        if (chapterHeading) {
          chapterBlocks.push({
            type: 'chapter_header',
            chapterNum: '',
            chapterTitle: chapterHeading,
            chapterSubtitle: '',
            sourceFile: entryName,
            forceNewPage: true
          });
          chapterMarked = true;
        }
        dedupedItems.forEach((item, idx) => {
          if (idx === 0 && !chapterMarked) {
            item.forceNewPage = true;
          }
          chapterBlocks.push(item);
        });
      }

      return chapterBlocks;
    }

    // 使用 JSZip 完整解析 EPUB
    async function parseEpubFile(file) {
      const zip = await window.JSZip.loadAsync(file);
      const parser = new DOMParser();

      const imageBlobMap = {};
      for (const [zipPath, zipEntry] of Object.entries(zip.files)) {
        if (zipEntry.dir) continue;
        if (/\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(zipPath)) {
          try {
            const blob = await zipEntry.async('blob');
            const url = URL.createObjectURL(blob);
            imageBlobMap[zipPath.toLowerCase()] = url;
            const shortName = zipPath.split('/').pop().toLowerCase();
            imageBlobMap[shortName] = url;
          } catch (e) {}
        }
      }

      let opfPath = '';
      const containerEntry = findZipEntry(zip, 'META-INF/container.xml');
      if (containerEntry) {
        const containerBytes = await containerEntry.async('uint8array');
        const containerXml = decodeTextBytes(containerBytes);
        const doc = parser.parseFromString(containerXml, 'application/xml');
        const rootfiles = doc.getElementsByTagName('*');
        for (let i = 0; i < rootfiles.length; i++) {
          if (rootfiles[i].localName === 'rootfile') {
            opfPath = rootfiles[i].getAttribute('full-path') || '';
            if (opfPath) break;
          }
        }
      }

      if (!opfPath) {
        opfPath = Object.keys(zip.files).find(name => /\.opf$/i.test(name)) || '';
      }

      const spineFiles = [];
      let baseDir = '';
      const opfEntry = findZipEntry(zip, opfPath);

      if (opfEntry) {
        const realOpfPath = opfEntry.name;
        baseDir = realOpfPath.includes('/')
          ? realOpfPath.substring(0, realOpfPath.lastIndexOf('/') + 1)
          : '';
        const opfBytes = await opfEntry.async('uint8array');
        const opfXml = decodeTextBytes(opfBytes);
        const opfDoc = parser.parseFromString(opfXml, 'application/xml');

        const manifestMap = {};
        const allEls = opfDoc.getElementsByTagName('*');

        for (let i = 0; i < allEls.length; i++) {
          const el = allEls[i];
          if (el.localName === 'item') {
            const id = el.getAttribute('id');
            const href = el.getAttribute('href');
            if (id && href) {
              manifestMap[id] = href;
            }
          }
        }

        for (let i = 0; i < allEls.length; i++) {
          const el = allEls[i];
          if (el.localName === 'itemref') {
            const idref = el.getAttribute('idref');
            if (idref && manifestMap[idref]) {
              spineFiles.push(resolveEpubPath(baseDir, manifestMap[idref]));
            }
          }
        }
      }

      const allCandidateFiles = Object.keys(zip.files)
        .filter(
          name =>
            !zip.files[name].dir &&
            /\.(xhtml|html|htm|xml)$/i.test(name) &&
            !/container\.xml$/i.test(name) &&
            !/toc\.ncx$/i.test(name) &&
            !/\.opf$/i.test(name)
        )
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      const filesToParse = spineFiles.length > 0 ? spineFiles : allCandidateFiles;

      async function parseFileList(fileList) {
        const blocks = [];
        const visited = new Set();
        for (const rawPath of fileList) {
          const entry = findZipEntry(zip, rawPath);
          if (!entry || visited.has(entry.name)) continue;
          visited.add(entry.name);

          const chapterDir = entry.name.includes('/')
            ? entry.name.substring(0, entry.name.lastIndexOf('/') + 1)
            : '';
          const rawBytes = await entry.async('uint8array');
          const rawHtml = decodeTextBytes(rawBytes);
          const htmlDoc = parseChapterDocument(parser, rawHtml);
          const chapterBlocks = extractChapterBlocksFromDoc(htmlDoc, entry.name, chapterDir, imageBlobMap);

          if (blocks.length === 0 && chapterBlocks.length > 0) {
            chapterBlocks[0].forceNewPage = false;
          }
          blocks.push(...chapterBlocks);
        }
        return blocks;
      }

      let extractedBlocks = await parseFileList(filesToParse);

      if (extractedBlocks.length === 0 && spineFiles.length > 0) {
        extractedBlocks = await parseFileList(allCandidateFiles);
      }

      if (extractedBlocks.length === 0 && Object.keys(imageBlobMap).length > 0) {
        const uniqueUrls = Array.from(new Set(Object.values(imageBlobMap)));
        uniqueUrls.forEach((url, idx) => {
          extractedBlocks.push({
            type: 'img',
            src: url,
            forceNewPage: idx > 0
          });
        });
      }

      if (extractedBlocks.length === 0) {
        extractedBlocks.push({
          type: 'chapter_header',
          chapterNum: '',
          chapterTitle: file.name.replace(/\.epub$/i, ''),
          chapterSubtitle: '',
          forceNewPage: false
        });
        extractedBlocks.push({
          type: 'p',
          text: '该电子书受 DRM 加密保护，未检测到可排版的章节内容。'
        });
      }

      return extractedBlocks;
    }

    // ==================== 3. 阅读器视图与真实 DOM 动态分页引擎 ====================
    function openBookInReader(book) {
      state.currentBook = book;
      state.currentPageIndex = 0;

      const libView = document.getElementById('library-view');
      const readerView = document.getElementById('reader-view');
      if (libView) libView.classList.add('hidden');
      if (readerView) readerView.classList.remove('hidden');

      const headerTitle = document.getElementById('header-book-title');
      if (headerTitle) headerTitle.textContent = book.title;

      applyReaderStyles();
      requestAnimationFrame(() => {
        repaginateAndRender(false);
      });
    }

    function applyReaderStyles() {
      const cfg = state.readerConfig;
      const root = document.documentElement;

      root.style.setProperty('--reader-bg', cfg.bgColor);
      root.style.setProperty('--reader-text', cfg.textColor);
      root.style.setProperty('--reader-font-size', cfg.fontSize + 'px');
      root.style.setProperty('--reader-margin', cfg.margin + 'px');
      root.style.setProperty('--reader-letter-spacing', cfg.letterSpacing + 'px');
      root.style.setProperty('--reader-para-spacing', cfg.paraSpacing + 'px');
      root.style.setProperty('--reader-page-width', cfg.pageWidth);
      root.style.setProperty('--reader-brightness', cfg.brightness);

      const selectedFontStack = state.fontMap[cfg.fontFamily] || state.fontMap.yeliqun;
      root.style.setProperty('--reader-font-family', selectedFontStack);

      const pageHeader = document.getElementById('reader-page-header');
      if (pageHeader) {
        pageHeader.classList.toggle('hidden', cfg.hideHeader);
      }

      document.querySelectorAll('.reader-footer-num').forEach(el => {
        el.classList.toggle('hidden', cfg.hideFooter);
      });

      document.querySelectorAll('.view-mode-btn').forEach(btn => {
        const active = btn.dataset.mode === cfg.viewMode;
        btn.classList.toggle('text-[#484848]', active);
        btn.classList.toggle('text-[#b5b5b5]', !active);
      });

      const basePadX = Math.max(18, 56 + Number(cfg.margin));
      const basePadY = Math.max(16, 40 + Number(cfg.margin) * 0.45);
      const pageLeft = document.getElementById('page-left');
      const pageRight = document.getElementById('page-right');
      const pageLeftWrapper = document.getElementById('page-left-wrapper');
      const pageRightWrapper = document.getElementById('page-right-wrapper');
      const spine = document.getElementById('dual-page-spine');

      if (!pageLeft || !pageRight || !pageLeftWrapper || !pageRightWrapper || !spine) return;

      pageLeft.style.padding = `${basePadY}px ${basePadX}px 8px ${basePadX}px`;
      pageRight.style.padding = `${basePadY}px ${basePadX}px 8px ${basePadX}px`;

      if (cfg.viewMode === 'dual') {
        spine.classList.remove('hidden');
        pageRightWrapper.classList.remove('hidden');
        pageLeftWrapper.classList.add('book-left-page');
        pageLeft.classList.add('paginated-leaf');
        pageLeft.style.overflowY = 'hidden';
        pageRight.classList.add('paginated-leaf');
        pageRight.style.overflowY = 'hidden';
      } else if (cfg.viewMode === 'single') {
        spine.classList.add('hidden');
        pageRightWrapper.classList.add('hidden');
        pageLeftWrapper.classList.remove('book-left-page');
        pageLeft.classList.add('paginated-leaf');
        pageLeft.style.overflowY = 'hidden';
      } else {
        spine.classList.add('hidden');
        pageRightWrapper.classList.add('hidden');
        pageLeftWrapper.classList.remove('book-left-page');
        pageLeft.classList.remove('paginated-leaf');
        pageLeft.style.overflowY = 'auto';
      }
    }

    function renderBlockItemHtml(item, availImgHeight) {
      if (!item) return '';
      if (item.type === 'chapter_header') {
        let html = `<div class="mt-4 mb-5">`;
        if (item.chapterNum) {
          html += `<div class="text-[#a89060] mb-4" style="font-size: calc(var(--reader-font-size) * 1.04);">${escapeHtml(item.chapterNum)}</div>`;
        }
        if (item.chapterTitle) {
          html += `<h1 class="font-semibold tracking-wide mb-5" style="font-size: calc(var(--reader-font-size) * 1.3); color: var(--reader-text); line-height: 1.4;">${escapeHtml(item.chapterTitle)}</h1>`;
        }
        if (item.chapterSubtitle) {
          html += `<div class="opacity-45 mb-7" style="font-size: calc(var(--reader-font-size) * 0.95);">${escapeHtml(item.chapterSubtitle)}</div>`;
        }
        if (item.authorNote) {
          html += `<div class="mb-3" style="font-size: var(--reader-font-size);">${escapeHtml(item.authorNote)}</div>`;
        }
        if (item.quoteBox) {
          html += `
            <div class="border-l-[3px] border-[#d3c6a6] bg-black/[0.025] py-4 px-5 italic opacity-85">
              ${escapeHtml(item.quoteBox)}
            </div>
          `;
        }
        html += `</div>`;
        return html;
      }

      if (item.type === 'link') {
        return `
          <div style="margin-bottom: calc(var(--reader-para-spacing) * 1.05);">
            <a
              href="javascript:void(0)"
              data-epub-href="${escapeHtml(item.href || '')}"
              class="epub-internal-link italic underline underline-offset-4 decoration-[1.5px] hover:opacity-75 transition cursor-pointer"
              style="color: var(--reader-text);"
            >${escapeHtml(item.text)}</a>
          </div>
        `;
      }

      if (item.type === 'heading') {
        return `<h2 class="font-semibold mt-3" style="margin-bottom: var(--reader-para-spacing); font-size: calc(var(--reader-font-size) * 1.15); line-height: 1.45;">${escapeHtml(item.text)}</h2>`;
      }

      if (item.type === 'quote') {
        return `
          <blockquote class="border-l-[3px] border-[#d3c6a6] bg-black/[0.025] py-3 px-5 italic opacity-85" style="margin-bottom: var(--reader-para-spacing);">
            ${escapeHtml(item.text)}
          </blockquote>
        `;
      }

      if (item.type === 'img') {
        const maxH = availImgHeight ? `${Math.max(120, availImgHeight - 24)}px` : '48vh';
        return `
          <div class="my-3 flex justify-center">
            <img src="${escapeHtml(item.src)}" alt="插图" style="max-height: ${maxH};" class="max-w-full object-contain rounded" />
          </div>
        `;
      }

      return `<p style="margin-bottom: var(--reader-para-spacing); text-align: justify;">${escapeHtml(item.text)}</p>`;
    }

    function buildEpubPageHtml(pageData) {
      if (!pageData || !pageData.items || pageData.items.length === 0) {
        return '<div class="h-full"></div>';
      }
      const cfg = state.readerConfig;
      const maxWidthPercent = Math.min(100, Math.max(45, (cfg.pageWidth / 1.2) * 92));

      let html = `<div class="mx-auto" style="max-width: ${maxWidthPercent}%; font-size: var(--reader-font-size); letter-spacing: var(--reader-letter-spacing); line-height: 1.72;">`;
      pageData.items.forEach(item => {
        html += renderBlockItemHtml(item, pageData.availHeight);
      });
      html += `</div>`;
      return html;
    }

    // 基于真实 DOM 高度的动态分页引擎
    function repaginateByDOM() {
      const book = state.currentBook;
      if (!book || book.format === 'PDF') return;

      const rawBlocks = book.rawBlocks || [];
      if (rawBlocks.length === 0) {
        book.pages = [];
        return;
      }

      const cfg = state.readerConfig;
      const pageLeft = document.getElementById('page-left');
      const measureBox = document.getElementById('page-measure-box');
      if (!pageLeft || !measureBox) return;

      const cs = window.getComputedStyle(pageLeft);
      const padTop = parseFloat(cs.paddingTop) || 0;
      const padBottom = parseFloat(cs.paddingBottom) || 0;
      const padLeft = parseFloat(cs.paddingLeft) || 0;
      const padRight = parseFloat(cs.paddingRight) || 0;

      const availWidth = Math.max(200, Math.floor(pageLeft.clientWidth - padLeft - padRight));
      const availHeight = Math.max(140, Math.floor(pageLeft.clientHeight - padTop - padBottom - 4));
      const maxWidthPercent = Math.min(100, Math.max(45, (cfg.pageWidth / 1.2) * 92));

      measureBox.style.width = `${availWidth}px`;
      measureBox.style.fontFamily = 'var(--reader-font-family)';
      measureBox.innerHTML = `<div id="measure-inner-col" class="mx-auto" style="max-width: ${maxWidthPercent}%; font-size: var(--reader-font-size); letter-spacing: var(--reader-letter-spacing); line-height: 1.72;"></div>`;
      const measureInner = document.getElementById('measure-inner-col');

      const pages = [];
      let currentItems = [];
      let currentSourceFile = '';
      let currentFirstBlockIdx = 0;

      function flushCurrentPage() {
        if (currentItems.length === 0) return;
        pages.push({
          items: currentItems,
          sourceFile: currentSourceFile,
          firstBlockIndex: currentFirstBlockIdx,
          availHeight
        });
        currentItems = [];
        currentSourceFile = '';
        measureInner.innerHTML = '';
      }

      const queue = rawBlocks.map((b, idx) => ({ ...b, _blockIdx: idx }));

      while (queue.length > 0) {
        const block = queue.shift();

        if (block.forceNewPage && currentItems.length > 0) {
          flushCurrentPage();
        }

        if (currentItems.length === 0) {
          currentFirstBlockIdx = block._blockIdx ?? 0;
          currentSourceFile = block.sourceFile || '';
        }

        const wrapper = document.createElement('div');
        wrapper.innerHTML = renderBlockItemHtml(block, availHeight);
        const node = wrapper.firstElementChild || wrapper;
        measureInner.appendChild(node);

        if (measureInner.scrollHeight <= availHeight) {
          currentItems.push(block);
          if (!currentSourceFile && block.sourceFile) {
            currentSourceFile = block.sourceFile;
          }
          continue;
        }

        measureInner.removeChild(node);

        if (block.type === 'p' || block.type === 'quote') {
          const chars = Array.from(block.text || '');
          if (chars.length > 12) {
            const testWrap = document.createElement('div');
            const probeBlock = { ...block, text: chars.slice(0, 8).join('') };
            testWrap.innerHTML = renderBlockItemHtml(probeBlock, availHeight);
            const probeNode = testWrap.firstElementChild || testWrap;
            measureInner.appendChild(probeNode);

            const canFitAtLeastOneLine = measureInner.scrollHeight <= availHeight;
            measureInner.removeChild(probeNode);

            if (!canFitAtLeastOneLine && currentItems.length > 0) {
              flushCurrentPage();
              queue.unshift({ ...block, forceNewPage: false });
              continue;
            }

            let low = 1;
            let high = chars.length;
            let bestLen = 0;

            const binNodeWrap = document.createElement('div');
            binNodeWrap.innerHTML = renderBlockItemHtml({ ...block, text: '' }, availHeight);
            const binNode = binNodeWrap.firstElementChild || binNodeWrap;
            measureInner.appendChild(binNode);

            while (low <= high) {
              const mid = (low + high) >> 1;
              binNode.textContent = chars.slice(0, mid).join('');
              if (measureInner.scrollHeight <= availHeight) {
                bestLen = mid;
                low = mid + 1;
              } else {
                high = mid - 1;
              }
            }

            measureInner.removeChild(binNode);

            if (bestLen > 0 && bestLen < chars.length) {
              const firstPartText = chars.slice(0, bestLen).join('');
              const restPartText = chars.slice(bestLen).join('').trimStart();

              currentItems.push({
                ...block,
                text: firstPartText
              });
              flushCurrentPage();

              if (restPartText.length > 0) {
                queue.unshift({
                  ...block,
                  text: restPartText,
                  isContinuation: true,
                  forceNewPage: false
                });
              }
              continue;
            }
          }
        }

        if (currentItems.length > 0) {
          flushCurrentPage();
          queue.unshift({ ...block, forceNewPage: false });
        } else {
          currentItems.push(block);
          flushCurrentPage();
        }
      }

      if (currentItems.length > 0) {
        flushCurrentPage();
      }

      measureBox.innerHTML = '';
      book.pages = pages;
    }

    function repaginateAndRender(preservePosition = true) {
      const book = state.currentBook;
      if (!book) return;

      if (book.format === 'PDF') {
        renderReaderPages();
        return;
      }

      let anchorBlockIdx = 0;
      if (preservePosition && book.pages && book.pages[state.currentPageIndex]) {
        anchorBlockIdx = book.pages[state.currentPageIndex].firstBlockIndex || 0;
      }

      repaginateByDOM();

      if (preservePosition && book.pages && book.pages.length > 0) {
        let targetPageIdx = 0;
        for (let i = 0; i < book.pages.length; i++) {
          if ((book.pages[i].firstBlockIndex || 0) <= anchorBlockIdx) {
            targetPageIdx = i;
          } else {
            break;
          }
        }
        state.currentPageIndex =
          state.readerConfig.viewMode === 'dual'
            ? Math.floor(targetPageIdx / 2) * 2
            : targetPageIdx;
      } else {
        state.currentPageIndex = 0;
      }

      renderReaderPages();
    }

    function bindEpubInternalLinks(container) {
      container.querySelectorAll('.epub-internal-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetHref = link.getAttribute('data-epub-href');
          const linkText = link.textContent.trim();
          const pages = (state.currentBook && state.currentBook.pages) || [];
          if (!pages.length) return;

          let foundIdx = -1;
          if (targetHref) {
            const targetFileName = targetHref.split('/').pop().toLowerCase();
            foundIdx = pages.findIndex(
              p =>
                p.sourceFile &&
                (p.sourceFile.toLowerCase() === targetHref.toLowerCase() ||
                  p.sourceFile.split('/').pop().toLowerCase() === targetFileName)
            );
          }

          if (foundIdx === -1 && linkText) {
            foundIdx = pages.findIndex((p, idx) => {
              if (idx <= state.currentPageIndex + 1) return false;
              return (
                p.items &&
                p.items.some(
                  it =>
                    it.type !== 'link' &&
                    ((it.chapterTitle && it.chapterTitle.includes(linkText)) ||
                      (it.text && it.text.includes(linkText)))
                )
              );
            });
          }

          if (foundIdx !== -1) {
            state.currentPageIndex =
              state.readerConfig.viewMode === 'dual'
                ? Math.floor(foundIdx / 2) * 2
                : foundIdx;
            renderReaderPages();
          } else {
            turnPage(1);
          }
        });
      });
    }

    async function renderPdfPageToContainer(pdfDoc, pageNumber, container) {
      container.innerHTML = '';
      if (pageNumber < 1 || pageNumber > pdfDoc.numPages) return;

      const isScrollMode = state.readerConfig.viewMode === 'scroll';
      const wrapper = document.createElement('div');
      wrapper.className = isScrollMode
        ? 'w-full flex items-center justify-center'
        : 'w-full h-full flex items-center justify-center overflow-hidden';
      const canvas = document.createElement('canvas');
      canvas.className = 'shadow-sm max-w-full max-h-full object-contain rounded';
      wrapper.appendChild(canvas);
      container.appendChild(wrapper);

      const page = await pdfDoc.getPage(pageNumber);
      const unscaledViewport = page.getViewport({ scale: 1 });
      const availW = Math.max(200, container.clientWidth - 32);
      const availH = Math.max(200, container.clientHeight - 24);

      const scale = isScrollMode
        ? 1.15 * Number(state.readerConfig.pageWidth)
        : Math.min(availW / unscaledViewport.width, availH / unscaledViewport.height);

      const viewport = page.getViewport({ scale });
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport }).promise;
    }

    async function renderReaderPages() {
      const book = state.currentBook;
      if (!book) return;

      const cfg = state.readerConfig;
      const pageLeft = document.getElementById('page-left');
      const pageRight = document.getElementById('page-right');
      const leftPageNumEl = document.getElementById('footer-left-page-num');
      const rightPageNumEl = document.getElementById('footer-right-page-num');
      if (!pageLeft || !pageRight || !leftPageNumEl || !rightPageNumEl) return;

      pageLeft.scrollTop = 0;
      pageRight.scrollTop = 0;

      if (book.format === 'PDF' && book.pdfDoc) {
        const total = book.numPages;
        if (cfg.viewMode === 'scroll') {
          pageLeft.innerHTML = '';
          for (let i = 1; i <= Math.min(total, 15); i++) {
            const holder = document.createElement('div');
            holder.className = 'mb-6';
            pageLeft.appendChild(holder);
            await renderPdfPageToContainer(book.pdfDoc, i, holder);
          }
          leftPageNumEl.textContent = `共 ${total} 页`;
        } else if (cfg.viewMode === 'dual') {
          const leftNum = state.currentPageIndex + 1;
          const rightNum = state.currentPageIndex + 2;
          await renderPdfPageToContainer(book.pdfDoc, leftNum, pageLeft);
          await renderPdfPageToContainer(book.pdfDoc, rightNum, pageRight);
          leftPageNumEl.textContent = `第${leftNum}页`;
          rightPageNumEl.textContent = rightNum <= total ? `第${rightNum}页` : '';
        } else {
          const pageNum = state.currentPageIndex + 1;
          await renderPdfPageToContainer(book.pdfDoc, pageNum, pageLeft);
          leftPageNumEl.textContent = `第${pageNum}页`;
        }
        return;
      }

      if (!book.pages || book.pages.length === 0) {
        repaginateByDOM();
      }
      const pages = book.pages || [];
      const total = pages.length;

      if (cfg.viewMode === 'scroll') {
        const maxWidthPercent = Math.min(100, Math.max(45, (cfg.pageWidth / 1.2) * 92));
        const allItemsHtml = (book.rawBlocks || []).map(item => renderBlockItemHtml(item)).join('');
        pageLeft.innerHTML = `<div class="mx-auto" style="max-width: ${maxWidthPercent}%; font-size: var(--reader-font-size); letter-spacing: var(--reader-letter-spacing); line-height: 1.72;">${allItemsHtml}</div>`;
        bindEpubInternalLinks(pageLeft);
        leftPageNumEl.textContent = `共 ${total} 页`;
      } else if (cfg.viewMode === 'dual') {
        pageLeft.innerHTML = buildEpubPageHtml(pages[state.currentPageIndex]);
        pageRight.innerHTML = buildEpubPageHtml(pages[state.currentPageIndex + 1]);
        bindEpubInternalLinks(pageLeft);
        bindEpubInternalLinks(pageRight);
        const p1 = state.currentPageIndex + 1;
        const p2 = state.currentPageIndex + 2;
        leftPageNumEl.textContent = `第${p1}页`;
        rightPageNumEl.textContent = p2 <= total ? `第${p2}页` : '';
      } else {
        pageLeft.innerHTML = buildEpubPageHtml(pages[state.currentPageIndex]);
        bindEpubInternalLinks(pageLeft);
        leftPageNumEl.textContent = `第${state.currentPageIndex + 1}页`;
      }
    }

    function turnPage(direction) {
      const book = state.currentBook;
      if (!book) return;
      const cfg = state.readerConfig;
      if (cfg.viewMode === 'scroll') return;

      const step = cfg.viewMode === 'dual' ? 2 : 1;
      const total = book.format === 'PDF' ? book.numPages : (book.pages ? book.pages.length : 0);
      const nextIdx = state.currentPageIndex + direction * step;

      if (nextIdx < 0) {
        showToast('已经是第一页');
        return;
      }
      if (nextIdx >= total) {
        showToast('已经是最后一页');
        return;
      }
      state.currentPageIndex = nextIdx;
      renderReaderPages();
    }

    // ==================== 4. 阅读选项：自定义背景色与文字色（还原图3） ====================
    function renderColorSwatches() {
      const cfg = state.readerConfig;
      const bgContainer = document.getElementById('bg-color-swatches');
      const textContainer = document.getElementById('text-color-swatches');
      if (!bgContainer || !textContainer) return;

      // 1) 背景色
      bgContainer.innerHTML = '';
      const addBgBtn = document.createElement('button');
      addBgBtn.type = 'button';
      addBgBtn.title = '添加自定义背景颜色';
      addBgBtn.className =
        'w-11 h-11 rounded-full bg-white border border-neutral-200 shadow-sm flex items-center justify-center text-[#554940] hover:bg-neutral-50 transition cursor-pointer';
      addBgBtn.innerHTML = `
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="5.5" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="12" cy="18.5" r="2"></circle>
        </svg>
      `;
      addBgBtn.addEventListener('click', () => {
        const pop = document.getElementById('add-bg-color-popover');
        if (pop) pop.classList.toggle('hidden');
      });
      bgContainer.appendChild(addBgBtn);

      const allBgColors = [
        ...cfg.presetBgColors.map(color => ({ color, isCustom: false })),
        ...cfg.customBgColors.map(color => ({ color, isCustom: true }))
      ];

      allBgColors.forEach(({ color, isCustom }) => {
        const selected = cfg.bgColor.toLowerCase() === color.toLowerCase();
        const light = isLightColor(color);
        const item = document.createElement('div');
        item.className = 'relative flex items-center justify-center';

        const circleBtn = document.createElement('button');
        circleBtn.type = 'button';
        circleBtn.style.backgroundColor = color;
        circleBtn.title = color;
        circleBtn.className = `w-11 h-11 rounded-full border border-neutral-200 flex items-center justify-center transition cursor-pointer ${
          selected ? 'swatch-selected' : 'hover:scale-105'
        }`;

        if (selected) {
          circleBtn.innerHTML = `
            <svg class="w-5 h-5 ${light ? 'text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.45)]' : 'text-white'}" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          `;
        }

        circleBtn.addEventListener('click', () => {
          state.readerConfig.bgColor = color;
          applyReaderStyles();
          renderColorSwatches();
        });
        item.appendChild(circleBtn);

        if (isCustom) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.title = `删除颜色 ${color}`;
          delBtn.className =
            'absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#9e9a93] hover:bg-neutral-700 text-white flex items-center justify-center text-[10px] leading-none shadow cursor-pointer';
          delBtn.innerHTML = '✕';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            cfg.customBgColors = cfg.customBgColors.filter(c => c.toLowerCase() !== color.toLowerCase());
            if (cfg.bgColor.toLowerCase() === color.toLowerCase()) {
              cfg.bgColor = cfg.customBgColors[0] || cfg.presetBgColors[0];
              applyReaderStyles();
            }
            renderColorSwatches();
          });
          item.appendChild(delBtn);
        }

        bgContainer.appendChild(item);
      });

      // 2) 文字色
      textContainer.innerHTML = '';
      const addTextBtn = document.createElement('button');
      addTextBtn.type = 'button';
      addTextBtn.title = '添加自定义文字颜色';
      addTextBtn.className =
        'w-11 h-11 rounded-full bg-white border border-neutral-200 shadow-sm flex items-center justify-center text-[#554940] hover:bg-neutral-50 transition cursor-pointer';
      addTextBtn.innerHTML = `
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="5.5" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="12" cy="18.5" r="2"></circle>
        </svg>
      `;
      addTextBtn.addEventListener('click', () => {
        const pop = document.getElementById('add-text-color-popover');
        if (pop) pop.classList.toggle('hidden');
      });
      textContainer.appendChild(addTextBtn);

      const allTextColors = [
        ...cfg.presetTextColors.map(color => ({ color, isCustom: false })),
        ...cfg.customTextColors.map(color => ({ color, isCustom: true }))
      ];

      allTextColors.forEach(({ color, isCustom }) => {
        const selected = cfg.textColor.toLowerCase() === color.toLowerCase();
        const light = isLightColor(color);
        const item = document.createElement('div');
        item.className = 'relative flex items-center justify-center';

        const circleBtn = document.createElement('button');
        circleBtn.type = 'button';
        circleBtn.style.backgroundColor = color;
        circleBtn.title = color;
        circleBtn.className = `w-11 h-11 rounded-full border border-neutral-200 flex items-center justify-center transition cursor-pointer ${
          selected ? 'swatch-selected' : 'hover:scale-105'
        }`;

        if (selected) {
          circleBtn.innerHTML = `
            <svg class="w-5 h-5 ${light ? 'text-neutral-800' : 'text-white'}" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          `;
        }

        circleBtn.addEventListener('click', () => {
          state.readerConfig.textColor = color;
          applyReaderStyles();
          renderColorSwatches();
        });
        item.appendChild(circleBtn);

        if (isCustom) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.title = `删除颜色 ${color}`;
          delBtn.className =
            'absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#9e9a93] hover:bg-neutral-700 text-white flex items-center justify-center text-[10px] leading-none shadow cursor-pointer';
          delBtn.innerHTML = '✕';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            cfg.customTextColors = cfg.customTextColors.filter(c => c.toLowerCase() !== color.toLowerCase());
            if (cfg.textColor.toLowerCase() === color.toLowerCase()) {
              cfg.textColor = cfg.customTextColors[0] || cfg.presetTextColors[0];
              applyReaderStyles();
            }
            renderColorSwatches();
          });
          item.appendChild(delBtn);
        }

        textContainer.appendChild(item);
      });
    }

    // 双向绑定滑块与输入框
    function bindSliderAndInput(sliderId, inputId, labelId, configKey, onAfterChange) {
      const slider = document.getElementById(sliderId);
      const input = document.getElementById(inputId);
      const label = document.getElementById(labelId);
      if (!slider || !input || !label) return;

      function updateValue(val) {
        state.readerConfig[configKey] = val;
        slider.value = val;
        input.value = val;
        label.textContent = val;
        applyReaderStyles();
        if (onAfterChange) onAfterChange(val);
      }

      slider.addEventListener('input', (e) => updateValue(e.target.value));
      input.addEventListener('change', (e) => {
        let v = parseFloat(e.target.value);
        const min = parseFloat(slider.min);
        const max = parseFloat(slider.max);
        if (isNaN(v)) v = state.readerConfig[configKey];
        v = Math.max(min, Math.min(max, v));
        updateValue(v);
      });
    }

    // ==================== 5. 事件绑定与初始化 ====================
    window.addEventListener('DOMContentLoaded', () => {
      renderShelves();
      renderLibrary();
      renderColorSwatches();

      // 侧边栏折叠切换
      bind('toggle-sidebar-btn', 'click', () => {
        const sb = document.getElementById('library-sidebar');
        if (sb) sb.classList.toggle('hidden');
      });

      // 主导航点击
      document.querySelectorAll('#main-nav-list .nav-item').forEach(btn => {
        btn.addEventListener('click', () => selectNav(btn.dataset.nav));
      });

      // 我的书架展开/收起
      bind('shelf-collapse-btn', 'click', () => {
        const container = document.getElementById('shelf-items-container');
        const chevron = document.getElementById('shelf-chevron');
        if (container) container.classList.toggle('hidden');
        if (chevron) chevron.classList.toggle('-rotate-90');
      });

      // 搜索框实时过滤
      bind('library-search-input', 'input', (e) => {
        state.searchQuery = e.target.value.trim();
        renderLibrary();
      });

      // 排序按钮
      bind('sort-books-btn', 'click', () => {
        state.books.reverse();
        renderLibrary();
        showToast('已切换图书排序');
      });

      // 主页顶部齿轮设置按钮
      bind('app-settings-btn', 'click', () => {
        showToast('导入并打开图书后，将鼠标移至右上角可打开阅读选项');
      });

      // 新建书架弹窗
      const modal = document.getElementById('custom-modal');
      const modalInput = document.getElementById('modal-input');
      bind('create-shelf-btn', 'click', () => {
        if (!modal || !modalInput) return;
        modalInput.value = '';
        modal.classList.remove('hidden');
        modalInput.focus();
      });
      bind('modal-cancel-btn', 'click', () => {
        if (modal) modal.classList.add('hidden');
      });
      bind('modal-confirm-btn', 'click', () => {
        if (!modal || !modalInput) return;
        const name = modalInput.value.trim();
        if (name && !state.shelves.includes(name)) {
          state.shelves.push(name);
          renderShelves();
          showToast(`已新建书架「${name}」`);
        }
        modal.classList.add('hidden');
      });

      // 管理书架与阅读统计轻提示
      bind('manage-shelf-btn', 'click', () => {
        showToast('点击左侧书架可筛选对应分类图书');
      });
      bind('reading-stats-btn', 'click', () => {
        showToast(`当前书库共 ${state.books.length} 本图书`);
      });

      // 右上角「导入图书」按钮与下拉菜单
      const fileInput = document.getElementById('file-upload-input');
      const dropdownMenu = document.getElementById('import-dropdown-menu');

      bind('import-book-btn', 'click', () => {
        if (fileInput) fileInput.click();
      });
      bind('import-dropdown-btn', 'click', (e) => {
        e.stopPropagation();
        if (dropdownMenu) dropdownMenu.classList.toggle('hidden');
      });
      bind('menu-import-local', 'click', () => {
        if (dropdownMenu) dropdownMenu.classList.add('hidden');
        if (fileInput) fileInput.click();
      });
      document.addEventListener('click', () => {
        if (dropdownMenu) dropdownMenu.classList.add('hidden');
      });

      bind('file-upload-input', 'change', (e) => {
        handleFilesImport(e.target.files);
        e.target.value = '';
      });

      // 支持全窗口拖拽导入 PDF / EPUB 文件
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFilesImport(e.dataTransfer.files);
        }
      });

      // 阅读器右上角悬浮按钮 -> 打开图3「阅读选项」侧边抽屉
      const drawer = document.getElementById('reader-settings-drawer');
      const backdrop = document.getElementById('settings-backdrop');
      const prevFloatBtn = document.getElementById('prev-page-btn');
      const nextFloatBtn = document.getElementById('next-page-btn');

      function openSettingsDrawer() {
        if (drawer) drawer.classList.remove('translate-x-full');
        if (backdrop) backdrop.classList.remove('hidden');
        if (prevFloatBtn) prevFloatBtn.classList.add('!opacity-100');
        if (nextFloatBtn) nextFloatBtn.classList.add('!opacity-100');
      }
      function closeSettingsDrawer() {
        if (drawer) drawer.classList.add('translate-x-full');
        if (backdrop) backdrop.classList.add('hidden');
        if (prevFloatBtn) prevFloatBtn.classList.remove('!opacity-100');
        if (nextFloatBtn) nextFloatBtn.classList.remove('!opacity-100');
      }

      // 阅读器左上角悬浮感应按钮 -> 返回书库主页（与右上角设置按钮镜像对称）
      bind('reader-home-trigger', 'click', (e) => {
        e.stopPropagation();
        closeSettingsDrawer();
        const readerView = document.getElementById('reader-view');
        const libView = document.getElementById('library-view');
        if (readerView) readerView.classList.add('hidden');
        if (libView) libView.classList.remove('hidden');
      });

      bind('reader-settings-trigger', 'click', (e) => {
        e.stopPropagation();
        openSettingsDrawer();
      });
      bind('settings-backdrop', 'click', closeSettingsDrawer);
      bind('close-settings-drawer-btn', 'click', closeSettingsDrawer);

      // 视图模式切换（单页 / 双页 / 卷轴滚动）
      document.querySelectorAll('.view-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.readerConfig.viewMode = btn.dataset.mode;
          applyReaderStyles();
          repaginateAndRender(true);
        });
      });

      // 清除自定义背景色 / 文字色
      bind('clear-bg-custom-btn', 'click', () => {
        state.readerConfig.customBgColors = ['#fdf6e3'];
        state.readerConfig.bgColor = '#fdf6e3';
        applyReaderStyles();
        renderColorSwatches();
        showToast('已重置自定义背景颜色（保留 #fdf6e3）');
      });

      bind('clear-text-custom-btn', 'click', () => {
        state.readerConfig.customTextColors = ['#2f251e'];
        state.readerConfig.textColor = '#2f251e';
        applyReaderStyles();
        renderColorSwatches();
        showToast('已重置自定义文字颜色（保留 #2f251e）');
      });

      // 自定义背景色取色器与输入框联动添加
      const bgPicker = document.getElementById('bg-color-picker');
      const bgHexInput = document.getElementById('bg-color-hex-input');
      bind('bg-color-picker', 'input', (e) => {
        if (bgHexInput) bgHexInput.value = e.target.value;
      });
      bind('confirm-add-bg-btn', 'click', () => {
        if (!bgHexInput) return;
        let hex = bgHexInput.value.trim();
        if (!hex.startsWith('#')) hex = '#' + hex;
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
          showToast('请输入有效的6位HEX颜色代码，如 #fdf6e3');
          return;
        }
        if (!state.readerConfig.customBgColors.some(c => c.toLowerCase() === hex.toLowerCase())) {
          state.readerConfig.customBgColors.push(hex);
        }
        state.readerConfig.bgColor = hex;
        applyReaderStyles();
        renderColorSwatches();
        const pop = document.getElementById('add-bg-color-popover');
        if (pop) pop.classList.add('hidden');
      });

      // 自定义文字色取色器与输入框联动添加
      const textPicker = document.getElementById('text-color-picker');
      const textHexInput = document.getElementById('text-color-hex-input');
      bind('text-color-picker', 'input', (e) => {
        if (textHexInput) textHexInput.value = e.target.value;
      });
      bind('confirm-add-text-btn', 'click', () => {
        if (!textHexInput) return;
        let hex = textHexInput.value.trim();
        if (!hex.startsWith('#')) hex = '#' + hex;
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
          showToast('请输入有效的6位HEX颜色代码，如 #2f251e');
          return;
        }
        if (!state.readerConfig.customTextColors.some(c => c.toLowerCase() === hex.toLowerCase())) {
          state.readerConfig.customTextColors.push(hex);
        }
        state.readerConfig.textColor = hex;
        applyReaderStyles();
        renderColorSwatches();
        const pop = document.getElementById('add-text-color-popover');
        if (pop) pop.classList.add('hidden');
      });

      // 绑定全部 6 组滑块与数字输入框（实时重新测量 DOM 分页）
      let repaginateTimer = null;
      const scheduleRepaginate = () => {
        clearTimeout(repaginateTimer);
        repaginateTimer = setTimeout(() => {
          repaginateAndRender(true);
        }, 60);
      };

      bindSliderAndInput('slider-font-size', 'input-font-size', 'label-font-size', 'fontSize', scheduleRepaginate);
      bindSliderAndInput('slider-margin', 'input-margin', 'label-margin', 'margin', scheduleRepaginate);
      bindSliderAndInput('slider-letter-spacing', 'input-letter-spacing', 'label-letter-spacing', 'letterSpacing', scheduleRepaginate);
      bindSliderAndInput('slider-para-spacing', 'input-para-spacing', 'label-para-spacing', 'paraSpacing', scheduleRepaginate);
      bindSliderAndInput('slider-page-width', 'input-page-width', 'label-page-width', 'pageWidth', scheduleRepaginate);
      bindSliderAndInput('slider-brightness', 'input-brightness', 'label-brightness', 'brightness');

      // 绑定「不显示页脚」与「不显示页眉」开关
      bind('toggle-hide-footer', 'click', () => {
        const btn = document.getElementById('toggle-hide-footer');
        if (!btn) return;
        state.readerConfig.hideFooter = !state.readerConfig.hideFooter;
        const on = state.readerConfig.hideFooter;
        btn.setAttribute('aria-checked', String(on));
        btn.className = `w-14 h-7 rounded-full p-1 transition-colors duration-200 flex items-center cursor-pointer ${
          on ? 'bg-[#484848]' : 'bg-[#8c8c8c]'
        }`;
        const knob = btn.querySelector('span');
        if (knob) {
          knob.className = `w-5 h-5 rounded-full bg-white shadow transform transition-transform duration-200 ${
            on ? 'translate-x-7' : 'translate-x-0'
          }`;
        }
        applyReaderStyles();
        scheduleRepaginate();
      });

      bind('toggle-hide-header', 'click', () => {
        const btn = document.getElementById('toggle-hide-header');
        if (!btn) return;
        state.readerConfig.hideHeader = !state.readerConfig.hideHeader;
        const on = state.readerConfig.hideHeader;
        btn.setAttribute('aria-checked', String(on));
        btn.className = `w-14 h-7 rounded-full p-1 transition-colors duration-200 flex items-center cursor-pointer ${
          on ? 'bg-[#484848]' : 'bg-[#8c8c8c]'
        }`;
        const knob = btn.querySelector('span');
        if (knob) {
          knob.className = `w-5 h-5 rounded-full bg-white shadow transform transition-transform duration-200 ${
            on ? 'translate-x-7' : 'translate-x-0'
          }`;
        }
        applyReaderStyles();
        scheduleRepaginate();
      });

      // 默认字体下拉框切换：立即更新 CSS 字体栈并重新测量 DOM 分页
      const fontSelect = document.getElementById('select-font-family');
      bind('select-font-family', 'change', (e) => {
        state.readerConfig.fontFamily = e.target.value;
        applyReaderStyles();
        requestAnimationFrame(() => {
          repaginateAndRender(true);
        });
      });

      // 支持载入本地 .ttf/.otf/.woff2 字体文件并自动加入「默认字体」下拉框选中
      const fontUploadInput = document.getElementById('font-upload-input');
      bind('import-local-font-btn', 'click', () => {
        if (fontUploadInput) fontUploadInput.click();
      });
      bind('font-upload-input', 'change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const fontName = file.name.replace(/\.(ttf|otf|woff2?)$/i, '');
          const fontKey = 'custom_' + Date.now();
          const buffer = await file.arrayBuffer();
          const customFontFace = new FontFace(fontName, buffer);
          await customFontFace.load();
          document.fonts.add(customFontFace);

          state.fontMap[fontKey] = `'${fontName}', sans-serif`;
          if (fontSelect) {
            const opt = document.createElement('option');
            opt.value = fontKey;
            opt.textContent = fontName;
            fontSelect.appendChild(opt);
            fontSelect.value = fontKey;
          }

          state.readerConfig.fontFamily = fontKey;
          applyReaderStyles();
          requestAnimationFrame(() => {
            repaginateAndRender(true);
          });
          showToast(`已成功应用字体：${fontName}`);
        } catch (err) {
          console.error('加载本地字体失败:', err);
          showToast('字体文件加载失败，请检查文件格式');
        }
        e.target.value = '';
      });

      // 左下角/右下角悬浮翻页按钮与键盘「左/上」前翻、「右/下」下翻
      bind('prev-page-btn', 'click', (e) => {
        e.stopPropagation();
        turnPage(-1);
      });
      bind('next-page-btn', 'click', (e) => {
        e.stopPropagation();
        turnPage(1);
      });

      window.addEventListener('keydown', (e) => {
        const readerEl = document.getElementById('reader-view');
        const readerVisible = readerEl && !readerEl.classList.contains('hidden');
        if (!readerVisible) return;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName)) return;

        if (e.key === 'Escape') {
          closeSettingsDrawer();
          return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          turnPage(-1);
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          turnPage(1);
        }
      });

      // 双页/单页模式下支持鼠标滚轮直接翻页（无滚动条）
      let wheelCooldown = false;
      bind('reader-content-viewport', 'wheel', (e) => {
        if (state.readerConfig.viewMode === 'scroll') return;
        e.preventDefault();
        if (wheelCooldown) return;
        if (Math.abs(e.deltaY) < 12) return;
        wheelCooldown = true;
        turnPage(e.deltaY > 0 ? 1 : -1);
        setTimeout(() => {
          wheelCooldown = false;
        }, 220);
      }, { passive: false });

      // 窗口尺寸变化时自动重新测量 DOM 高度并重分页
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        const readerEl = document.getElementById('reader-view');
        const readerVisible = readerEl && !readerEl.classList.contains('hidden');
        if (!readerVisible) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          repaginateAndRender(true);
        }, 150);
      });
    });
  </script>
</body>
</html>
