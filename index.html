    function blobToDataUrl(blob) {
      return new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result || '');
        fr.onerror = () => res('');
        fr.readAsDataURL(blob);
      });
    }

    function mimeFromPath(p) {
      const ext = (p.split('.').pop() || '').toLowerCase();
      return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', svg: 'image/svg+xml', bmp: 'image/bmp' })[ext] || 'image/jpeg';
    }

    function normalizeResPath(p) {
      let s = String(p || '').trim();
      if (!s) return '';
      s = s.split('#')[0].split('?')[0];
      try { s = decodeURIComponent(s); } catch (e) {}
      s = s.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
      return s.toLowerCase();
    }

    function resolveRelativePath(baseFile, href) {
      let s = String(href || '').trim().split('#')[0].split('?')[0];
      if (!s) return '';
      try { s = decodeURIComponent(s); } catch (e) {}
      if (/^(https?:|data:|blob:)/i.test(s)) return '';
      const baseParts = (baseFile || '').replace(/\\/g, '/').split('/').slice(0, -1);
      const out = (s.startsWith('/') ? [] : baseParts.slice());
      s.replace(/^\/+/, '').split('/').forEach(seg => {
        if (!seg || seg === '.') return;
        if (seg === '..') out.pop();
        else out.push(seg);
      });
      return out.join('/');
    }

    function splitHrefAndHash(baseFile, rawHref) {
      const str = String(rawHref || '').trim();
      if (!str) return { filePath: '', hash: '' };
      const hashIdx = str.indexOf('#');
      const rawHash = hashIdx >= 0 ? str.slice(hashIdx + 1) : '';
      let hash = rawHash;
      try { hash = decodeURIComponent(rawHash); } catch (e) {}
      const pathPart = hashIdx >= 0 ? str.slice(0, hashIdx) : str;
      const resolved = pathPart ? resolveRelativePath(baseFile, pathPart) : baseFile;
      return { filePath: normalizeResPath(resolved), hash: hash.trim() };
    }

    async function parseEpubBuffer(arrayBuffer, fallbackTitle) {
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      const parser = new DOMParser();
      const imgMap = {};
      const imgPathList = [];
      let coverDataUrl = '';

      for (const [p, entry] of Object.entries(zip.files)) {
        if (entry.dir || !/\.(jpe?g|png|webp|gif|svg|bmp)$/i.test(p)) continue;
        const raw = await entry.async('blob');
        const blob = new Blob([raw], { type: mimeFromPath(p) });
        const dataUrl = await blobToDataUrl(blob);
        if (!dataUrl) continue;
        imgMap[normalizeResPath(p)] = dataUrl;
        imgMap[(p.split('/').pop() || '').toLowerCase()] = dataUrl;
        imgPathList.push(p);
        if (!coverDataUrl && /cover/i.test(p)) coverDataUrl = dataUrl;
      }

      const dimCache = new Map();
      const getImageSize = src => {
        if (!src) return Promise.resolve(null);
        if (dimCache.has(src)) return dimCache.get(src);
        const pr = new Promise(res => {
          const im = new Image();
          im.onload = () => res({ w: im.naturalWidth || 0, h: im.naturalHeight || 0 });
          im.onerror = () => res(null);
          im.src = src;
        });
        dimCache.set(src, pr);
        return pr;
      };

      const lookupImage = (baseFile, href) => {
        const resolved = resolveRelativePath(baseFile, href);
        const nResolved = normalizeResPath(resolved);
        if (nResolved && imgMap[nResolved]) return imgMap[nResolved];

        const nRaw = normalizeResPath(href);
        if (nRaw && imgMap[nRaw]) return imgMap[nRaw];

        const fileName = normalizeResPath((String(href || '').split('/').pop() || ''));
        if (fileName && imgMap[fileName]) return imgMap[fileName];

        if (fileName) {
          const hit = imgPathList.find(p => normalizeResPath(p.split('/').pop()) === fileName);
          if (hit) return imgMap[normalizeResPath(hit)];
        }
        return '';
      };

      const findOpfPath = async () => {
        const containerEntry = zip.file('META-INF/container.xml');
        if (containerEntry) {
          try {
            const xml = await containerEntry.async('string');
            const m = xml.match(/full-path\s*=\s*["']([^"']+\.opf)["']/i);
            if (m) return m[1];
          } catch (e) {}
        }
        return Object.keys(zip.files).find(n => /\.opf$/i.test(n)) || '';
      };

      const parseNavXhtmlEntries = (xmlStr, navFilePath) => {
        const entries = [];
        const doc = parser.parseFromString(xmlStr, 'text/html');
        let navRoot = doc.querySelector('nav[*|type="toc"], nav[epub\\:type="toc"], nav#toc, nav.toc') || doc.querySelector('nav');
        if (!navRoot) navRoot = doc.body;
        if (!navRoot) return entries;

        const walkList = (olEl, level) => {
          if (!olEl) return;
          Array.from(olEl.children).forEach(li => {
            if (!li || li.tagName.toLowerCase() !== 'li') return;
            const a = li.querySelector(':scope > a, :scope > span > a');
            if (a) {
              const text = (a.textContent || '').replace(/\s+/g, ' ').trim();
              const href = a.getAttribute('href') || '';
              if (text && href) {
                const { filePath, hash } = splitHrefAndHash(navFilePath, href);
                entries.push({ text, filePath, hash, level });
              }
            }
            const subOl = li.querySelector(':scope > ol, :scope > ul');
            if (subOl) walkList(subOl, Math.min(3, level + 1));
          });
        };

        const rootList = navRoot.querySelector('ol, ul');
        if (rootList) {
          walkList(rootList, 0);
        } else {
          navRoot.querySelectorAll('a[href]').forEach(a => {
            const text = (a.textContent || '').replace(/\s+/g, ' ').trim();
            const href = a.getAttribute('href') || '';
            if (text && href) {
              const { filePath, hash } = splitHrefAndHash(navFilePath, href);
              entries.push({ text, filePath, hash, level: 0 });
            }
          });
        }
        return entries;
      };

      const parseNcxEntries = (xmlStr, ncxFilePath) => {
        const entries = [];
        const doc = parser.parseFromString(xmlStr, 'application/xml');
        const navMap = doc.querySelector('navMap');
        if (!navMap) return entries;

        const walkNavPoints = (parentEl, level) => {
          Array.from(parentEl.children).forEach(node => {
            if (!node || !/navpoint$/i.test(node.tagName)) return;
            let labelText = '';
            const navLabel = Array.from(node.children).find(c => /navlabel$/i.test(c.tagName));
            if (navLabel) {
              const tNode = navLabel.querySelector('text');
              labelText = ((tNode ? tNode.textContent : navLabel.textContent) || '').replace(/\s+/g, ' ').trim();
            }
            const contentEl = Array.from(node.children).find(c => /content$/i.test(c.tagName));
            const src = contentEl ? (contentEl.getAttribute('src') || '') : '';
            if (labelText && src) {
              const { filePath, hash } = splitHrefAndHash(ncxFilePath, src);
              entries.push({ text: labelText, filePath, hash, level });
            }
            walkNavPoints(node, Math.min(3, level + 1));
          });
        };

        walkNavPoints(navMap, 0);
        return entries;
      };

      const parseSpineAndOfficialToc = async opfPath => {
        if (!opfPath || !zip.file(opfPath)) return { spinePaths: [], tocEntries: [], guideTocFiles: new Set() };
        let xml = '';
        try { xml = await zip.file(opfPath).async('string'); } catch (e) { return { spinePaths: [], tocEntries: [], guideTocFiles: new Set() }; }
        const doc = parser.parseFromString(xml, 'application/xml');
        const baseDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
        const idToPath = {};
        const navFiles = [];
        const ncxFiles = [];
        const guideTocFiles = new Set();

        doc.querySelectorAll('manifest > item').forEach(it => {
          const id = it.getAttribute('id') || '';
          const href = it.getAttribute('href') || '';
          const props = (it.getAttribute('properties') || '').toLowerCase();
          const mediaType = (it.getAttribute('media-type') || '').toLowerCase();
          if (!id || !href) return;
          const full = resolveRelativePath(opfPath, href) || (baseDir + href);
          idToPath[id] = full;
          if (props.split(/\s+/).includes('nav') || /nav\.x?html?$/i.test(full)) {
            navFiles.push(full);
          }
          if (mediaType.includes('dtbncx') || /\.ncx$/i.test(full)) {
            ncxFiles.push(full);
          }
        });

        doc.querySelectorAll('guide > reference').forEach(ref => {
          const type = (ref.getAttribute('type') || '').toLowerCase();
          const href = ref.getAttribute('href') || '';
          if (type === 'toc' && href) {
            const { filePath } = splitHrefAndHash(opfPath, href);
            if (filePath) guideTocFiles.add(filePath);
          }
        });

        const spinePaths = [];
        doc.querySelectorAll('spine > itemref').forEach(ir => {
          const idref = ir.getAttribute('idref');
          const p = idref && idToPath[idref];
          if (p && /\.(xhtml|html|htm)$/i.test(p)) spinePaths.push(p);
        });

        Object.keys(zip.files).forEach(k => {
          if (/\.ncx$/i.test(k) && !ncxFiles.includes(k)) ncxFiles.push(k);
          if (/nav\.x?html?$/i.test(k) && !navFiles.includes(k)) navFiles.push(k);
        });

        let tocEntries = [];
        for (const nf of navFiles) {
          const zEntry = zip.file(nf) || zip.file( Object.keys(zip.files).find(k => normalizeResPath(k) === normalizeResPath(nf)) || '' );
          if (!zEntry) continue;
          try {
            const raw = await zEntry.async('string');
            const parsed = parseNavXhtmlEntries(raw, nf);
            if (parsed.length > tocEntries.length) tocEntries = parsed;
          } catch (e) {}
        }

        if (!tocEntries.length) {
          for (const cf of ncxFiles) {
            const zEntry = zip.file(cf) || zip.file( Object.keys(zip.files).find(k => normalizeResPath(k) === normalizeResPath(cf)) || '' );
            if (!zEntry) continue;
            try {
              const raw = await zEntry.async('string');
              const parsed = parseNcxEntries(raw, cf);
              if (parsed.length > tocEntries.length) tocEntries = parsed;
            } catch (e) {}
          }
        }

        return { spinePaths, tocEntries, guideTocFiles };
      };

      const opfPath = await findOpfPath();
      const { spinePaths, tocEntries, guideTocFiles } = await parseSpineAndOfficialToc(opfPath);
      const allHtml = Object.keys(zip.files)
        .filter(n => !zip.files[n].dir && /\.(xhtml|html|htm)$/i.test(n));

      let htmlFiles;
      if (spinePaths.length) {
        const ordered = [];
        const used = new Set();
        for (const p of spinePaths) {
          const hit = allHtml.find(n => normalizeResPath(n) === normalizeResPath(p));
          if (hit && !used.has(hit)) { ordered.push(hit); used.add(hit); }
        }
        const rest = allHtml
          .filter(n => !used.has(n))
          .filter(n => !/nav\.x?html?$/i.test(n) && !/\.ncx$/i.test(n) && !/cover\.x?html?$/i.test(n))
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        htmlFiles = ordered.concat(rest);
      } else {
        htmlFiles = allHtml.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      }

      const spineFileSet = new Set(spinePaths.map(p => {
        const hit = allHtml.find(n => normalizeResPath(n) === normalizeResPath(p));
        return hit ? normalizeResPath(hit) : normalizeResPath(p);
      }).filter(Boolean));

      const normTitle = s => String(s || '').replace(/[\s\u3000]+/g, '').trim();
      const tocTargetFileHashSet = new Set();
      const tocTargetFileFirstSet = new Set();
      const tocNormTitleSet = new Set();

      tocEntries.forEach(item => {
        if (item.filePath && item.hash) {
          tocTargetFileHashSet.add(`${item.filePath}#${item.hash}`);
        } else if (item.filePath) {
          tocTargetFileFirstSet.add(item.filePath);
        }
        if (item.text) tocNormTitleSet.add(normTitle(item.text));
      });

      const rawBlocks = [];
      const fileFirstBlockMap = new Map();
      const fileHashBlockMap = new Map();

      const cleanText = s => {
        let t = String(s || '');
        if (!t) return '';
        t = t.replace(/data:[a-z]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]{16,}/gi, ' ');
        t = t.replace(/(?:[A-Za-z0-9+/]{4,}={0,2}\s+){3,}[A-Za-z0-9+/]{4,}={0,2}/g, m => {
          const compact = m.replace(/\s+/g, '');
          const hasSym = /[+/=]/.test(compact);
          const cjk = (compact.match(/[\u4e00-\u9fff]/g) || []).length;
          if (cjk === 0 && compact.length >= 32 && hasSym) return ' ';
          return m;
        });
        t = t.replace(/[A-Za-z0-9+/]{32,}={0,2}/g, m => {
          if (/[+/=]/.test(m)) return ' ';
          if (m.length >= 60 && !/[aeiou]{2,}/i.test(m)) return ' ';
          return m;
        });
        t = t.replace(/\b[0-9a-f]{40,}\b/gi, ' ');
        return t.replace(/\s+/g, ' ').trim();
      };

      const isUsableText = s => {
        const t = cleanText(s);
        if (!t) return false;
        return t.length >= 1;
      };

      // 解析 EPUB 内置 CSS 与行内彩色样式（保留说话人专属颜色/字重，忽略普通黑灰正文色）
      const normalizeAccentColor = rawColor => {
        if (!rawColor) return '';
        const c = String(rawColor).replace(/!important/gi, '').trim().toLowerCase();
        if (!c || c === 'inherit' || c === 'initial' || c === 'unset' || c === 'currentcolor' || c === 'transparent' || c === 'black' || c === 'windowtext') return '';
        let r = -1, g = -1, b = -1;
        const hex3 = c.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i);
        const hex6 = c.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})?$/i);
        const rgbM = c.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (hex3) {
          r = parseInt(hex3[1] + hex3[1], 16);
          g = parseInt(hex3[2] + hex3[2], 16);
          b = parseInt(hex3[3] + hex3[3], 16);
        } else if (hex6) {
          r = parseInt(hex6[1], 16);
          g = parseInt(hex6[2], 16);
          b = parseInt(hex6[3], 16);
        } else if (rgbM) {
          r = Number(rgbM[1]);
          g = Number(rgbM[2]);
          b = Number(rgbM[3]);
        } else {
          return c;
        }
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const diff = max - min;
        // 排除接近纯黑/纯白或无饱和度的普通灰黑正文色
        if (diff < 18 && (max < 95 || min > 215)) return '';
        if (diff < 12) return '';
        return c;
      };

      const cssColorRules = [];
      const parseCssText = cssStr => {
        const cleaned = String(cssStr || '').replace(/\/\*[\s\S]*?\*\//g, '');
        const re = /([^{}]+)\{([^{}]+)\}/g;
        let m;
        while ((m = re.exec(cleaned)) !== null) {
          const selectors = m[1].trim();
          const body = m[2];
          const colorMatch = body.match(/(?:^|;|\s)color\s*:\s*([^;!}]+)/i);
          const weightMatch = body.match(/(?:^|;|\s)font-weight\s*:\s*([^;!}]+)/i);
          const accent = colorMatch ? normalizeAccentColor(colorMatch[1]) : '';
          const isBold = weightMatch ? /^(bold|[6-9]00)$/i.test(weightMatch[1].trim()) : false;
          if (!accent && !isBold) continue;
          selectors.split(',').forEach(sel => {
            const s = sel.trim();
            if (!s || s.includes(':') || s.includes('>') || s.includes('+') || s.includes('~')) return;
            cssColorRules.push({ selector: s, color: accent, bold: isBold });
          });
        }
      };

      for (const [p, entry] of Object.entries(zip.files)) {
        if (entry.dir || !/\.css$/i.test(p)) continue;
        try {
          const cssTxt = await entry.async('string');
          parseCssText(cssTxt);
        } catch (e) {}
      }

      const resolveNodeStyle = el => {
        if (!el || el.nodeType !== Node.ELEMENT_NODE) return { color: '', bold: false };
        let color = '';
        let bold = /^(b|strong|h[1-6])$/i.test(el.tagName);

        for (const rule of cssColorRules) {
          try {
            if (el.matches(rule.selector)) {
              if (rule.color) color = rule.color;
              if (rule.bold) bold = true;
            }
          } catch (e) {}
        }

        const attrColor = el.getAttribute('color');
        if (attrColor) {
          const ac = normalizeAccentColor(attrColor);
          if (ac) color = ac;
        }

        const inlineStyle = el.getAttribute('style') || '';
        if (inlineStyle) {
          const cm = inlineStyle.match(/(?:^|;|\s)color\s*:\s*([^;!}]+)/i);
          if (cm) {
            const ic = normalizeAccentColor(cm[1]);
            if (ic) color = ic;
          }
          const wm = inlineStyle.match(/(?:^|;|\s)font-weight\s*:\s*([^;!}]+)/i);
          if (wm && /^(bold|[6-9]00)$/i.test(wm[1].trim())) bold = true;
        }

        return { color, bold };
      };

      const extractStyledBlockInfo = node => {
        const selfStyle = resolveNodeStyle(node);
        let blockColor = selfStyle.color;
        let blockBold = selfStyle.bold;

        if (!blockColor && node.children && node.children.length === 1) {
          const onlyChild = node.children[0];
          if ((onlyChild.textContent || '').trim() === (node.textContent || '').trim()) {
            const cs = resolveNodeStyle(onlyChild);
            if (cs.color) blockColor = cs.color;
            if (cs.bold) blockBold = true;
          }
        }

        const spans = [];
        let hasStyledSpan = false;
        const collectSpans = (cur, inheritedColor, inheritedBold) => {
          for (const child of cur.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
              const tx = (child.nodeValue || '').replace(/\s+/g, ' ');
              if (tx) {
                spans.push({ text: tx, color: inheritedColor || '', bold: Boolean(inheritedBold) });
              }
            } else if (child.nodeType === Node.ELEMENT_NODE) {
              const tag = child.tagName.toLowerCase();
              if (tag === 'img' || tag === 'image' || tag === 'svg') continue;
              const st = resolveNodeStyle(child);
              const nextColor = st.color || inheritedColor;
              const nextBold = st.bold || inheritedBold;
              if (st.color) hasStyledSpan = true;
              collectSpans(child, nextColor, nextBold);
            }
          }
        };

        if (!blockColor) {
          collectSpans(node, '', blockBold);
        }

        return {
          color: blockColor,
          bold: blockBold,
          spans: (hasStyledSpan && spans.length > 0) ? spans : null
        };
      };

      const BLOCK_TAGS = new Set(['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'div', 'blockquote', 'li', 'figure']);

      let firstSpineFile = true;
      for (const f of htmlFiles) {
        const normF = normalizeResPath(f);
        if (/^(.*\/)?(nav|toc|contents)\.x?html?$/i.test(normF) && tocEntries.length > 0 && !tocTargetFileFirstSet.has(normF)) {
          continue;
        }
        if (guideTocFiles.has(normF) && tocEntries.length > 0 && !tocTargetFileFirstSet.has(normF)) {
          continue;
        }

        const u8 = await zip.file(f).async('uint8array');
        const txt = new TextDecoder('utf-8').decode(u8);
        const doc = parser.parseFromString(txt, 'text/html');
        doc.querySelectorAll('style').forEach(stEl => {
          parseCssText(stEl.textContent || '');
          stEl.remove();
        });
        doc.querySelectorAll('script, svg style').forEach(el => el.remove());
        doc.querySelectorAll('[style]').forEach(el => {
          const st = el.getAttribute('style') || '';
          if (/base64,/i.test(st) || st.length > 600) el.removeAttribute('style');
        });

        if (!doc.body) continue;

        const aLinks = doc.body.querySelectorAll('a[href]');
        const allTextLen = (doc.body.textContent || '').replace(/\s+/g, '').length;
        if (tocEntries.length > 3 && aLinks.length >= 8) {
          let linkTextLen = 0;
          aLinks.forEach(a => { linkTextLen += (a.textContent || '').replace(/\s+/g, '').length; });
          if (allTextLen > 0 && linkTextLen / allTextLen > 0.7 && !tocTargetFileFirstSet.has(normF)) {
            continue;
          }
        }

        const isSpineFile = spineFileSet.has(normF);
        let chapterStartMarked = false;
        let firstTextInFileHandled = false;

        const markChapterStart = () => {
          if (chapterStartMarked) return false;
          chapterStartMarked = true;
          if (!isSpineFile) return false;
          if (rawBlocks.length === 0 && firstSpineFile) return false;
          return true;
        };

        let pendingIds = [];
        const recordId = idStr => {
          if (!idStr) return;
          const cleanId = String(idStr).trim();
          if (cleanId && !pendingIds.includes(cleanId)) pendingIds.push(cleanId);
        };

        const bindBlockAnchors = blockIdx => {
          if (!fileFirstBlockMap.has(normF)) {
            fileFirstBlockMap.set(normF, blockIdx);
          }
          if (pendingIds.length) {
            pendingIds.forEach(id => {
              const key = `${normF}#${id}`;
              if (!fileHashBlockMap.has(key)) fileHashBlockMap.set(key, blockIdx);
            });
            pendingIds = [];
          }
        };

        const pushImg = (src, alt, w, h) => {
          if (!src) return;
          const last = rawBlocks[rawBlocks.length - 1];
          if (last && last.type === 'img' && last.src === src) return;
          const newPage = markChapterStart();
          const bi = rawBlocks.length;
          rawBlocks.push({ _bi: bi, type: 'img', src, alt: alt || '', w: Number(w) || 0, h: Number(h) || 0, forceNewPage: newPage });
          bindBlockAnchors(bi);
        };

        const hasNestedBlockElement = el => {
          for (const child of el.children) {
            const cTag = child.tagName.toLowerCase();
            if (BLOCK_TAGS.has(cTag)) return true;
            if (hasNestedBlockElement(child)) return true;
          }
          return false;
        };

        const walkDom = node => {
          if (!node || node.nodeType !== Node.ELEMENT_NODE) return;
          const tag = node.tagName.toLowerCase();
          recordId(node.getAttribute('id') || node.getAttribute('name'));

          if (tag === 'img') {
            const href = node.getAttribute('src') || node.getAttribute('data-src') || '';
            pushImg(lookupImage(f, href), node.getAttribute('alt'), node.getAttribute('width'), node.getAttribute('height'));
            return;
          }
          if (tag === 'image') {
            const href = node.getAttribute('xlink:href') || node.getAttribute('href') || '';
            pushImg(lookupImage(f, href), node.getAttribute('alt'), node.getAttribute('width'), node.getAttribute('height'));
            return;
          }
          if (tag === 'svg') {
            node.querySelectorAll('image').forEach(im => walkDom(im));
            return;
          }

          if (BLOCK_TAGS.has(tag)) {
            if (!hasNestedBlockElement(node)) {
              node.querySelectorAll('[id], a[name]').forEach(sub => recordId(sub.getAttribute('id') || sub.getAttribute('name')));
              node.querySelectorAll('img, image').forEach(im => walkDom(im));

              const rawT = (node.textContent || '').replace(/\s+/g, ' ').trim();
              if (rawT && isUsableText(rawT)) {
                const t = cleanText(rawT);
                if (t) {
                  const isHeadingTag = /^h[1-4]$/.test(tag);
                  const hitsHashToc = pendingIds.some(pid => tocTargetFileHashSet.has(`${normF}#${pid}`));
                  const hitsFirstToc = !firstTextInFileHandled && tocTargetFileFirstSet.has(normF) && (isHeadingTag || t.length <= 60);
                  const hitsTitleToc = !firstTextInFileHandled && tocNormTitleSet.has(normTitle(t));
                  const isHeading = isHeadingTag || hitsHashToc || hitsFirstToc || hitsTitleToc;

                  const styleInfo = extractStyledBlockInfo(node);

                  firstTextInFileHandled = true;
                  const newPage = markChapterStart() || hitsHashToc;
                  const bi = rawBlocks.length;
                  const blkObj = { _bi: bi, type: isHeading ? 'heading' : 'p', text: t, forceNewPage: newPage };
                  if (styleInfo.color) blkObj.color = styleInfo.color;
                  if (styleInfo.bold) blkObj.bold = true;
                  if (styleInfo.spans) blkObj.spans = styleInfo.spans;
                  rawBlocks.push(blkObj);
                  bindBlockAnchors(bi);
                }
              }
              return;
            }
          }

          for (const child of node.children) {
            walkDom(child);
          }
        };

        walkDom(doc.body);
        if (pendingIds.length && rawBlocks.length > 0) {
          bindBlockAnchors(rawBlocks.length - 1);
        }
        firstSpineFile = false;
      }

      for (const b of rawBlocks) {
        if (b.type !== 'img') continue;
        const usable = typeof b.src === 'string' && b.src.startsWith('data:image/');
        if (!usable) { b.dead = true; continue; }
        if (b.w > 0 && b.h > 0) continue;
        const dim = await getImageSize(b.src);
        if (dim && dim.w > 0 && dim.h > 0) { b.w = dim.w; b.h = dim.h; }
        else b.dead = true;
      }

      if (!rawBlocks.length) rawBlocks.push({ _bi: 0, type: 'p', text: `《${fallbackTitle}》已载入。` });

      const finalToc = [];
      const seenTocKeys = new Set();

      if (tocEntries.length > 0) {
        let searchCursor = 0;
        tocEntries.forEach(entry => {
          let resolvedBi = -1;
          if (entry.filePath && entry.hash) {
            const key = `${entry.filePath}#${entry.hash}`;
            if (fileHashBlockMap.has(key)) resolvedBi = fileHashBlockMap.get(key);
          }
          if (resolvedBi < 0 && entry.filePath && entry.text) {
            const fileStart = fileFirstBlockMap.has(entry.filePath) ? fileFirstBlockMap.get(entry.filePath) : 0;
            const nTarget = normTitle(entry.text);
            if (nTarget) {
              for (let i = fileStart; i < Math.min(rawBlocks.length, fileStart + 250); i++) {
                const blk = rawBlocks[i];
                if (blk.type === 'img') continue;
                const bt = normTitle(blk.text);
                if (bt === nTarget || (nTarget.length >= 3 && bt.length <= 50 && bt.includes(nTarget))) {
                  resolvedBi = i;
                  break;
                }
              }
            }
          }
          if (resolvedBi < 0 && entry.filePath && fileFirstBlockMap.has(entry.filePath)) {
            resolvedBi = fileFirstBlockMap.get(entry.filePath);
          }
          if (resolvedBi < 0 && entry.text) {
            const nTarget = normTitle(entry.text);
            if (nTarget) {
              for (let i = searchCursor; i < rawBlocks.length; i++) {
                const blk = rawBlocks[i];
                if (blk.type !== 'img' && normTitle(blk.text) === nTarget) {
                  resolvedBi = i;
                  break;
                }
              }
            }
          }
          if (resolvedBi >= 0 && resolvedBi < rawBlocks.length) {
            searchCursor = Math.max(searchCursor, resolvedBi);
            const targetBlk = rawBlocks[resolvedBi];
            if (targetBlk && targetBlk.type === 'p' && (targetBlk.text || '').length <= 65) {
              targetBlk.type = 'heading';
            }
            const dedupKey = `${resolvedBi}|${normTitle(entry.text)}`;
            if (!seenTocKeys.has(dedupKey)) {
              seenTocKeys.add(dedupKey);
              finalToc.push({
                text: entry.text,
                blockIndex: resolvedBi,
                level: entry.level || 0
              });
            }
          }
        });
      }

      if (!finalToc.length) {
        const chapterRegex = /^(第[零一二三四五六七八九十百千万0-9]+[章节回卷部篇集]|Chapter\s+\d+|CHAPTER\s+\d+|序言|序章|前言|楔子|引子|尾声|后记|番外|附录)/;
        rawBlocks.forEach((b, idx) => {
          if (b.type === 'img' || !b.text) return;
          const t = b.text.trim();
          if (b.type === 'heading' && t.length <= 70) {
            finalToc.push({ text: t, blockIndex: idx, level: 0 });
          } else if (t.length <= 45 && chapterRegex.test(t)) {
            b.type = 'heading';
            finalToc.push({ text: t, blockIndex: idx, level: 0 });
          }
        });
      }

      return { rawBlocks, toc: finalToc, coverDataUrl, parseVer: PARSE_VERSION };
    }

    async function handleFilesImport(files, uploadToCloud = false) {
      for (const file of Array.from(files || [])) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext !== 'epub') {
          showToast('仅支持导入 EPUB 格式图书');
          continue;
        }
        const title = file.name.replace(/\.epub$/i, '');
        const buf = await file.arrayBuffer();
        const defaultShelf = state.currentNav.startsWith('shelf:') ? state.currentNav.slice(6) : '';

        showToast(`正在解析《${title}》...`);
        const parsed = await parseEpubBuffer(buf, title);
        const { rawBlocks, toc, coverDataUrl } = parsed;
        const newBook = {
          id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
          title, fileName: file.name, format: 'EPUB', shelf: defaultShelf,
          addedAt: Date.now(), lastReadAt: Date.now(), coverUrl: coverDataUrl,
          hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
          rawBlocks, toc, fileBytes: buf, isCloudOnly: false, parseVer: parsed.parseVer
        };
        state.books.unshift(newBook);
        await saveBookDB(newBook);
        renderLibrary();

        if (uploadToCloud) {
          if (!isCloudConnected()) {
            showToast('未连接私有仓，已仅导入本地');
          } else {
            try {
              showToast(`正在上传《${newBook.title}》到书架「${newBook.shelf}」...`);
              await uploadBookToCloud(newBook);
              await saveBookDB(newBook);
              renderLibrary();
              showToast(`已导入并上传《${newBook.title}》到云端「${newBook.shelf}」`);
            } catch (e) {
              showToast(`上传失败：${e.message || '请检查仓库权限'}`);
            }
          }
        }

        openBook(newBook);
      }
    }

    function hasStaleImageBlock(book) {
      if (!book) return false;
      const blocks = book.rawBlocks || [];
      return blocks.some(b => {
        if (!b || b.type !== 'img') return false;
        const src = String(b.src || '');
        return src === '' || src.startsWith('blob:');
      });
    }

    async function healStaleImages(book) {
      if (!hasStaleImageBlock(book)) return false;
      if (book.fileBytes) {
        try {
          const parsed = await parseEpubBuffer(book.fileBytes.slice(0), book.title);
          const hasImg = parsed.rawBlocks.some(b => b.type === 'img');
          if (hasImg) {
            book.rawBlocks = parsed.rawBlocks;
            book.toc = parsed.toc;
            book.parseVer = parsed.parseVer;
            book.pages = undefined;
            if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
            await saveBookDB(book);
            return true;
          }
        } catch (e) {}
      }
      let marked = 0;
      (book.rawBlocks || []).forEach(b => {
        if (b && b.type === 'img' && !b.dead) {
          const src = String(b.src || '');
          if (src === '' || src.startsWith('blob:')) { b.dead = true; marked++; }
        }
      });
      if (marked) {
        book.pages = undefined;
        return false;
      }
      return false;
    }

    // ==================== 全新目录 / 书签 / 搜索 / 统一跳转引擎 ====================
    function ensureBlockIndices(book) {
      if (!book || !Array.isArray(book.rawBlocks)) return;
      book.rawBlocks.forEach((b, i) => {
        if (b && typeof b._bi !== 'number') b._bi = i;
      });
    }

    function buildToc(book) {
      if (!book) return [];
      ensureBlockIndices(book);
      if (Array.isArray(book.toc) && book.toc.length > 0) {
        return book.toc;
      }
      const fallback = [];
      (book.rawBlocks || []).forEach((b, bi) => {
        if (b && b.type === 'heading' && b.text) {
          fallback.push({ text: b.text, blockIndex: bi, level: 0 });
        }
      });
      book.toc = fallback;
      return fallback;
    }

    function findPageOfBlock(book, blockIndex) {
      if (!book) return 0;
      const pages = book.pages || [];
      if (!pages.length) return 0;
      const targetBi = Number(blockIndex);
      if (isNaN(targetBi) || targetBi < 0) return 0;

      for (let i = 0; i < pages.length; i++) {
        const pg = pages[i];
        if (pg && pg.some(x => x && x._bi === targetBi && !x.splitFrom)) {
          return i;
        }
      }
      for (let i = 0; i < pages.length; i++) {
        const pg = pages[i];
        if (pg && pg.some(x => x && x._bi === targetBi)) {
          return i;
        }
      }
      let bestPage = 0;
      for (let i = 0; i < pages.length; i++) {
        const pg = pages[i];
        if (!pg || !pg.length) continue;
        const firstBi = pg[0]._bi;
        if (typeof firstBi === 'number' && firstBi <= targetBi) {
          bestPage = i;
        } else if (typeof firstBi === 'number' && firstBi > targetBi) {
          break;
        }
      }
      return bestPage;
    }

    function alignPageForMode(pageIndex) {
      const p = Math.max(0, Number(pageIndex) || 0);
      if (state.readerConfig.viewMode === 'dual') {
        return p - (p % 2);
      }
      return p;
    }

    function getCurrentReadingBlockIndex() {
      const book = state.currentBook;
      if (!book) return -1;
      ensureBlockIndices(book);

      if (state.readerConfig.viewMode === 'scroll') {
        const wrap = $('page-left-wrapper');
        const leaf = $('page-left');
        if (wrap && leaf) {
          const scrollTop = wrap.scrollTop;
          const nodes = leaf.querySelectorAll('[data-bi]');
          for (const el of nodes) {
            if (el.offsetTop + el.offsetHeight > scrollTop + 24) {
              const bi = parseInt(el.dataset.bi, 10);
              if (!isNaN(bi)) return bi;
            }
          }
        }
        return book.lastBlockIndex || 0;
      }

      const pages = book.pages || [];
      const curPg = pages[state.currentPageIndex] || [];
      const firstValid = curPg.find(b => b && typeof b._bi === 'number');
      if (firstValid) return firstValid._bi;

      if (state.readerConfig.viewMode === 'dual') {
        const rightPg = pages[state.currentPageIndex + 1] || [];
        const rightValid = rightPg.find(b => b && typeof b._bi === 'number');
        if (rightValid) return rightValid._bi;
      }
      return book.lastBlockIndex || 0;
    }

    function getChapterNameForBlock(book, blockIndex) {
      if (!book) return '';
      const toc = buildToc(book);
      if (toc.length) {
        let cur = '';
        for (const item of toc) {
          if ((item.blockIndex || 0) <= blockIndex) cur = item.text;
          else break;
        }
        if (cur) return cur;
      }
      const blocks = book.rawBlocks || [];
      const limit = Math.min(blocks.length - 1, Math.max(0, blockIndex));
      for (let i = limit; i >= 0; i--) {
        if (blocks[i] && blocks[i].type === 'heading' && blocks[i].text) {
          return blocks[i].text;
        }
      }
      return '';
    }

    async function jumpToBookLocation(target = {}) {
      const book = state.currentBook;
      if (!book) return;

      ensureBlockIndices(book);
      let blockIdx = typeof target.blockIndex === 'number' ? target.blockIndex : -1;
      if (blockIdx < 0 && typeof target.pageIndex === 'number') {
        const pg = (book.pages || [])[target.pageIndex] || [];
        const hit = pg.find(b => b && typeof b._bi === 'number');
        if (hit) blockIdx = hit._bi;
      }
      blockIdx = Math.max(0, Math.min((book.rawBlocks || []).length - 1, blockIdx));
      book.lastBlockIndex = blockIdx;

      if (state.readerConfig.viewMode === 'scroll') {
        await renderReaderPages();
        requestAnimationFrame(() => {
          const wrap = $('page-left-wrapper');
          const leaf = $('page-left');
          if (!wrap || !leaf) return;
          const el = leaf.querySelector(`[data-bi="${blockIdx}"]`);
          if (el) {
            wrap.scrollTop = Math.max(0, el.offsetTop - 20);
          }
          const totalBlocks = Math.max(1, (book.rawBlocks || []).length);
          book.progressPercent = Math.min(100, Math.max(0.05, ((blockIdx + 1) / totalBlocks) * 100));
          saveBookProgressDebounced(book);
        });
      } else {
        if (!book.pages || !book.pages.length) repaginate();
        const pageIdx = findPageOfBlock(book, blockIdx);
        state.currentPageIndex = alignPageForMode(pageIdx);
        await renderReaderPages();
      }
    }

    function getActiveTocIndex(book, toc) {
      if (!book || !toc || !toc.length) return -1;

      let maxBiInView = getCurrentReadingBlockIndex();
      if (state.readerConfig.viewMode !== 'scroll') {
        const pages = book.pages || [];
        const checkPages = state.readerConfig.viewMode === 'dual'
          ? [pages[state.currentPageIndex], pages[state.currentPageIndex + 1]]
          : [pages[state.currentPageIndex]];
        checkPages.forEach(pg => {
          (pg || []).forEach(b => {
            if (b && typeof b._bi === 'number' && b._bi > maxBiInView) {
              maxBiInView = b._bi;
            }
          });
        });
      }

      let activeIdx = -1;
      for (let i = 0; i < toc.length; i++) {
        if ((toc[i].blockIndex || 0) <= maxBiInView) activeIdx = i;
        else break;
      }
      return activeIdx;
    }

    function renderTocList() {
      const book = state.currentBook;
      const box = $('toc-list');
      if (!box) return;
      box.innerHTML = '';
      if (!book) return;

      if (state.tocTab === 'bm') {
        const marks = book.bookmarks || [];
        if (!marks.length) {
          box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">还没有书签，点右上角 ＋ 把当前位置加入书签</p>';
          return;
        }
        const totalPages = Math.max(1, (book.pages && book.pages.length) || 1);

        marks.forEach((m, i) => {
          const dynamicPage = typeof m.blockIndex === 'number' ? findPageOfBlock(book, m.blockIndex) : (m.page || 0);
          const pctStr = `${Math.min(100, Math.max(1, Math.round(((dynamicPage + 1) / totalPages) * 100)))}%`;

          const row = document.createElement('div');
          row.className = 'group flex items-start gap-2 px-5 py-4 border-b border-neutral-100 hover:bg-neutral-50 cursor-pointer transition';
          row.innerHTML = `
            <div class="flex-1 min-w-0">
              ${m.chapter ? `<div class="text-xs font-medium text-neutral-400 mb-1 truncate">${esc(m.chapter)}</div>` : ''}
              <div class="leading-relaxed text-[#3a3a3a] line-clamp-2">${esc(m.label || '书签')}</div>
              <div class="flex items-center justify-between mt-2 opacity-70" style="font-size: 0.85em;">
                <span class="text-neutral-500">第 ${dynamicPage + 1} 页</span>
                <span class="text-neutral-400">${pctStr}</span>
              </div>
            </div>
            <button type="button" class="del-bm opacity-0 group-hover:opacity-100 text-neutral-400 hover:text-red-500 px-1.5 py-1 leading-none cursor-pointer" style="font-size: 0.85em;">✕</button>`;
          row.onclick = async e => {
            if (e.target.classList.contains('del-bm')) return;
            closeTocDrawer();
            if (typeof m.blockIndex === 'number') {
              await jumpToBookLocation({ blockIndex: m.blockIndex });
            } else {
              await jumpToBookLocation({ pageIndex: m.page || 0 });
            }
          };
          row.querySelector('.del-bm').onclick = async ev2 => {
            ev2.stopPropagation();
            book.bookmarks.splice(i, 1);
            await saveBookDB(book);
            renderTocList();
          };
          box.appendChild(row);
        });
        return;
      }

      const toc = buildToc(book);
      if (!toc.length) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">这本书没有识别到章节目录</p>';
        return;
      }

      const activeIdx = getActiveTocIndex(book, toc);
      let activeRowEl = null;

      toc.forEach((item, idx) => {
        const page = findPageOfBlock(book, item.blockIndex);
        const isCurrent = idx === activeIdx;
        const level = Math.min(3, Math.max(0, Number(item.level) || 0));
        const indentPx = 20 + level * 16;

        const row = document.createElement('button');
        row.type = 'button';
        row.style.paddingLeft = `${indentPx}px`;
        row.className = `w-full text-left pr-5 py-3.5 border-b border-neutral-100 hover:bg-neutral-50 cursor-pointer flex items-baseline gap-3 transition ${isCurrent ? 'bg-neutral-100/80 font-semibold text-[#1f1f1f]' : 'text-[#3a3a3a]'}`;
        row.innerHTML = `
          <span class="flex-1 min-w-0 leading-relaxed ${level > 0 && !isCurrent ? 'text-[14.5px] text-neutral-600' : ''}">${esc(item.text)}</span>
          <span class="text-neutral-400 shrink-0 opacity-80 tabular-nums" style="font-size: 0.82em;">${page + 1}</span>`;
        row.onclick = async () => {
          closeTocDrawer();
          await jumpToBookLocation({ blockIndex: item.blockIndex });
        };
        if (isCurrent) activeRowEl = row;
        box.appendChild(row);
      });

      if (activeRowEl) {
        requestAnimationFrame(() => {
          activeRowEl.scrollIntoView({ block: 'center' });
        });
      }
    }

    function updateTocTabs() {
      const on = 'py-1 cursor-pointer text-[#2b2b2b] font-semibold';
      const off = 'py-1 cursor-pointer text-[#b8b8b8] hover:text-[#6b6b6b]';
      const a = $('toc-tab-toc'), b = $('toc-tab-bm');
      if (a) a.className = state.tocTab === 'toc' ? on : off;
      if (b) b.className = state.tocTab === 'bm' ? on : off;
    }

    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightKeyword(text, keyword) {
      if (!keyword) return esc(text);
      const re = new RegExp(escapeRegExp(keyword), 'gi');
      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        out += esc(text.slice(last, m.index));
        out += `<strong class="text-[#e03131] font-semibold">${esc(m[0])}</strong>`;
        last = m.index + m[0].length;
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      out += esc(text.slice(last));
      return out;
    }

    function snippetAround(text, keyword, radius = 40) {
      const flat = String(text || '');
      const at = flat.toLowerCase().indexOf(String(keyword).toLowerCase());
      if (at < 0) return flat.slice(0, radius * 2);
      const start = Math.max(0, at - radius);
      const end = Math.min(flat.length, at + keyword.length + radius);
      return (start > 0 ? '…' : '') + flat.slice(start, end) + (end < flat.length ? '…' : '');
    }

    function runTocSearch() {
      const input = $('toc-search-input');
      const box = $('toc-search-results');
      if (!input || !box) return;
      const kw = input.value.trim();
      $('toc-search-clear').classList.toggle('hidden', !kw);
      box.innerHTML = '';

      const book = state.currentBook;
      if (!book) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">没有打开的书</p>';
        return;
      }
      if (!kw) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">输入关键词搜索全书</p>';
        return;
      }

      ensureBlockIndices(book);
      const blocks = book.rawBlocks || [];
      const lowerKw = kw.toLowerCase();

      const groups = [];
      let curGroup = null;
      blocks.forEach((b, bi) => {
        if (!b || b.type === 'img' || b.dead) return;
        const text = b.text || '';
        if (!text) return;
        if (b.type === 'heading') {
          curGroup = { title: text, items: [] };
          groups.push(curGroup);
        }
        if (!curGroup) {
          curGroup = { title: '正文开头', items: [] };
          groups.push(curGroup);
        }
        if (text.toLowerCase().includes(lowerKw)) {
          curGroup.items.push({
            blockIndex: bi,
            page: findPageOfBlock(book, bi),
            snippet: snippetAround(text, kw)
          });
        }
      });

      const hitGroups = groups.filter(g => g.items.length);
      const total = hitGroups.reduce((n, g) => n + g.items.length, 0);

      if (!total) {
        box.innerHTML = `<p class="text-sm text-neutral-400 mt-6 text-center">没有找到「${esc(kw)}」</p>`;
        return;
      }

      hitGroups.forEach(g => {
        const sec = document.createElement('div');
        sec.className = 'mb-5';
        sec.innerHTML = `
          <div class="flex items-center justify-between py-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <svg class="w-3.5 h-3.5 shrink-0 text-neutral-500" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
              <span class="text-[15px] font-semibold text-[#2b2b2b] truncate">${esc(g.title)}</span>
            </div>
            <span class="text-[13px] text-neutral-400 shrink-0">(${g.items.length})</span>
          </div>`;
        g.items.forEach(it => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'w-full text-left block px-1 py-3 border-t border-neutral-100 hover:bg-neutral-50 cursor-pointer';
          row.innerHTML = `<p class="text-[14px] leading-relaxed text-[#4a4a4a]">${highlightKeyword(it.snippet, kw)}</p>`;
          row.onclick = async () => {
            closeTocDrawer();
            await jumpToBookLocation({ blockIndex: it.blockIndex });
          };
          sec.appendChild(row);
        });
        box.appendChild(sec);
      });
    }

    function openTocSearch() {
      $('toc-search-panel').classList.remove('hidden');
      $('toc-list').classList.add('hidden');
      runTocSearch();
      setTimeout(() => $('toc-search-input').focus(), 80);
    }

    function closeTocSearch() {
      $('toc-search-panel').classList.add('hidden');
      $('toc-list').classList.remove('hidden');
      $('toc-search-input').value = '';
      $('toc-search-clear').classList.add('hidden');
      $('toc-search-results').innerHTML = '';
    }

    function openTocDrawer() {
      state.tocTab = state.tocTab || 'toc';
      updateTocTabs();
      closeTocSearch();
      $('reader-toc-drawer').classList.remove('-translate-x-full');
      $('toc-backdrop').classList.remove('hidden');
      renderTocList();
    }
    function closeTocDrawer() {
      $('reader-toc-drawer').classList.add('-translate-x-full');
      $('toc-backdrop').classList.add('hidden');
    }

    async function openBook(book) {
      if (book.fileBytes && ((book.parseVer || 0) < PARSE_VERSION || !Array.isArray(book.toc))) {
        try {
          const parsed = await parseEpubBuffer(book.fileBytes.slice(0), book.title);
          book.rawBlocks = parsed.rawBlocks;
          book.toc = parsed.toc;
          book.parseVer = parsed.parseVer;
          book.pages = undefined;
          if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
          await saveBookDB(book);
        } catch (e) {}
      }

      const healed = await healStaleImages(book);
      if (healed) showToast('已修复本书图片显示');

      if (book.isCloudOnly && book.cloudPath) {
        const { owner, repo, branch, token } = state.github;
        if (!owner || !repo || !token) {
          $('cloud-hub-modal').classList.remove('hidden');
          return showToast('请配置 GitHub Token 以拉取书籍内容');
        }
        showToast(`正在下载《${book.title}》...`);
        try {
          const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeRepoPath(book.cloudPath)}?ref=${encodeURIComponent(branch || 'main')}`;
          const res = await fetch(url, { headers: ghHeaders({ 'Accept': 'application/vnd.github.raw' }) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const buf = await res.arrayBuffer();
          book.fileBytes = buf;
          const parsed = await parseEpubBuffer(buf, book.title);
          book.rawBlocks = parsed.rawBlocks;
          book.toc = parsed.toc;
          book.parseVer = parsed.parseVer;
          if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
          book.isCloudOnly = false;
          await saveBookDB(book);
        } catch (e) {
          return showToast('云端图书下载失败');
        }
      }

      ensureBlockIndices(book);
      state.currentBook = book;
      state.currentPageIndex = alignPageForMode(book.lastPageIndex || 0);
      book.hasBeenRead = true;
      book.lastReadAt = Date.now();
      saveQuickProgress(book);

      $('library-view').classList.add('hidden');
      $('reader-view').classList.remove('hidden');

      applyThemeColors();
      applyLayoutStyles();
      requestAnimationFrame(() => {
        repaginate();
        if (typeof book.lastBlockIndex === 'number' && book.lastBlockIndex > 0) {
          if (state.readerConfig.viewMode === 'scroll') {
            jumpToBookLocation({ blockIndex: book.lastBlockIndex });
            return;
          }
          state.currentPageIndex = alignPageForMode(findPageOfBlock(book, book.lastBlockIndex));
        }
        renderReaderPages();
      });
    }

    function applyThemeColors() {
      const c = state.readerConfig;
      const root = document.documentElement;
      root.style.setProperty('--reader-bg', c.bgColor || '#ffffff');
      root.style.setProperty('--reader-text', c.textColor || '#1f1f1f');
      root.style.setProperty('--reader-brightness', c.brightness);
    }

    function applyLayoutStyles() {
      const c = state.readerConfig;
      const root = document.documentElement;
      root.style.setProperty('--reader-font-size', c.fontSize + 'px');
      root.style.setProperty('--reader-letter-spacing', c.letterSpacing + 'px');
      root.style.setProperty('--reader-para-spacing', c.paraSpacing + 'px');
      root.style.setProperty('--reader-font-family', state.fontMap[c.fontFamily] || state.fontMap.system);

      const padX = Math.max(16, (isMobile() ? 20 : 48) + Number(c.margin));
      const padY = Math.max(16, (isMobile() ? 22 : 36) + Number(c.margin) * 0.4);
      $('page-left').style.padding = `${padY}px ${padX}px ${padY}px ${padX}px`;
      $('page-right').style.padding = `${padY}px ${padX}px ${padY}px ${padX}px`;

      $('dual-page-spine').classList.toggle('hidden', c.viewMode !== 'dual');
      $('page-right-wrapper').classList.toggle('hidden', c.viewMode !== 'dual');

      const isScroll = c.viewMode === 'scroll';
      const leftLeaf = $('page-left');
      const leftWrap = $('page-left-wrapper');
      if (isScroll) {
        leftWrap.style.overflowY = 'auto';
        leftWrap.style.overflowX = 'hidden';
        leftWrap.style.webkitOverflowScrolling = 'touch';
        leftLeaf.style.position = 'static';
        leftLeaf.style.inset = 'auto';
        leftLeaf.style.height = 'auto';
        leftLeaf.style.overflow = 'visible';
      } else {
        leftWrap.style.overflowY = 'hidden';
        leftWrap.style.overflowX = 'hidden';
        leftLeaf.style.position = 'absolute';
        leftLeaf.style.inset = '0';
        leftLeaf.style.height = '';
        leftLeaf.style.overflow = 'hidden';
        leftWrap.scrollTop = 0;
      }

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        const on = b.dataset.mode === c.viewMode;
        b.className = `view-mode-btn py-2 rounded-xl border text-sm cursor-pointer transition ${on ? 'bg-[#484848] text-white border-[#484848]' : 'bg-white text-neutral-600 border-neutral-200'}`;
      });
    }

    function imgBlockHtml(item, biAttr = '') {
      const alt = esc(item.alt || '');
      const w = Number(item.w) || 0;
      const h = Number(item.h) || 0;
      const ratio = (w > 0 && h > 0) ? `aspect-ratio:${w}/${h};` : '';
      const sizeStyle = (w > 0 && h > 0)
        ? `width:100%;max-width:min(100%, ${Math.round(w)}px);${ratio}`
        : 'width:100%;';
      return `<div${biAttr} class="fig-wrap my-3 flex justify-center"><img src="${esc(item.src)}" alt="${alt}" style="${sizeStyle}height:auto;max-height:45vh;object-fit:contain;border-radius:6px;" class="object-contain" loading="eager" decoding="sync" /></div>`;
    }

    function blockHtml(item) {
      if (!item) return '';
      const biAttr = typeof item._bi === 'number' ? ` data-bi="${item._bi}"` : '';
      const colorStyle = item.color ? `color:${esc(item.color)};` : '';
      const boldStyle = item.bold ? 'font-weight:600;' : '';

      const renderInner = it => {
        if (Array.isArray(it.spans) && it.spans.length > 0 && !it.splitFrom) {
          return it.spans.map(sp => {
            const st = `${sp.color ? `color:${esc(sp.color)};` : ''}${sp.bold ? 'font-weight:600;' : ''}`;
            return st ? `<span style="${st}">${esc(sp.text)}</span>` : esc(sp.text);
          }).join('');
        }
        return esc(it.text);
      };

      if (item.type === 'heading') {
        return `<h2${biAttr} class="font-semibold mt-3" style="margin-bottom:var(--reader-para-spacing);font-size:calc(var(--reader-font-size)*1.22);${colorStyle}">${renderInner(item)}</h2>`;
      }
      if (item.type === 'img') return item.dead ? '' : imgBlockHtml(item, biAttr);
      return `<p${biAttr} style="margin-bottom:var(--reader-para-spacing);text-align:justify;${colorStyle}${boldStyle}">${renderInner(item)}</p>`;
    }

    let imgFailHandlerBound = false;
    function bindImageFallback() {
      if (imgFailHandlerBound) return;
      imgFailHandlerBound = true;
      document.addEventListener('error', e => {
        const t = e.target;
        if (!t || t.tagName !== 'IMG') return;
        const wrap = t.closest('.fig-wrap');
        if (wrap) wrap.remove();
        else t.remove();
      }, true);
    }

    let sliderRafId = 0;
    let saveProgressTimer = null;

    function saveBookProgressDebounced(book) {
      if (!book) return;
      saveQuickProgress(book);
      clearTimeout(saveProgressTimer);
      saveProgressTimer = setTimeout(() => {
        saveBookDB(book);
      }, 2500);
    }

    function getAnchorBlock(book) {
      if (!book) return null;
      const bi = getCurrentReadingBlockIndex();
      if (bi >= 0 && book.rawBlocks && book.rawBlocks[bi]) {
        return book.rawBlocks[bi];
      }
      if (!book.pages || !book.pages.length) return null;
      const pg = book.pages[state.currentPageIndex] || [];
      return pg.find(b => b && (b.text || b.src)) || pg[0] || null;
    }

    function restorePageIndexByAnchor(book, anchor) {
      if (!book || !anchor || !book.pages || !book.pages.length) return;
      if (typeof anchor._bi === 'number') {
        state.currentPageIndex = alignPageForMode(findPageOfBlock(book, anchor._bi));
        return;
      }
      const pages = book.pages;
      const targetText = anchor.text ? String(anchor.text).slice(0, 24) : '';
      for (let i = 0; i < pages.length; i++) {
        const hit = pages[i].some(b =>
          b === anchor ||
          (b.type === anchor.type && targetText && String(b.text || '').startsWith(targetText)) ||
          (anchor.type === 'img' && b.type === 'img' && b.src === anchor.src)
        );
        if (hit) {
          state.currentPageIndex = alignPageForMode(i);
          return;
        }
      }
    }

    function calcVisualUnits(text) {
      if (!text) return 0;
      let units = 0;
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        units += (code <= 0x00ff) ? 0.56 : 1;
      }
      return units;
    }

    function splitTextByVisualUnits(text, maxUnits) {
      if (!text || maxUnits <= 0) return ['', text];
      let acc = 0;
      let cut = 0;
      for (let i = 0; i < text.length; i++) {
        const u = (text.charCodeAt(i) <= 0x00ff) ? 0.56 : 1;
        if (acc + u > maxUnits) break;
        acc += u;
        cut = i + 1;
      }
      if (cut <= 0) return ['', text];
      if (cut >= text.length) return [text, ''];
      const head = text.slice(0, cut);
      const m = head.match(/[\s，。、；：！？,.;:!?）》」』】—…](?![\s\S]*[\s，。、；：！？,.;:!?）》」』】—…])/);
      if (m && m.index > cut * 0.6) cut = m.index + 1;
      return [text.slice(0, cut), text.slice(cut)];
    }

    function repaginate() {
      const book = state.currentBook;
      if (!book) return;
      ensureBlockIndices(book);
      const blocks = book.rawBlocks || [];
      const pageLeft = $('page-left');
      const measure = $('page-measure-box');
      if (!pageLeft || !measure) return;

      const cs = getComputedStyle(pageLeft);
      const availW = Math.max(160, pageLeft.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      const availH = Math.max(140, pageLeft.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6);
      const fontSize = Number(state.readerConfig.fontSize) || 22;
      const letterSpacing = Number(state.readerConfig.letterSpacing) || 0;
      const paraSpacing = Number(state.readerConfig.paraSpacing) || 15;

      measure.style.width = availW + 'px';
      measure.innerHTML = `<div id="m-probe" style="width:100%;font-family:var(--reader-font-family);font-size:${fontSize}px;letter-spacing:${letterSpacing}px;line-height:1.72;"><span id="m-span">测试中文字符宽度校准探针十个字</span></div>`;
      const probeEl = $('m-probe');
      const spanEl = $('m-span');
      const lineH = (probeEl && parseFloat(getComputedStyle(probeEl).lineHeight)) || (fontSize * 1.72);
      const spanW = (spanEl && spanEl.getBoundingClientRect().width) || (15 * (fontSize + letterSpacing));
      const singleCharW = Math.max(8, spanW / 15);
      const charsPerLine = Math.max(5, (availW / singleCharW) * 0.96);
      const headingCharsPerLine = Math.max(4, charsPerLine / 1.22);
      const headingLineH = fontSize * 1.22 * 1.48;
      measure.innerHTML = '';

      const pages = [];
      let cur = [];
      let curH = 0;
      const isDual = state.readerConfig.viewMode === 'dual';

      const flush = () => {
        if (!cur.length) return;
        pages.push(cur);
        cur = [];
        curH = 0;
      };

      const forceChapterStart = () => {
        if (cur.length) flush();
        if (isDual && pages.length % 2 === 1) pages.push([]);
      };

      const queue = blocks.slice();
      let guard = 0;

      for (let qi = 0; qi < queue.length; qi++) {
        if (++guard > 200000) break;
        const b = queue[qi];
        if (b.forceNewPage) forceChapterStart();
        if (b.type === 'img' && b.dead) continue;

        let blockH = 0;
        if (b.type === 'img') {
          const w = Number(b.w) || availW * 0.8;
          const h = Number(b.h) || availH * 0.4;
          const scale = Math.min(1, availW / Math.max(1, w));
          blockH = Math.min(availH * 0.45, h * scale) + 24;
        } else if (b.type === 'heading') {
          const units = calcVisualUnits(b.text || '');
          const lines = Math.max(1, Math.ceil(units / headingCharsPerLine));
          blockH = 12 + lines * headingLineH + paraSpacing;
        } else {
          const units = calcVisualUnits(b.text || '');
          const lines = Math.max(1, Math.ceil(units / charsPerLine));
          blockH = lines * lineH + paraSpacing;
        }

        if (curH + blockH <= availH) {
          cur.push(b);
          curH += blockH;
          continue;
        }

        const remainH = availH - curH;
        const isPlainText = b.type === 'p' && typeof b.text === 'string' && b.text.length > 0;

        if (isPlainText && !b.splitFrom && remainH >= lineH * 2) {
          const fitLines = Math.floor(Math.max(0, remainH - 4) / lineH);
          if (fitLines >= 2) {
            const maxUnits = fitLines * charsPerLine;
            const [head, tail] = splitTextByVisualUnits(b.text, maxUnits);
            if (head && head.length >= 8 && tail && tail.length >= 8) {
              cur.push({ _bi: b._bi, type: 'p', text: head, color: b.color, bold: b.bold });
              flush();
              queue.splice(qi + 1, 0, { ...b, _bi: b._bi, text: tail, splitFrom: true, forceNewPage: false });
              continue;
            }
          }
        }

        flush();
        cur.push(b);
        curH = Math.min(availH, blockH);
      }
      if (cur.length) pages.push(cur);

      const merged = [];
      for (const pg of pages) {
        if (!pg.length) { merged.push([]); continue; }
        const onlyImgs = pg.every(b => b.type === 'img');
        const last = merged[merged.length - 1];
        if (onlyImgs && last && last.length && last.every(b => b.type === 'img')) {
          last.push(...pg);
        } else {
          merged.push(pg.slice());
        }
      }

      if (isDual) {
        for (let i = 0; i < merged.length; i++) {
          const pg = merged[i];
          if (!pg.length) continue;
          if (!pg[0] || !pg[0].forceNewPage) continue;
          if (i % 2 === 1) merged.splice(i, 0, []);
        }
      }

      book.pages = merged.length ? merged : [[{ _bi: 0, type: 'p', text: '暂无内容' }]];
    }

    let repaginateTimer = null;
    function repaginateDebounced() {
      clearTimeout(repaginateTimer);
      repaginateTimer = setTimeout(() => {
        const book = state.currentBook;
        if (!book) return;
        const anchor = getAnchorBlock(book);
        repaginate();
        restorePageIndexByAnchor(book, anchor);
        renderReaderPages({ skipDbSave: true });
      }, 60);

    async function renderReaderPages(opts = {}) {
      const book = state.currentBook;
      if (!book) return;
      const mode = state.readerConfig.viewMode;
      const pL = $('page-left'), pR = $('page-right');

      const total = (book.pages && book.pages.length) || 1;
      state.currentPageIndex = Math.max(0, Math.min(state.currentPageIndex, total - 1));
      if (mode === 'dual') state.currentPageIndex = alignPageForMode(state.currentPageIndex);

      book.lastPageIndex = state.currentPageIndex;
      if (mode !== 'scroll') {
        const curPg = (book.pages && book.pages[state.currentPageIndex]) || [];
        const firstBlk = curPg.find(b => b && typeof b._bi === 'number');
        if (firstBlk) book.lastBlockIndex = firstBlk._bi;
      }

      const stepSpan = mode === 'dual' ? 2 : 1;
      book.progressPercent = Math.min(100, Math.max(0.05, (Math.min(total, state.currentPageIndex + stepSpan) / total) * 100));
      if (opts && opts.skipDbSave) {
        saveQuickProgress(book);
      } else {
        saveBookProgressDebounced(book);
      }

      if (mode === 'scroll') {
        pL.innerHTML = `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${(book.rawBlocks || []).map(blockHtml).join('')}</div>`;
        pR.innerHTML = '';
        applyNoteHighlights(pL);
      } else {
        const renderLeaf = idx => `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${((book.pages && book.pages[idx]) || []).map(blockHtml).join('')}</div>`;
        pL.innerHTML = renderLeaf(state.currentPageIndex);
        if (mode === 'dual') {
          pR.innerHTML = renderLeaf(state.currentPageIndex + 1);
          applyNoteHighlights($('reader-content-viewport'));
        } else {
          pR.innerHTML = '';
          applyNoteHighlights(pL);
        }
      }
    }

    function turnPage(dir) {
      if (!state.currentBook || state.readerConfig.viewMode === 'scroll') return;
      const step = state.readerConfig.viewMode === 'dual' ? 2 : 1;
      const total = state.currentBook.pages.length;
      const next = state.currentPageIndex + dir * step;
      if (next < 0) return showToast('已经是第一页');
      if (next >= total) return showToast('已经是最后一页');
      state.currentPageIndex = next;
      hideSelectionPopover();
      renderReaderPages();
    }

        addBtn.onclick = () => $(pickerId).click();

        cfg[listKey].forEach(color => {

          wrap.innerHTML = `

          wrap.querySelector('.swatch-btn').onclick = () => {

            applyThemeColors();

      $('close-assign-shelf-btn').onclick = () => $('assign-shelf-modal').classList.add('hidden');

      $('book-act-shelf').onclick = () => { closeBookMenu(); if (state.activeMenuBookId) openAssignModal([state.activeMenuBookId]); };
      $('book-act-multiselect').onclick = () => {
        closeBookMenu();
        state.multiSelectMode = true;
        state.selectedBookIds.clear();
        if (state.activeMenuBookId) state.selectedBookIds.add(state.activeMenuBookId);
        renderLibrary();
      };
      $('book-act-cloud-upload').onclick = async () => {
        closeBookMenu();
        if (!isCloudConnected()) return showToast('请先连接私有仓');
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (!bk) return;
        if (!state.currentNav.startsWith('shelf:') || !bk.shelf || !state.shelves.includes(bk.shelf)) {
          return showToast('请先进入对应书架后再上传到云仓库');
        }
        if (bk.cloudPath || bk.cloudSha) {
          return showToast('该书已在云仓库中');
        }
        if (!bk.fileBytes) {
          return showToast('本地无原始文件，无法上传');
        }
        try {
          showToast(`正在上传《${bk.title}》到云仓库「${bk.shelf}」...`);
          await uploadBookToCloud(bk);
          await saveBookDB(bk);
          renderLibrary();
          showToast(`已上传《${bk.title}》到云端「${bk.shelf}」`);
        } catch (e) {
          showToast(`上传失败：${e.message || '请检查仓库权限'}`);
        }
      };
      $('book-act-purge-one').onclick = async () => {
        closeBookMenu();
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (bk) {
          if (!bk.cloudPath && !bk.cloudSha) {
            return showToast('该书仅在本地存在，未上传云端，不可释放本地文件');
          }
          bk.fileBytes = null;
          bk.rawBlocks = null;
          bk.isCloudOnly = true;
          await saveBookDB(bk);
          renderLibrary();
          showToast(`已释放《${bk.title}》的本地缓存空间`);
        }
      };
      $('book-act-delete').onclick = async () => {
        closeBookMenu();
        const idx = state.books.findIndex(b => b.id === state.activeMenuBookId);
        if (idx !== -1) {
          const removed = state.books.splice(idx, 1)[0];
          await deleteBookDB(removed.id);
          renderLibrary();
          showToast(`已删除《${removed.title}》`);
        }
      };
      $('book-act-cloud-delete').onclick = async () => {
        closeBookMenu();
        if (!isCloudConnected()) return showToast('请先连接私有仓');
        const idx = state.books.findIndex(b => b.id === state.activeMenuBookId);
        if (idx === -1) return;
        const bk = state.books[idx];
        try {
          showToast(`正在从私有仓删除《${bk.title}》...`);
          await deleteBookFromCloud(bk);
          state.books.splice(idx, 1);
          await deleteBookDB(bk.id);
          renderLibrary();
          showToast(`已从本地与私有仓删除《${bk.title}》`);
        } catch (e) {
          showToast(`云端删除失败：${e.message || '请检查仓库权限'}`);
        }
      };

      $('batch-add-shelf-btn').onclick = () => openAssignModal(Array.from(state.selectedBookIds));
      $('batch-delete-btn').onclick = async () => {
        for (const id of state.selectedBookIds) {
          const i = state.books.findIndex(b => b.id === id);
          if (i !== -1) { state.books.splice(i, 1); await deleteBookDB(id); }
        }
        state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary();
      };
      $('batch-exit-btn').onclick = () => { state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary(); };

      $('reader-home-trigger').onclick = () => {
        clearTimeout(saveProgressTimer);
        if (state.currentBook) {
          saveQuickProgress(state.currentBook);
          saveBookDB(state.currentBook);
        }
        exitFullscreenIfAny();
        $('reader-view').classList.add('hidden');
        $('library-view').classList.remove('hidden');
        if (state.currentNav === 'notes') showNotesView();
        else renderLibrary();
      };
      $('reader-settings-trigger').onclick = () => {
        $('reader-settings-drawer').classList.remove('translate-x-full');
        $('settings-backdrop').classList.remove('hidden');
      };
      const closeDrawer = () => {
        $('reader-settings-drawer').classList.add('translate-x-full');
        $('settings-backdrop').classList.add('hidden');
      };
      $('close-settings-drawer-btn').onclick = closeDrawer;
      $('settings-backdrop').onclick = closeDrawer;

      $('reader-toc-trigger').onclick = () => {
        if ($('reader-toc-drawer').classList.contains('-translate-x-full')) openTocDrawer();
        else closeTocDrawer();
      };
      $('toc-backdrop').onclick = closeTocDrawer;
      $('toc-tab-toc').onclick = () => { state.tocTab = 'toc'; updateTocTabs(); renderTocList(); };
      $('toc-tab-bm').onclick = () => { state.tocTab = 'bm'; updateTocTabs(); renderTocList(); };

      $('toc-search-open').onclick = openTocSearch;
      $('toc-search-close').onclick = closeTocSearch;
      $('toc-search-input').oninput = () => runTocSearch();
      $('toc-search-clear').onclick = () => {
        $('toc-search-input').value = '';
        runTocSearch();
        $('toc-search-input').focus();
      };
      $('toc-search-input').onkeydown = e => {
        if (e.key === 'Escape') { e.stopPropagation(); closeTocSearch(); }
      };

      $('add-bookmark-btn').onclick = async () => {
        const book = state.currentBook;
        if (!book) return;
        book.bookmarks = book.bookmarks || [];

        ensureBlockIndices(book);
        const bi = getCurrentReadingBlockIndex();
        const curPage = findPageOfBlock(book, bi);
        if (book.bookmarks.some(m => (typeof m.blockIndex === 'number' ? findPageOfBlock(book, m.blockIndex) : m.page) === curPage)) {
          return showToast('当前位置已在书签中');
        }
        const blocks = book.rawBlocks || [];
        let snippet = '';
        for (let i = Math.max(0, bi); i < Math.min(blocks.length, bi + 6); i++) {
          if (blocks[i] && blocks[i].text) {
            snippet = blocks[i].text.slice(0, 48);
            break;
          }
        }
        const chap = getChapterNameForBlock(book, bi);
        book.bookmarks.push({
          blockIndex: Math.max(0, bi),
          page: curPage,
          chapter: chap,
          label: snippet || chap || `第 ${curPage + 1} 页`,
          createdAt: Date.now()
        });
        book.bookmarks.sort((a, b) => (a.blockIndex ?? 0) - (b.blockIndex ?? 0));

        await saveBookDB(book);
        state.tocTab = 'bm';
        updateTocTabs();
        renderTocList();
        showToast('已加入书签');
      };

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        b.onclick = async () => {
          const book = state.currentBook;
          const anchorBi = book ? getCurrentReadingBlockIndex() : -1;
          state.readerConfig.viewMode = b.dataset.mode;
          savePrefs();
          applyLayoutStyles();
          repaginate();
          if (book && anchorBi >= 0) {
            await jumpToBookLocation({ blockIndex: anchorBi });
          } else {
            await renderReaderPages();
          }
        };
      });

      $('native-bg-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customBgColors.includes(hex)) state.readerConfig.customBgColors.push(hex);
        state.readerConfig.bgColor = hex;
        savePrefs(); applyThemeColors(); renderColorSwatches();
      };
      $('native-text-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customTextColors.includes(hex)) state.readerConfig.customTextColors.push(hex);
        state.readerConfig.textColor = hex;
        savePrefs(); applyThemeColors(); renderColorSwatches();
      };
      $('clear-bg-custom-btn').onclick = () => {
        state.readerConfig.customBgColors = [];
        state.readerConfig.bgColor = null;
        savePrefs(); applyThemeColors(); renderColorSwatches();
        showToast('已清除，还原原书背景');
      };
      $('clear-text-custom-btn').onclick = () => {
        state.readerConfig.customTextColors = [];
        state.readerConfig.textColor = null;
        savePrefs(); applyThemeColors(); renderColorSwatches();
        showToast('已清除，还原原书文字色');
      };

      $('select-font-family').onchange = e => {
        state.readerConfig.fontFamily = e.target.value;
        savePrefs();
        applyLayoutStyles();
        requestAnimationFrame(() => {
          const book = state.currentBook;
          if (!book) return;
          const anchor = getAnchorBlock(book);
          repaginate();
          restorePageIndexByAnchor(book, anchor);
          renderReaderPages({ skipDbSave: true });
        });
      };

      $('import-local-font-btn').onclick = () => $('font-upload-input').click();
      $('font-upload-input').onchange = async e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        await handleLocalFontImport(file);
      };

      let lastWheelTime = 0;
      window.addEventListener('wheel', e => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (state.readerConfig.viewMode === 'scroll') return;
        const now = Date.now();
        if (now - lastWheelTime < 240) return;
        if (Math.abs(e.deltaY) > 20) {
          lastWheelTime = now;
          turnPage(e.deltaY > 0 ? 1 : -1);
        }
      }, { passive: true });

      window.addEventListener('keydown', e => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) turnPage(-1);
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) turnPage(1);
      });

      let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
      $('reader-content-viewport').addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }, { passive: true });

      $('reader-content-viewport').addEventListener('touchend', e => {
        const held = Date.now() - touchStartTime;
        if (held > 350) return;
        if (window.getSelection().toString()) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (state.readerConfig.viewMode === 'scroll') {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            const v = $('reader-view');
            v.classList.toggle('mobile-controls-active');
            if (v.classList.contains('mobile-controls-active')) autoHideMobileControls();
            else clearTimeout(mobileCtrlTimer);
          }
          return;
        }
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          turnPage(dx < 0 ? 1 : -1);
        } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          const x = e.changedTouches[0].clientX, w = window.innerWidth;
          if (x < w * 0.25) turnPage(-1);
          else if (x > w * 0.75) turnPage(1);
          else {
            const v = $('reader-view');
            v.classList.toggle('mobile-controls-active');
            if (v.classList.contains('mobile-controls-active')) autoHideMobileControls();
            else clearTimeout(mobileCtrlTimer);
          }
        }
      }, { passive: true });
    });
  </script>
</body>
</html>
