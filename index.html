<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneReader" />
  <title>OneReader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --reader-bg: #fdf6e3;
      --reader-text: #2f251e;
      --reader-font-size: 22px;
      --reader-margin: 0px;
      --reader-letter-spacing: 0px;
      --reader-para-spacing: 15px;
      --reader-page-width: 1.2;
      --reader-brightness: 1;
      --reader-font-family: '叶立群几何体测试版', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; user-select: none; overflow: hidden; background: #fff; color: #2c2c2c; }
    #book-stage, #page-left, #page-left *, #page-right, #page-right *, #page-measure-box, #page-measure-box * { font-family: var(--reader-font-family) !important; }
    input[type='range'].onereader-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: #6c6c6c; border-radius: 999px; outline: none; }
    input[type='range'].onereader-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #6b6863; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .swatch-selected { box-shadow: 0 0 0 3px #fafafa, 0 0 0 5px #443c35; }
    .paginated-leaf { overflow: hidden !important; }
    .paginated-leaf::-webkit-scrollbar { display: none !important; }
    #reader-view.mobile-controls-active .corner-float-btn { opacity: 1 !important; pointer-events: auto !important; }
    @keyframes cloudPulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    .cloud-btn-hover:hover svg .cloud-arrow { animation: cloudPulse 1.2s ease-in-out infinite; }
    @media (max-width: 768px) {
      #library-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 45; background: #fff; box-shadow: 4px 0 24px rgba(0,0,0,.14); transition: transform .22s ease; }
      #library-sidebar.mobile-closed { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- 隐藏本地文件与字体选择器 -->
  <input id="file-upload-input" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple class="hidden" />
  <input id="font-upload-input" type="file" accept=".ttf,.otf,.woff,.woff2" class="hidden" />

  <!-- ==================== 1. 书库主页视图 ==================== -->
  <div id="library-view" class="flex-1 flex flex-col h-full w-full bg-white overflow-hidden">
    <!-- 顶部栏：汉堡菜单 + 搜索框（无多余按钮） + 右上角优化云标志 -->
    <header class="h-20 w-full flex items-center justify-between px-4 sm:px-8 shrink-0">
      <div class="flex items-center gap-3 sm:gap-6 flex-1 min-w-0">
        <button id="toggle-sidebar-btn" type="button" title="导航菜单" class="p-2.5 rounded-xl hover:bg-neutral-100 text-neutral-700 transition cursor-pointer shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center ml-1 sm:ml-14 md:ml-20 flex-1 min-w-0">
          <div class="relative w-full max-w-[270px]">
            <input id="library-search-input" type="text" placeholder="搜索我的书库" class="w-full h-11 pl-5 pr-10 rounded-full bg-[#ebebeb] text-[15px] text-neutral-700 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400 transition" />
            <svg class="w-5 h-5 text-neutral-500 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
          </div>
        </div>
      </div>

      <!-- 右上角：定制云端书库与导入图标按钮 -->
      <div class="relative flex items-center gap-2 shrink-0">
        <button id="open-cloud-modal-btn" type="button" title="云端私有书库与图书导入" class="cloud-btn-hover group relative p-2.5 rounded-2xl hover:bg-neutral-100 active:scale-95 transition flex items-center justify-center cursor-pointer">
          <svg class="w-10 h-10 text-[#3b3b3b] group-hover:text-black transition" viewBox="0 0 40 32" fill="none">
            <!-- 外层柔和云朵轮廓 -->
            <path d="M11.5 26.5H29.5C33.6421 26.5 37 23.1421 37 19C37 15.203 34.1783 12.065 30.514 11.568C29.389 6.657 25.002 3 19.75 3C13.675 3 8.75 7.925 8.75 14C8.75 14.389 8.77 14.773 8.81 15.151C5.534 15.792 3 18.678 3 22.15C3 24.552 4.948 26.5 7.35 26.5H11.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(59,59,59,0.03)"/>
            <!-- 云朵内部双向同步流线箭头 -->
            <g class="cloud-arrow" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 19.5V12.5M16.5 12.5L13.8 15.2M16.5 12.5L19.2 15.2"/>
              <path d="M23.5 13.5V20.5M23.5 20.5L20.8 17.8M23.5 20.5L26.2 17.8"/>
            </g>
          </svg>
          <!-- 云连接状态指示点：未连接灰、已连接绿 -->
          <span id="cloud-status-dot" class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-neutral-400 ring-2 ring-white transition-colors"></span>
        </button>
      </div>
    </header>

    <!-- 主体：左侧精简导航栏 + 右侧图书网格 -->
    <div class="flex-1 flex overflow-hidden relative">
      <div id="mobile-sidebar-backdrop" class="hidden fixed inset-0 bg-black/30 z-40 md:hidden"></div>

      <!-- 左侧导航栏（仅保留全部图书与我的书架） -->
      <aside id="library-sidebar" class="mobile-closed md:transform-none w-[230px] shrink-0 flex flex-col justify-between pr-3 pb-4 select-none overflow-y-auto">
        <div class="space-y-1 pt-2 md:pt-0">
          <nav id="main-nav-list" class="space-y-1">
            <button type="button" data-nav="all" class="nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full bg-[#4a4a4a] text-white text-[15px] font-medium transition cursor-pointer">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
              <span>全部图书</span>
            </button>
          </nav>

          <!-- 我的书架分组 -->
          <div class="pt-4">
            <button id="shelf-collapse-btn" type="button" class="w-full flex items-center justify-between pl-6 pr-5 py-2.5 text-[15px] font-semibold text-neutral-800 hover:bg-neutral-50 rounded-r-full cursor-pointer">
              <span>我的书架</span>
              <svg id="shelf-chevron" class="w-4 h-4 text-neutral-600 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="shelf-items-container" class="mt-1 space-y-1">
              <button id="create-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700 text-base leading-none">+</span>
                <span>新建书架</span>
              </button>
              <button id="manage-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M4 20h4l10.5-10.5a2.5 2.5 0 00-3.536-3.536L4 16v4z"/></svg>
                </span>
                <span>管理书架</span>
              </button>
              <div id="custom-shelf-list" class="space-y-1"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 右侧图书内容区 -->
      <main class="flex-1 h-full overflow-y-auto px-6 sm:px-12 pt-6 sm:pt-8 pb-24">
        <div id="empty-library-state" class="mt-16 sm:mt-20 ml-2 sm:ml-4 max-w-md">
          <h1 class="text-[32px] sm:text-[38px] font-normal text-[#3c3c3c] tracking-wide">图书库为空</h1>
          <p class="mt-4 text-[19px] sm:text-[22px] text-[#9e9e9e] leading-relaxed font-light">
            请点击右上角的云端图标连接私有仓或从本地导入图书
          </p>
        </div>
        <div id="books-grid-container" class="hidden">
          <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-6 gap-y-8"></div>
        </div>
      </main>

      <!-- 多选模式底部批量操作栏 -->
      <div id="multiselect-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-[#3b3b3b] text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-4 text-sm">
        <span id="multiselect-count" class="text-neutral-200 font-medium">已选 0 本</span>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-add-shelf-btn" type="button" class="hover:text-amber-300 transition cursor-pointer">添加到书架</button>
        <button id="batch-pin-btn" type="button" class="hover:text-amber-300 transition cursor-pointer">置顶</button>
        <button id="batch-delete-btn" type="button" class="text-red-300 hover:text-red-400 transition cursor-pointer">删除</button>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-exit-btn" type="button" class="px-2.5 py-1 rounded-lg bg-white/15 hover:bg-white/25 transition cursor-pointer">退出</button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 右上角云标志弹窗：GitHub 私有云配置与本地导入（无任何预填值） ==================== -->
  <div id="cloud-hub-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-[460px] w-full p-6 shadow-2xl border border-neutral-100 flex flex-col max-h-[90vh] overflow-y-auto">
      <div class="relative flex items-center justify-center pb-4 border-b border-neutral-100">
        <div class="flex items-center gap-2">
          <span class="text-[19px] font-medium text-[#333]">云端私有书库与本地导入</span>
        </div>
        <button id="close-cloud-modal-btn" type="button" class="absolute right-0 p-1.5 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <!-- 快捷操作区：本地导入 + 下载 HTML -->
      <div class="py-4 border-b border-neutral-100 space-y-2.5">
        <div class="text-xs font-medium text-neutral-400 uppercase tracking-wider">本地操作</div>
        <div class="grid grid-cols-2 gap-2.5">
          <button id="hub-import-local-btn" type="button" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-[#484848] hover:bg-black text-white text-sm font-medium transition cursor-pointer">
            <span>📂 导入本地图书</span>
          </button>
          <button id="hub-download-html-btn" type="button" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl bg-neutral-100 hover:bg-neutral-200 text-neutral-800 text-sm font-medium transition cursor-pointer">
            <span>💾 下载 index.html</span>
          </button>
        </div>
        <label class="flex items-center justify-between pt-1 px-1 text-sm text-neutral-600 cursor-pointer">
          <span>本地导入新书时自动上传至 GitHub 私有仓</span>
          <input id="auto-upload-checkbox" type="checkbox" class="w-4 h-4 accent-[#484848] rounded cursor-pointer" />
        </label>
      </div>

      <!-- GitHub 私有仓库配置表单（严格留空，不预填用户名与仓库名） -->
      <div class="pt-4 space-y-3.5 text-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-neutral-400 uppercase tracking-wider">GitHub 私有仓连接配置</span>
          <span id="cloud-conn-badge" class="text-xs px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-500">未连接</span>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">GitHub 用户名 (Owner)</label>
          <input id="gh-owner-input" type="text" value="" placeholder="请手动输入您的 GitHub 用户名" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-neutral-700 mb-1">私有仓库名 (Repo)</label>
            <input id="gh-repo-input" type="text" value="" placeholder="请手动输入私有仓库名称" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
          <div>
            <label class="block text-neutral-700 mb-1">分支 (Branch)</label>
            <input id="gh-branch-input" type="text" value="" placeholder="默认 main" autocomplete="off" class="w-full h-10 px-3 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">细粒度访问令牌 (Fine-grained Token)</label>
          <div class="relative">
            <input id="gh-token-input" type="password" value="" placeholder="粘贴 github_pat_... 或 ghp_... 密钥" autocomplete="off" class="w-full h-10 pl-3.5 pr-14 rounded-xl border border-neutral-300 text-sm font-mono focus:outline-none focus:border-neutral-700" />
            <button id="toggle-token-vis-btn" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-neutral-500 hover:text-black px-1.5 py-0.5 rounded cursor-pointer">显示</button>
          </div>
          <p class="mt-1 text-[12px] text-neutral-400 leading-normal">密钥仅保存在您当前设备的浏览器本地，不会上传至任何第三方。</p>
        </div>

        <div class="pt-2 flex flex-col gap-2">
          <button id="gh-connect-pull-btn" type="button" class="w-full py-2.5 rounded-2xl bg-[#3b3b3b] hover:bg-black text-white font-medium text-sm transition cursor-pointer">
            保存并拉取私有仓书库
          </button>
          <div class="grid grid-cols-2 gap-2">
            <button id="gh-push-meta-btn" type="button" class="py-2 rounded-xl border border-neutral-300 hover:bg-neutral-100 text-neutral-700 text-xs font-medium transition cursor-pointer">
              ☁️ 同步阅读进度到云端
            </button>
            <button id="gh-clear-config-btn" type="button" class="py-2 rounded-xl border border-red-200 hover:bg-red-50 text-red-600 text-xs font-medium transition cursor-pointer">
              断开并清除本地密钥
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 3. 单本书右下角 ••• 紧凑圆角弹窗（图4） ==================== -->
  <div id="book-action-backdrop" class="hidden fixed inset-0 z-50"></div>
  <div id="book-action-popover" class="hidden fixed z-50 w-44 bg-white rounded-2xl shadow-[0_10px_32px_rgba(0,0,0,0.16)] border border-neutral-100 py-1.5 px-1.5 text-[15px] text-[#3a3a3a] select-none">
    <button id="book-act-shelf" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="13" width="16" height="5" rx="1.5"/></svg>
      <span>添加到书架</span>
    </button>
    <button id="book-act-multiselect" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      <span>多选</span>
    </button>
    <button id="book-act-pin" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 18V6m0 0L4 9m3-3l3 3M13 7h7M13 12h7M13 17h7"/></svg>
      <span id="book-act-pin-label">置顶</span>
    </button>
    <button id="book-act-upload-cloud" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-neutral-100 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <span>上传到私有云</span>
    </button>
    <button id="book-act-delete" type="button" class="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-red-50 text-[#3a3a3a] hover:text-red-600 transition cursor-pointer text-left">
      <svg class="w-4 h-4 text-neutral-700 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      <span>删除</span>
    </button>
  </div>

  <!-- ==================== 4. 管理书架 圆角弹窗（图1） ==================== -->
  <div id="manage-shelves-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-[420px] w-full pt-5 pb-5 px-6 shadow-2xl border border-neutral-100 flex flex-col max-h-[82vh]">
      <div class="relative flex items-center justify-center pb-4">
        <h3 class="text-[20px] font-normal text-[#3b3b3b] tracking-wide">管理书架</h3>
        <button id="close-manage-shelves-btn" type="button" class="absolute right-0 p-1.5 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="manage-shelves-list" class="flex-1 overflow-y-auto py-2 space-y-2 min-h-[180px]"></div>
      <div class="pt-5 flex justify-end">
        <span class="text-[15px] text-[#555555]">拖动进行排序</span>
      </div>
    </div>
  </div>

  <!-- 添加到书架弹窗 -->
  <div id="assign-shelf-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-neutral-100">
      <div class="relative flex items-center justify-center pb-3">
        <h4 class="text-[18px] font-normal text-[#3b3b3b]">添加到书架</h4>
        <button id="close-assign-shelf-btn" type="button" class="absolute right-0 p-1 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">✕</button>
      </div>
      <div id="assign-shelf-options" class="mt-2 space-y-1.5 max-h-60 overflow-y-auto"></div>
    </div>
  </div>

  <!-- 通用输入弹窗（新建/重命名书架） -->
  <div id="custom-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-neutral-100">
      <h4 id="modal-title" class="text-lg font-medium text-neutral-800">新建书架</h4>
      <p id="modal-desc" class="text-sm text-neutral-500 mt-1">请输入书架名称：</p>
      <input id="modal-input" type="text" class="mt-3 w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
      <div class="mt-5 flex justify-end gap-2.5">
        <button id="modal-cancel-btn" type="button" class="px-4 py-2 rounded-xl text-sm text-neutral-600 hover:bg-neutral-100 transition cursor-pointer">取消</button>

  <!-- 轻提示 Toast -->
  <div id="toast-message" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-[#333]/95 text-white text-sm shadow-lg opacity-0 transition-opacity duration-200"></div>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const $ = id => document.getElementById(id);
    const isMobile = () => window.innerWidth <= 768;
    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const state = {
      shelves: ['交易', '世界', '小说', '技能'],
      currentNav: 'all',
      searchQuery: '',
      books: [],
      currentBook: null,
      currentPageIndex: 0,
      activeMenuBookId: null,
      multiSelectMode: false,
      selectedBookIds: new Set(),
      modalConfirmCallback: null,
      // GitHub 配置默认全空，不预填任何账号或仓库名
      github: { owner: '', repo: '', branch: '', token: '', autoUpload: false, metaSha: '' },
      fontMap: {
        yeliqun: "'叶立群几何体测试版', 'YouYuan', 'PingFang SC', 'Microsoft YaHei', sans-serif",
        yahei: "'Microsoft YaHei', 'PingFang SC', sans-serif",
        songti: "'SimSun', 'Songti SC', serif",
        kaiti: "'KaiTi', 'STKaiti', serif"
      },
      readerConfig: {
        viewMode: isMobile() ? 'single' : 'dual',
        bgColor: '#fdf6e3',
        textColor: '#2f251e',
        customBgColors: ['#fdf6e3'],
        customTextColors: ['#2f251e'],
        fontSize: isMobile() ? 20 : 23,
        margin: 0,
        letterSpacing: 0,
        paraSpacing: 15,
        pageWidth: 1.2,
        brightness: 1,
        fontFamily: 'yeliqun'
      }
    };

    const PREFS_KEY = 'onereader_prefs_v3';
    const GH_KEY = 'onereader_gh_config_v3';
    const DB_NAME = 'OneReaderDB_v3';

    let toastTimer = null;
    function showToast(msg) {
      const el = $('toast-message');
      el.textContent = msg;
      el.classList.replace('opacity-0', 'opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.replace('opacity-100', 'opacity-0'), 2600);
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({ shelves: state.shelves, readerConfig: state.readerConfig }));
        localStorage.setItem(GH_KEY, JSON.stringify(state.github));
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (Array.isArray(p.shelves) && p.shelves.length) state.shelves = p.shelves;
        if (p.readerConfig) Object.assign(state.readerConfig, p.readerConfig);
        const g = JSON.parse(localStorage.getItem(GH_KEY) || '{}');
        if (g && typeof g === 'object') Object.assign(state.github, g);
      } catch (e) {}
    }

    // ==================== IndexedDB 离线缓存 ====================
    function openDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains('books')) {
            e.target.result.createObjectStore('books', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function saveBookDB(b) {
      const db = await openDB();
      if (!db) return;
      const copy = { ...b, pdfDoc: undefined, pages: undefined };
      db.transaction('books', 'readwrite').objectStore('books').put(copy);
    }

    async function deleteBookDB(id) {
      const db = await openDB();
      if (db) db.transaction('books', 'readwrite').objectStore('books').delete(id);
    }

    async function loadAllBooksDB() {
      const db = await openDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction('books', 'readonly').objectStore('books').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    // ==================== GitHub 私有仓 REST API 核心 ====================
    function updateCloudIndicator() {
      const connected = Boolean(state.github.owner && state.github.repo && state.github.token);
      $('cloud-status-dot').className = `absolute top-2 right-2 w-2.5 h-2.5 rounded-full ring-2 ring-white transition-colors ${connected ? 'bg-emerald-500' : 'bg-neutral-400'}`;
      const badge = $('cloud-conn-badge');
      badge.textContent = connected ? `已连接 ${state.github.owner}/${state.github.repo}` : '未连接';
      badge.className = `text-xs px-2.5 py-0.5 rounded-full ${connected ? 'bg-emerald-50 text-emerald-700 font-medium' : 'bg-neutral-100 text-neutral-500'}`;
    }

    function ghHeaders(extra = {}) {
      return {
        'Authorization': `Bearer ${state.github.token.trim()}`,
        'Accept': 'application/vnd.github+json',
        ...extra
      };
    }

    function uint8ToBase64(u8) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk) {
        binary += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    // 拉取私有仓文件列表与 onereader_meta.json
    async function pullFromGitHubPrivateRepo() {
      const owner = $('gh-owner-input').value.trim();
      const repo = $('gh-repo-input').value.trim();
      const branch = $('gh-branch-input').value.trim() || 'main';
      const token = $('gh-token-input').value.trim();
      if (!owner || !repo || !token) {
        return showToast('请先完整填写 GitHub 用户名、私有仓库名与 Token');
      }
      state.github = { ...state.github, owner, repo, branch, token };
      savePrefs();
      updateCloudIndicator();

      showToast('正在连接 GitHub 私有仓库...');
      try {
        const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents?ref=${encodeURIComponent(branch)}`;
        const resp = await fetch(url, { headers: ghHeaders() });
        if (resp.status === 404) {
          showToast('仓库为空或不存在，已准备就绪');
          $('cloud-hub-modal').classList.add('hidden');
          return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const files = await resp.json();
        if (!Array.isArray(files)) return;

        // 1. 检查是否存在进度配置文件 onereader_meta.json
        const metaFile = files.find(f => f.name === 'onereader_meta.json');
        let cloudMeta = {};
        if (metaFile) {
          state.github.metaSha = metaFile.sha;
          const mResp = await fetch(metaFile.url, { headers: ghHeaders({ 'Accept': 'application/vnd.github.raw' }) });
          if (mResp.ok) {
            cloudMeta = await mResp.json();
            if (Array.isArray(cloudMeta.shelves) && cloudMeta.shelves.length) state.shelves = cloudMeta.shelves;
            if (cloudMeta.readerConfig) Object.assign(state.readerConfig, cloudMeta.readerConfig);
          }
        }

        // 2. 合并云端 .epub / .pdf 图书条目
        const bookFiles = files.filter(f => f.type === 'file' && /\.(epub|pdf)$/i.test(f.name));
        for (const f of bookFiles) {
          const format = f.name.toLowerCase().endsWith('.pdf') ? 'PDF' : 'EPUB';
          const title = f.name.replace(/\.(epub|pdf)$/i, '');
          const metaItem = (cloudMeta.books && cloudMeta.books[f.name]) || {};
          let existing = state.books.find(b => b.fileName === f.name || b.title === title);
          if (!existing) {
            const cloudBook = {
              id: 'cloud-' + f.sha.slice(0, 10),
              title,
              fileName: f.name,
              format,
              shelf: metaItem.shelf || '',
              pinned: Boolean(metaItem.pinned),
              addedAt: metaItem.addedAt || Date.now(),
              coverUrl: metaItem.coverUrl || '',
              hasBeenRead: Boolean(metaItem.hasBeenRead),
              progressPercent: metaItem.progressPercent || 0,
              lastPageIndex: metaItem.lastPageIndex || 0,
              cloudPath: f.path,
              cloudSha: f.sha,
              isCloudOnly: true
            };
            state.books.push(cloudBook);
            await saveBookDB(cloudBook);
          } else {
            existing.cloudPath = f.path;
            existing.cloudSha = f.sha;
            if (metaItem.progressPercent > (existing.progressPercent || 0)) {
              existing.progressPercent = metaItem.progressPercent;
              existing.lastPageIndex = metaItem.lastPageIndex || 0;
              existing.hasBeenRead = true;
            }
            await saveBookDB(existing);
          }
        }

        savePrefs();
        renderShelves();
        renderLibrary();
        renderColorSwatches();
        $('cloud-hub-modal').classList.add('hidden');
        showToast(`同步成功：发现 ${bookFiles.length} 本云端图书`);
      } catch (err) {
        console.error(err);
        showToast('连接失败，请检查用户名、仓库名、分支或 Token 权限');
      }
    }

    // 同步书架、阅读进度与颜色配置到私有仓 onereader_meta.json
    async function pushMetaToGitHub(silent = false) {
      const { owner, repo, branch, token } = state.github;
      if (!owner || !repo || !token) {
        if (!silent) showToast('请先配置并连接 GitHub 私有仓');
        return;
      }
      try {
        const booksMeta = {};
        state.books.forEach(b => {
          const key = b.fileName || `${b.title}.${(b.format || 'epub').toLowerCase()}`;
          booksMeta[key] = {
            shelf: b.shelf || '',
            pinned: Boolean(b.pinned),
            hasBeenRead: Boolean(b.hasBeenRead),
            progressPercent: b.progressPercent || 0,
            lastPageIndex: b.lastPageIndex || 0,
            addedAt: b.addedAt || Date.now()
          };
        });
        const payloadObj = {
          updatedAt: new Date().toISOString(),
          shelves: state.shelves,
          readerConfig: state.readerConfig,
          books: booksMeta
        };
        const bytes = new TextEncoder().encode(JSON.stringify(payloadObj, null, 2));
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/onereader_meta.json`;

        let sha = state.github.metaSha;
        if (!sha) {
          const check = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch || 'main')}`, { headers: ghHeaders() });
          if (check.ok) {
            const data = await check.json();
            sha = data.sha;
          }
        }

        const body = {
          message: 'Sync OneReader progress & shelves',
          content: uint8ToBase64(bytes),
          branch: branch || 'main'
        };
        if (sha) body.sha = sha;

        const res = await fetch(apiUrl, {
          method: 'PUT',
          headers: ghHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(body)
        });
        if (res.ok) {
          const data = await res.json();
          state.github.metaSha = data.content && data.content.sha ? data.content.sha : sha;
          savePrefs();
          if (!silent) showToast('已将书架与阅读进度同步至私有仓');
        }
      } catch (e) {
        if (!silent) showToast('同步进度到私有仓失败');
      }
    }

    // 上传单本图书二进制文件到 GitHub 私有仓库
    async function uploadBookToGitHub(book) {
      const { owner, repo, branch, token } = state.github;
      if (!owner || !repo || !token) {
        $('cloud-hub-modal').classList.remove('hidden');
        return showToast('请先填写 GitHub 私有仓配置');
      }
      if (!book.fileBytes) {
        return showToast('该图书已在云端或无本地原始文件流');
      }
      const fileName = book.fileName || `${book.title}.${book.format.toLowerCase()}`;
      showToast(`正在上传《${book.title}》到私有云...`);
      try {
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(fileName)}`;
        let sha = book.cloudSha;
        if (!sha) {
          const check = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch || 'main')}`, { headers: ghHeaders() });
          if (check.ok) {
            const exist = await check.json();
            sha = exist.sha;
          }
        }
        const u8 = new Uint8Array(book.fileBytes);
        const body = {
          message: `Upload ${fileName}`,
          content: uint8ToBase64(u8),
          branch: branch || 'main'
        };
        if (sha) body.sha = sha;

        const res = await fetch(apiUrl, {
          method: 'PUT',
          headers: ghHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const resData = await res.json();
        book.cloudPath = fileName;
        book.cloudSha = resData.content && resData.content.sha ? resData.content.sha : '';
        book.isCloudOnly = false;
        await saveBookDB(book);
        await pushMetaToGitHub(true);
        renderLibrary();
        showToast(`《${book.title}》已上传至私有仓`);
      } catch (err) {
        console.error(err);
        showToast('上传失败（请确认单文件小于 25~50MB 且 Token 具备 Contents 读写权限）');
      }
    }

    // ==================== 书架渲染与图1「管理书架」圆角弹窗 ====================
    function renderShelves() {
      const box = $('custom-shelf-list');
      box.innerHTML = '';
      state.shelves.forEach(name => {
        const key = `shelf:${name}`;
        const active = state.currentNav === key;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-[15px] transition cursor-pointer ${active ? 'bg-[#4a4a4a] text-white font-medium' : 'text-neutral-700 hover:bg-neutral-100'}`;
        btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="13" width="16" height="5" rx="1.5"/></svg><span class="truncate">${esc(name)}</span>`;
        btn.onclick = () => {
          state.currentNav = key;
          updateNavSelection();
        };
        box.appendChild(btn);
      });

    // ==================== EPUB / PDF 解析与云端按需流式下载 ====================
    async function parseEpubBuffer(arrayBuffer, fallbackTitle) {
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      const parser = new DOMParser();
      const imgMap = {};
      let coverDataUrl = '';

      for (const [p, entry] of Object.entries(zip.files)) {
        if (!entry.dir && /\.(jpe?g|png|webp|gif)$/i.test(p)) {
          const blob = await entry.async('blob');
          const url = URL.createObjectURL(blob);
          imgMap[p.toLowerCase()] = url;
          imgMap[p.split('/').pop().toLowerCase()] = url;
          if (!coverDataUrl && /cover/i.test(p)) {
            coverDataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          }
        }
      }

      const htmlFiles = Object.keys(zip.files)
        .filter(n => !zip.files[n].dir && /\.(xhtml|html|htm)$/i.test(n))
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      const rawBlocks = [];
      for (const f of htmlFiles) {
        const u8 = await zip.file(f).async('uint8array');
        const txt = new TextDecoder('utf-8').decode(u8);
        const doc = parser.parseFromString(txt, 'text/html');
        doc.querySelectorAll('script, style').forEach(el => el.remove());
        const els = doc.body ? doc.body.querySelectorAll('h1,h2,h3,h4,p,div,blockquote,img,li') : [];
        let addedInChapter = 0;
        els.forEach(el => {
          const tag = el.tagName.toLowerCase();
          if (tag === 'img') {
            const src = (el.getAttribute('src') || '').split('/').pop().toLowerCase();
            if (imgMap[src]) rawBlocks.push({ type: 'img', src: imgMap[src] });
            return;
          }
          if (tag === 'div' && el.children.length > 0) return;
          const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
          if (!t) return;
          if (/^h[1-4]$/.test(tag)) {
            rawBlocks.push({ type: 'heading', text: t, forceNewPage: addedInChapter === 0 && rawBlocks.length > 0 });
          } else {
            rawBlocks.push({ type: 'p', text: t });
          }
          addedInChapter++;
        });
      }
      if (!rawBlocks.length) rawBlocks.push({ type: 'p', text: `《${fallbackTitle}》已载入。` });
      return { rawBlocks, coverDataUrl };
    }

    async function handleFilesImport(files) {
      for (const file of Array.from(files || [])) {
        const ext = file.name.split('.').pop().toLowerCase();
        const title = file.name.replace(/\.(epub|pdf)$/i, '');
        const buf = await file.arrayBuffer();
        const defaultShelf = state.currentNav.startsWith('shelf:') ? state.currentNav.slice(6) : '';

        if (ext === 'epub') {
          showToast(`正在解析《${title}》...`);
          const { rawBlocks, coverDataUrl } = await parseEpubBuffer(buf, title);
          const newBook = {
            id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
            title, fileName: file.name, format: 'EPUB', shelf: defaultShelf,
            pinned: false, addedAt: Date.now(), coverUrl: coverDataUrl,
            hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
            rawBlocks, fileBytes: buf, isCloudOnly: false
          };
          state.books.unshift(newBook);
          await saveBookDB(newBook);
          renderLibrary();
          if ($('auto-upload-checkbox').checked) uploadBookToGitHub(newBook);
          openBook(newBook);
        } else if (ext === 'pdf') {
          showToast(`正在载入 PDF《${title}》...`);
          const pdfDoc = await window.pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
          const newBook = {
            id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
            title, fileName: file.name, format: 'PDF', shelf: defaultShelf,
            pinned: false, addedAt: Date.now(), coverUrl: '',
            hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
            pdfDoc, numPages: pdfDoc.numPages, fileBytes: buf, isCloudOnly: false
          };
          state.books.unshift(newBook);
          await saveBookDB(newBook);
          renderLibrary();
          if ($('auto-upload-checkbox').checked) uploadBookToGitHub(newBook);
          openBook(newBook);
        }
      }
    }

    // 打开图书（若为仅云端图书，自动通过 Raw 流式接口下载并缓存到本地）
    async function openBook(book) {
      if (book.isCloudOnly && book.cloudPath) {
        const { owner, repo, branch, token } = state.github;
        if (!owner || !repo || !token) {
          $('cloud-hub-modal').classList.remove('hidden');
          return showToast('请先配置 GitHub Token 以流式下载云端图书');
        }
        showToast(`正在从私有仓下载《${book.title}》...`);
        try {
          const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(book.cloudPath)}?ref=${encodeURIComponent(branch || 'main')}`;
          const res = await fetch(url, { headers: ghHeaders({ 'Accept': 'application/vnd.github.raw' }) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const buf = await res.arrayBuffer();
          book.fileBytes = buf;
          if (book.format === 'EPUB') {
            const parsed = await parseEpubBuffer(buf, book.title);
            book.rawBlocks = parsed.rawBlocks;
            if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
          } else {
            book.pdfDoc = await window.pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
            book.numPages = book.pdfDoc.numPages;
          }
          book.isCloudOnly = false;
          await saveBookDB(book);
        } catch (e) {
          console.error(e);
          return showToast('从私有云下载图书失败');
        }
      } else if (book.format === 'PDF' && !book.pdfDoc && book.fileBytes) {
        book.pdfDoc = await window.pdfjsLib.getDocument({ data: book.fileBytes.slice(0) }).promise;
        book.numPages = book.pdfDoc.numPages;
      }

      state.currentBook = book;
      state.currentPageIndex = book.lastPageIndex || 0;
      book.hasBeenRead = true;

      $('library-view').classList.add('hidden');
      $('reader-view').classList.remove('hidden');
      $('header-book-title').textContent = book.title;

      applyReaderStyles();
      requestAnimationFrame(() => {
        repaginate();
        renderReaderPages();
      });
    }

    // ==================== 阅读器排版、分页与图2纯自定义颜色 ====================
    function applyReaderStyles() {
      const c = state.readerConfig;
      const root = document.documentElement;
      // 都不选中颜色时（null），还原展示原书白底与深黑文字
      root.style.setProperty('--reader-bg', c.bgColor || '#ffffff');
      root.style.setProperty('--reader-text', c.textColor || '#1f1f1f');
      root.style.setProperty('--reader-font-size', c.fontSize + 'px');
      root.style.setProperty('--reader-letter-spacing', c.letterSpacing + 'px');
      root.style.setProperty('--reader-para-spacing', c.paraSpacing + 'px');
      root.style.setProperty('--reader-brightness', c.brightness);
      root.style.setProperty('--reader-font-family', state.fontMap[c.fontFamily] || state.fontMap.yeliqun);

      const padX = Math.max(16, (isMobile() ? 22 : 52) + Number(c.margin));
      const padY = Math.max(16, (isMobile() ? 24 : 36) + Number(c.margin) * 0.4);
      $('page-left').style.padding = `${padY}px ${padX}px 8px ${padX}px`;
      $('page-right').style.padding = `${padY}px ${padX}px 8px ${padX}px`;

      $('dual-page-spine').classList.toggle('hidden', c.viewMode !== 'dual');
      $('page-right-wrapper').classList.toggle('hidden', c.viewMode !== 'dual');
      $('page-left').style.overflowY = c.viewMode === 'scroll' ? 'auto' : 'hidden';

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        const on = b.dataset.mode === c.viewMode;
        b.className = `view-mode-btn py-2 rounded-xl border text-sm cursor-pointer transition ${on ? 'bg-[#484848] text-white border-[#484848]' : 'bg-white text-neutral-600 border-neutral-200'}`;
      });
    }

    function blockHtml(item) {
      if (!item) return '';
      if (item.type === 'heading') return `<h2 class="font-semibold mt-3" style="margin-bottom:var(--reader-para-spacing);font-size:calc(var(--reader-font-size)*1.22);">${esc(item.text)}</h2>`;
      if (item.type === 'img') return `<div class="my-3 flex justify-center"><img src="${esc(item.src)}" class="max-h-[45vh] max-w-full object-contain rounded"/></div>`;
      return `<p style="margin-bottom:var(--reader-para-spacing);text-align:justify;">${esc(item.text)}</p>`;
    }

    function repaginate() {
      const book = state.currentBook;
      if (!book || book.format === 'PDF') return;
      const blocks = book.rawBlocks || [];
      const pageLeft = $('page-left');
      const measure = $('page-measure-box');
      const cs = getComputedStyle(pageLeft);
      const availW = Math.max(180, pageLeft.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      const availH = Math.max(160, pageLeft.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6);

      measure.style.width = availW + 'px';
      measure.innerHTML = `<div id="m-col" style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;"></div>`;
      const col = $('m-col');

      const pages = [];
      let cur = [];
      const flush = () => { if (cur.length) { pages.push(cur); cur = []; col.innerHTML = ''; } };

      for (const b of blocks) {
        if (b.forceNewPage && cur.length) flush();
        const wrap = document.createElement('div');
        wrap.innerHTML = blockHtml(b);
        const node = wrap.firstElementChild;
        col.appendChild(node);
        if (col.scrollHeight <= availH) {
          cur.push(b);
        } else {
          col.removeChild(node);
          flush();
          cur.push(b);
          col.innerHTML = blockHtml(b);
        }
      }
      if (cur.length) flush();
      measure.innerHTML = '';
      book.pages = pages.length ? pages : [[{ type: 'p', text: '暂无内容' }]];
    }

    async function renderPdfPage(pdfDoc, num, box) {
      box.innerHTML = '';
      if (num < 1 || num > pdfDoc.numPages) return;
      const page = await pdfDoc.getPage(num);
      const vp0 = page.getViewport({ scale: 1 });
      const scale = Math.min((box.clientWidth - 20) / vp0.width, (box.clientHeight - 20) / vp0.height);
      const vp = page.getViewport({ scale: Math.max(0.4, scale) });
      const canvas = document.createElement('canvas');
      canvas.className = 'mx-auto my-auto shadow-sm rounded max-w-full max-h-full object-contain';
      canvas.width = vp.width; canvas.height = vp.height;
      box.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }

    async function renderReaderPages() {
      const book = state.currentBook;
      if (!book) return;
      const mode = state.readerConfig.viewMode;
      const pL = $('page-left'), pR = $('page-right');

      const total = book.format === 'PDF' ? (book.numPages || 1) : ((book.pages && book.pages.length) || 1);
      state.currentPageIndex = Math.max(0, Math.min(state.currentPageIndex, total - 1));
      book.lastPageIndex = state.currentPageIndex;
      book.progressPercent = Math.min(100, Math.max(0.05, ((state.currentPageIndex + 1) / total) * 100));
      saveBookDB(book);

      if (book.format === 'PDF' && book.pdfDoc) {
        await renderPdfPage(book.pdfDoc, state.currentPageIndex + 1, pL);
        if (mode === 'dual') await renderPdfPage(book.pdfDoc, state.currentPageIndex + 2, pR);
        $('footer-left-page-num').textContent = `第 ${state.currentPageIndex + 1} / ${total} 页`;
        $('footer-right-page-num').textContent = state.currentPageIndex + 2 <= total ? `第 ${state.currentPageIndex + 2} 页` : '';
        return;
      }

      if (mode === 'scroll') {
        pL.innerHTML = `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${(book.rawBlocks || []).map(blockHtml).join('')}</div>`;
        $('footer-left-page-num').textContent = `共 ${total} 页`;
      } else {
        const renderLeaf = idx => `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${((book.pages && book.pages[idx]) || []).map(blockHtml).join('')}</div>`;
        pL.innerHTML = renderLeaf(state.currentPageIndex);
        if (mode === 'dual') pR.innerHTML = renderLeaf(state.currentPageIndex + 1);
        $('footer-left-page-num').textContent = `第 ${state.currentPageIndex + 1} / ${total} 页`;
        $('footer-right-page-num').textContent = state.currentPageIndex + 2 <= total ? `第 ${state.currentPageIndex + 2} 页` : '';
      }
    }

    function turnPage(dir) {
      if (!state.currentBook || state.readerConfig.viewMode === 'scroll') return;
      const step = state.readerConfig.viewMode === 'dual' ? 2 : 1;
      const total = state.currentBook.format === 'PDF' ? state.currentBook.numPages : state.currentBook.pages.length;
      const next = state.currentPageIndex + dir * step;
      if (next < 0) return showToast('已经是第一页');
      if (next >= total) return showToast('已经是最后一页');
      state.currentPageIndex = next;
      renderReaderPages();
    }

    // 渲染图2纯自定义颜色圆圈（带 ⋮ 添加、右上角 × 删除、再次点击取消选中还原原书颜色）
    function renderColorSwatches() {
      const cfg = state.readerConfig;
      const buildGroup = (containerId, listKey, activeKey, pickerId, emptyNotice) => {
        const box = $(containerId);
        box.innerHTML = '';
        // 第一个圆圈：竖排三点 ⋮ 添加自定义颜色
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'w-11 h-11 rounded-full bg-white border border-neutral-200 shadow-sm flex items-center justify-center text-[#554940] hover:bg-neutral-50 cursor-pointer';
        addBtn.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18.5" r="2"/></svg>`;
        addBtn.onclick = () => $(pickerId).click();
        box.appendChild(addBtn);

        cfg[listKey].forEach(color => {
          const selected = cfg[activeKey] && cfg[activeKey].toLowerCase() === color.toLowerCase();
          const wrap = document.createElement('div');
          wrap.className = 'relative flex items-center justify-center';
          wrap.innerHTML = `
            <button type="button" style="background-color:${esc(color)}" class="swatch-btn w-11 h-11 rounded-full border border-neutral-200 flex items-center justify-center transition cursor-pointer ${selected ? 'swatch-selected' : 'hover:scale-105'}">
              ${selected ? `<svg class="w-5 h-5 text-white drop-shadow" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
            </button>
            <button type="button" class="del-swatch absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#9e9a93] hover:bg-neutral-700 text-white flex items-center justify-center text-[10px] leading-none shadow cursor-pointer">✕</button>`;

          wrap.querySelector('.swatch-btn').onclick = () => {
            cfg[activeKey] = selected ? null : color;
            if (selected) showToast(emptyNotice);
            savePrefs(); applyReaderStyles(); renderColorSwatches();
          };
          wrap.querySelector('.del-swatch').onclick = e => {
            e.stopPropagation();
            cfg[listKey] = cfg[listKey].filter(c => c.toLowerCase() !== color.toLowerCase());
            if (selected) cfg[activeKey] = null;
            savePrefs(); applyReaderStyles(); renderColorSwatches();
          };
          box.appendChild(wrap);
        });
      };

      buildGroup('bg-color-swatches', 'customBgColors', 'bgColor', 'native-bg-picker', '已取消选中，展示原书背景颜色');
      buildGroup('text-color-swatches', 'customTextColors', 'textColor', 'native-text-picker', '已取消选中，展示原书文字颜色');
    }

    // ==================== 初始化与事件绑定 ====================
    window.addEventListener('DOMContentLoaded', async () => {
      loadPrefs();
      state.books = await loadAllBooksDB();

      // 构建阅读器滑块项
      const sliderDefs = [
        { key: 'fontSize', label: '字体大小', min: 13, max: 40, step: 1 },
        { key: 'margin', label: '页边距', min: -40, max: 80, step: 1 },
        { key: 'letterSpacing', label: '字间距', min: 0, max: 20, step: 1 },
        { key: 'paraSpacing', label: '段落间距', min: 0, max: 100, step: 1 },
        { key: 'brightness', label: '屏幕亮度', min: 0.4, max: 1, step: 0.05 }
      ];
      const sBox = $('sliders-container');
      sliderDefs.forEach(d => {
        const val = state.readerConfig[d.key];
        const div = document.createElement('div');
        div.className = 'space-y-2';
        div.innerHTML = `
          <div class="flex items-center justify-between text-[15px]">
            <span>${d.label}</span>
            <span id="lbl-${d.key}" class="font-medium">${val}</span>
          </div>
          <input id="rng-${d.key}" type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${val}" class="onereader-slider" />`;
        sBox.appendChild(div);
        div.querySelector('input').oninput = e => {
          state.readerConfig[d.key] = Number(e.target.value);
          $(`lbl-${d.key}`).textContent = e.target.value;
          savePrefs(); applyReaderStyles();
          if (d.key !== 'brightness') { repaginate(); renderReaderPages(); }
        };
      });

      renderShelves();
      renderLibrary();
      renderColorSwatches();
      updateCloudIndicator();

      // 侧边栏折叠
      $('toggle-sidebar-btn').onclick = () => {
        const sb = $('library-sidebar');
        if (isMobile()) {
          const open = sb.classList.contains('mobile-closed');
          sb.classList.toggle('mobile-closed', !open);
          $('mobile-sidebar-backdrop').classList.toggle('hidden', !open);
        } else {
          sb.classList.toggle('hidden');
        }
      };
      $('mobile-sidebar-backdrop').onclick = () => $('toggle-sidebar-btn').click();

      document.querySelector('[data-nav="all"]').onclick = () => {
        state.currentNav = 'all';
        updateNavSelection();
      };

      $('shelf-collapse-btn').onclick = () => {
        $('shelf-items-container').classList.toggle('hidden');
        $('shelf-chevron').classList.toggle('-rotate-90');
      };

      $('library-search-input').oninput = e => {
        state.searchQuery = e.target.value.trim();
        renderLibrary();
      };

      // 新建与管理书架
      $('create-shelf-btn').onclick = () => {
        openPrompt('新建书架', '请输入新书架名称：', '', name => {
          if (!name || state.shelves.includes(name)) return;
          state.shelves.push(name);
          savePrefs(); renderShelves();
          showToast(`已新建书架「${name}」`);
        });
      };
      $('modal-cancel-btn').onclick = () => $('custom-modal').classList.add('hidden');
      $('modal-confirm-btn').onclick = () => {
        const v = $('modal-input').value.trim();
        $('custom-modal').classList.add('hidden');
        if (state.modalConfirmCallback) state.modalConfirmCallback(v);
      };

      $('manage-shelf-btn').onclick = () => {
        renderManageShelvesList();
        $('manage-shelves-modal').classList.remove('hidden');
      };
      $('close-manage-shelves-btn').onclick = () => $('manage-shelves-modal').classList.add('hidden');

      // 右上角云标志与 GitHub 私有仓配置弹窗
      $('open-cloud-modal-btn').onclick = () => {
        $('gh-owner-input').value = state.github.owner || '';
        $('gh-repo-input').value = state.github.repo || '';
        $('gh-branch-input').value = state.github.branch || '';
        $('gh-token-input').value = state.github.token || '';
        $('auto-upload-checkbox').checked = Boolean(state.github.autoUpload);
        $('cloud-hub-modal').classList.remove('hidden');
      };
      $('close-cloud-modal-btn').onclick = () => $('cloud-hub-modal').classList.add('hidden');
      $('toggle-token-vis-btn').onclick = e => {
        const inp = $('gh-token-input');
        const isPwd = inp.type === 'password';
        inp.type = isPwd ? 'text' : 'password';
        e.currentTarget.textContent = isPwd ? '隐藏' : '显示';
      };
      $('auto-upload-checkbox').onchange = e => {
        state.github.autoUpload = e.target.checked;
        savePrefs();
      };
      $('gh-connect-pull-btn').onclick = pullFromGitHubPrivateRepo;
      $('gh-push-meta-btn').onclick = () => pushMetaToGitHub(false);
      $('gh-clear-config-btn').onclick = () => {
        state.github = { owner: '', repo: '', branch: '', token: '', autoUpload: false, metaSha: '' };
        $('gh-owner-input').value = '';
        $('gh-repo-input').value = '';
        $('gh-branch-input').value = '';
        $('gh-token-input').value = '';
        savePrefs();
        updateCloudIndicator();
        showToast('已清除本地保存的 GitHub 密钥与连接信息');
      };

      $('hub-import-local-btn').onclick = () => {
        $('cloud-hub-modal').classList.add('hidden');
        $('file-upload-input').click();
      };
      $('hub-download-html-btn').onclick = () => {
        const src = '\uFEFF<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([src], { type: 'text/html;charset=utf-8' }));
        a.download = 'index.html';
        a.click();
        showToast('已导出 index.html');
      };
      $('file-upload-input').onchange = e => {
        handleFilesImport(e.target.files);
        e.target.value = '';
      };

      // 单本书 ••• 弹窗事件
      const closeBookMenu = () => {
        $('book-action-popover').classList.add('hidden');
        $('book-action-backdrop').classList.add('hidden');
      };
      $('book-action-backdrop').onclick = closeBookMenu;

      const openAssignModal = ids => {
        const box = $('assign-shelf-options');
        box.innerHTML = '';
        state.shelves.forEach(s => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'w-full text-left px-4 py-2.5 rounded-xl hover:bg-neutral-100 text-[15px] cursor-pointer flex justify-between';
          b.innerHTML = `<span>${esc(s)}</span><span class="text-xs text-neutral-400">选择</span>`;
          b.onclick = () => {
            state.books.forEach(bk => { if (ids.includes(bk.id)) { bk.shelf = s; saveBookDB(bk); } });
            $('assign-shelf-modal').classList.add('hidden');
            state.multiSelectMode = false; state.selectedBookIds.clear();
            renderLibrary();
            pushMetaToGitHub(true);
            showToast(`已添加到「${s}」`);
          };
          box.appendChild(b);
        });
        $('assign-shelf-modal').classList.remove('hidden');
      };
      $('close-assign-shelf-btn').onclick = () => $('assign-shelf-modal').classList.add('hidden');

      $('book-act-shelf').onclick = () => { closeBookMenu(); if (state.activeMenuBookId) openAssignModal([state.activeMenuBookId]); };
      $('book-act-multiselect').onclick = () => {
        closeBookMenu();
        state.multiSelectMode = true;
        state.selectedBookIds.clear();
        if (state.activeMenuBookId) state.selectedBookIds.add(state.activeMenuBookId);
        renderLibrary();
      };
      $('book-act-pin').onclick = () => {
        closeBookMenu();
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (bk) { bk.pinned = !bk.pinned; saveBookDB(bk); renderLibrary(); pushMetaToGitHub(true); }
      };
      $('book-act-upload-cloud').onclick = () => {
        closeBookMenu();
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (bk) uploadBookToGitHub(bk);
      };
      $('book-act-delete').onclick = async () => {
        closeBookMenu();
        const idx = state.books.findIndex(b => b.id === state.activeMenuBookId);
        if (idx !== -1) {
          const removed = state.books.splice(idx, 1)[0];
          await deleteBookDB(removed.id);
          renderLibrary();
          showToast(`已删除《${removed.title}》`);
        }
      };

      // 多选批量栏
      $('batch-add-shelf-btn').onclick = () => openAssignModal(Array.from(state.selectedBookIds));
      $('batch-pin-btn').onclick = () => {
        state.books.forEach(b => { if (state.selectedBookIds.has(b.id)) { b.pinned = true; saveBookDB(b); } });
        state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary();
      };
      $('batch-delete-btn').onclick = async () => {
        for (const id of state.selectedBookIds) {
          const i = state.books.findIndex(b => b.id === id);
          if (i !== -1) { state.books.splice(i, 1); await deleteBookDB(id); }
        }
        state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary();
      };
      $('batch-exit-btn').onclick = () => { state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary(); };

      // 阅读器控制与返回主页（返回时自动后台同步进度）
      $('reader-home-trigger').onclick = () => {
        $('reader-view').classList.add('hidden');
        $('library-view').classList.remove('hidden');
        renderLibrary();
        pushMetaToGitHub(true);
      };
      $('reader-settings-trigger').onclick = () => {
        $('reader-settings-drawer').classList.remove('translate-x-full');
        $('settings-backdrop').classList.remove('hidden');
      };
      const closeDrawer = () => {
        $('reader-settings-drawer').classList.add('translate-x-full');
        $('settings-backdrop').classList.add('hidden');
      };
      $('close-settings-drawer-btn').onclick = closeDrawer;
      $('settings-backdrop').onclick = closeDrawer;

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        b.onclick = () => {
          state.readerConfig.viewMode = b.dataset.mode;
          savePrefs(); applyReaderStyles(); repaginate(); renderReaderPages();
        };
      });

      // 纯自定义背景色与文字色添加/清除
      $('native-bg-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customBgColors.includes(hex)) state.readerConfig.customBgColors.push(hex);
        state.readerConfig.bgColor = hex;
        savePrefs(); applyReaderStyles(); renderColorSwatches();
      };
      $('native-text-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customTextColors.includes(hex)) state.readerConfig.customTextColors.push(hex);
        state.readerConfig.textColor = hex;
        savePrefs(); applyReaderStyles(); renderColorSwatches();
      };
      $('clear-bg-custom-btn').onclick = () => {
        state.readerConfig.customBgColors = [];
        state.readerConfig.bgColor = null;
        savePrefs(); applyReaderStyles(); renderColorSwatches();
        showToast('已清除背景色，还原原书背景');
      };
      $('clear-text-custom-btn').onclick = () => {
        state.readerConfig.customTextColors = [];
        state.readerConfig.textColor = null;
        savePrefs(); applyReaderStyles(); renderColorSwatches();
        showToast('已清除文字色，还原原书文字颜色');
      };

      // 字体切换与本地字体导入
      $('select-font-family').onchange = e => {
        state.readerConfig.fontFamily = e.target.value;
        savePrefs(); applyReaderStyles(); repaginate(); renderReaderPages();
      };
      $('import-local-font-btn').onclick = () => $('font-upload-input').click();
      $('font-upload-input').onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        const name = f.name.replace(/\.(ttf|otf|woff2?)$/i, '');
        const face = new FontFace(name, await f.arrayBuffer());
        await face.load();
        document.fonts.add(face);
        const key = 'custom_' + Date.now();
        state.fontMap[key] = `'${name}', sans-serif`;
        const opt = new Option(name, key, true, true);
        $('select-font-family').add(opt);
        state.readerConfig.fontFamily = key;
        applyReaderStyles(); repaginate(); renderReaderPages();
        showToast(`已载入字体：${name}`);
      };

      // 翻页交互：左右按钮、点击屏幕边缘、手势滑动、键盘方向键
      $('prev-page-btn').onclick = () => turnPage(-1);
      $('next-page-btn').onclick = () => turnPage(1);
      $('reader-content-viewport').onclick = e => {
        if (window.getSelection().toString()) return;
        const x = e.clientX, w = window.innerWidth;
        if (x < w * 0.25) turnPage(-1);
        else if (x > w * 0.75) turnPage(1);
        else $('reader-view').classList.toggle('mobile-controls-active');
      };
      let tx = 0;
      $('reader-content-viewport').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
      $('reader-content-viewport').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 45) turnPage(dx < 0 ? 1 : -1);
      }, { passive: true });
      window.addEventListener('keydown', e => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') turnPage(-1);
        if (e.key === 'ArrowRight' || e.key === 'PageDown') turnPage(1);
      });
    });
  </script>
</body>
</html>
