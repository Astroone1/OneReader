    // ==================== EPUB / PDF 解析 ====================
    function blobToDataUrl(blob) {
      return new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result || '');
        fr.onerror = () => res('');
        fr.readAsDataURL(blob);
      });
    }

    function mimeFromPath(p) {
      const ext = (p.split('.').pop() || '').toLowerCase();
      return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', svg: 'image/svg+xml', bmp: 'image/bmp' })[ext] || 'image/jpeg';
    }

    function normalizeResPath(p) {
      let s = String(p || '').trim();
      if (!s) return '';
      s = s.split('#')[0].split('?')[0];
      try { s = decodeURIComponent(s); } catch (e) {}
      s = s.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
      return s.toLowerCase();
    }

    function resolveRelativePath(baseFile, href) {
      let s = String(href || '').trim().split('#')[0].split('?')[0];
      if (!s) return '';
      try { s = decodeURIComponent(s); } catch (e) {}
      if (/^(https?:|data:|blob:)/i.test(s)) return '';
      const baseParts = (baseFile || '').replace(/\\/g, '/').split('/').slice(0, -1);
      const out = (s.startsWith('/') ? [] : baseParts.slice());
      s.replace(/^\/+/, '').split('/').forEach(seg => {
        if (!seg || seg === '.') return;
        if (seg === '..') out.pop();
        else out.push(seg);
      });
      return out.join('/');
    }

    async function parseEpubBuffer(arrayBuffer, fallbackTitle) {
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      const parser = new DOMParser();
      const imgMap = {};
      const imgPathList = [];
      let coverDataUrl = '';

      for (const [p, entry] of Object.entries(zip.files)) {
        if (entry.dir || !/\.(jpe?g|png|webp|gif|svg|bmp)$/i.test(p)) continue;
        const raw = await entry.async('blob');
        const blob = new Blob([raw], { type: mimeFromPath(p) });
        const dataUrl = await blobToDataUrl(blob);
        if (!dataUrl) continue;
        imgMap[normalizeResPath(p)] = dataUrl;
        imgMap[(p.split('/').pop() || '').toLowerCase()] = dataUrl;
        imgPathList.push(p);
        if (!coverDataUrl && /cover/i.test(p)) coverDataUrl = dataUrl;
      }

      const dimCache = new Map();
      const getImageSize = src => {
        if (!src) return Promise.resolve(null);
        if (dimCache.has(src)) return dimCache.get(src);
        const pr = new Promise(res => {
          const im = new Image();
          im.onload = () => res({ w: im.naturalWidth || 0, h: im.naturalHeight || 0 });
          im.onerror = () => res(null);
          im.src = src;
        });
        dimCache.set(src, pr);
        return pr;
      };

      const lookupImage = (baseFile, href) => {
        const resolved = resolveRelativePath(baseFile, href);
        const nResolved = normalizeResPath(resolved);
        if (nResolved && imgMap[nResolved]) return imgMap[nResolved];

        const nRaw = normalizeResPath(href);
        if (nRaw && imgMap[nRaw]) return imgMap[nRaw];

        const fileName = normalizeResPath((String(href || '').split('/').pop() || ''));
        if (fileName && imgMap[fileName]) return imgMap[fileName];

        if (fileName) {
          const hit = imgPathList.find(p => normalizeResPath(p.split('/').pop()) === fileName);
          if (hit) return imgMap[normalizeResPath(hit)];
        }
        return '';
      };

      const findOpfPath = async () => {
        const containerEntry = zip.file('META-INF/container.xml');
        if (containerEntry) {
          try {
            const xml = await containerEntry.async('string');
            const m = xml.match(/full-path\s*=\s*["']([^"']+\.opf)["']/i);
            if (m) return m[1];
          } catch (e) {}
        }
        return Object.keys(zip.files).find(n => /\.opf$/i.test(n)) || '';
      };

      const parseSpine = async opfPath => {
        if (!opfPath || !zip.file(opfPath)) return null;
        let xml = '';
        try { xml = await zip.file(opfPath).async('string'); } catch (e) { return null; }
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const baseDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
        const idToPath = {};
        doc.querySelectorAll('manifest > item').forEach(it => {
          const id = it.getAttribute('id');
          const href = it.getAttribute('href');
          if (!id || !href) return;
          idToPath[id] = resolveRelativePath(opfPath, href) || (baseDir + href);
        });
        const spinePaths = [];
        doc.querySelectorAll('spine > itemref').forEach(ir => {
          const idref = ir.getAttribute('idref');
          const p = idref && idToPath[idref];
          if (p && /\.(xhtml|html|htm)$/i.test(p)) spinePaths.push(p);
        });
        if (!spinePaths.length) return null;

        const navTitles = [];
        for (const pid of Object.keys(idToPath)) {
          const p = idToPath[pid];
          if (!/\.(ncx)$/i.test(p) && !/nav\.x?html?$/i.test(p)) continue;
          try {
            const nx = await zip.file(p).async('string');
            const nd = new DOMParser().parseFromString(nx, 'text/html');
            nd.querySelectorAll('a, navPoint > navLabel > text, navLabel text').forEach(a => {
              const tt = (a.textContent || '').replace(/\s+/g, ' ').trim();
              if (tt && tt.length <= 120) navTitles.push(tt);
            });
          } catch (e) {}
        }
        return { spinePaths, navTitles };
      };

      const opfPath = await findOpfPath();
      const spineInfo = await parseSpine(opfPath);
      const allHtml = Object.keys(zip.files)
        .filter(n => !zip.files[n].dir && /\.(xhtml|html|htm)$/i.test(n));

      let htmlFiles;
      if (spineInfo) {
        const ordered = [];
        const used = new Set();
        for (const p of spineInfo.spinePaths) {
          const hit = allHtml.find(n => normalizeResPath(n) === normalizeResPath(p));
          if (hit && !used.has(hit)) { ordered.push(hit); used.add(hit); }
        }
        const rest = allHtml
          .filter(n => !used.has(n))
          .filter(n => !/nav\.x?html?$/i.test(n) && !/\.ncx$/i.test(n) && !/cover\.x?html?$/i.test(n))
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        htmlFiles = ordered.concat(rest);
      } else {
        htmlFiles = allHtml.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      }
      const spineFileSet = new Set((spineInfo ? spineInfo.spinePaths : [])
        .map(p => {
          const hit = allHtml.find(n => normalizeResPath(n) === normalizeResPath(p));
          return hit ? normalizeResPath(hit) : '';
        }).filter(Boolean));

      const navTitleSet = new Set((spineInfo && spineInfo.navTitles || []).map(t => String(t).replace(/\s+/g, ' ').trim()));

      const rawBlocks = [];
      const cleanText = s => {
        let t = String(s || '');
        if (!t) return '';
        t = t.replace(/data:[a-z]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]{16,}/gi, ' ');
        t = t.replace(/(?:[A-Za-z0-9+/]{4,}={0,2}\s+){3,}[A-Za-z0-9+/]{4,}={0,2}/g, m => {
          const compact = m.replace(/\s+/g, '');
          const hasSym = /[+/=]/.test(compact);
          const cjk = (compact.match(/[\u4e00-\u9fff]/g) || []).length;
          if (cjk === 0 && compact.length >= 32 && hasSym) return ' ';
          return m;
        });
        t = t.replace(/[A-Za-z0-9+/]{32,}={0,2}/g, m => {
          if (/[+/=]/.test(m)) return ' ';
          if (m.length >= 60 && !/[aeiou]{2,}/i.test(m)) return ' ';
          return m;
        });
        t = t.replace(/\b[0-9a-f]{40,}\b/gi, ' ');
        return t.replace(/\s+/g, ' ').trim();
      };

      const isUsableText = s => {
        const t = cleanText(s);
        if (!t) return false;
        if (t.length < 2) return false;
        return true;
      };

      let firstSpineFile = true;
      for (const f of htmlFiles) {
        const u8 = await zip.file(f).async('uint8array');
        const txt = new TextDecoder('utf-8').decode(u8);
        const doc = parser.parseFromString(txt, 'text/html');
        doc.querySelectorAll('script, style, svg style').forEach(el => el.remove());
        doc.querySelectorAll('[style]').forEach(el => {
          const st = el.getAttribute('style') || '';
          if (/base64,/i.test(st) || st.length > 600) el.removeAttribute('style');
        });
        const els = doc.body ? doc.body.querySelectorAll('h1,h2,h3,h4,p,div,blockquote,img,li,figure,svg,image') : [];
        let addedInChapter = 0;

        const isSpineFile = spineFileSet.has(normalizeResPath(f));
        let chapterStartMarked = false;
        const markChapterStart = () => {
          if (chapterStartMarked) return false;
          chapterStartMarked = true;
          if (!isSpineFile) return false;
          if (rawBlocks.length === 0 && firstSpineFile) return false;
          return true;
        };

        const pushImg = (src, alt, w, h) => {
          if (!src) return;
          const last = rawBlocks[rawBlocks.length - 1];
          if (last && last.type === 'img' && last.src === src) return;
          const newPage = markChapterStart();
          rawBlocks.push({ type: 'img', src, alt: alt || '', w: Number(w) || 0, h: Number(h) || 0, forceNewPage: newPage });
          addedInChapter++;
        };

        els.forEach(el => {
          const tag = el.tagName.toLowerCase();
          if (tag === 'img') {
            const href = el.getAttribute('src') || el.getAttribute('data-src') || '';
            pushImg(lookupImage(f, href), el.getAttribute('alt'),
              el.getAttribute('width'), el.getAttribute('height'));
            return;
          }
          if (tag === 'image') {
            pushImg(lookupImage(f, el.getAttribute('xlink:href') || el.getAttribute('href') || ''), el.getAttribute('alt'),
              el.getAttribute('width'), el.getAttribute('height'));
            return;
          }
          if (tag === 'svg') return;
          if (tag === 'div' && el.children.length > 0) return;
          if (tag === 'figure') return;
          const rawT = (el.textContent || '').replace(/\s+/g, ' ').trim();
          if (!rawT) return;
          const t = cleanText(rawT);
          if (!isUsableText(rawT)) return;

          const isHeadingTag = /^h[1-4]$/.test(tag);
          const isNavTitle = navTitleSet.has(String(t).replace(/\s+/g, ' ').trim());
          if (isHeadingTag) {
            const newPage = markChapterStart();
            rawBlocks.push({ type: 'heading', text: t, forceNewPage: newPage });
          } else {
            const newPage = markChapterStart() || (isNavTitle && addedInChapter === 0);
            rawBlocks.push({ type: isNavTitle ? 'heading' : 'p', text: t, forceNewPage: newPage });
          }
          addedInChapter++;
        });
        firstSpineFile = false;
      }

      for (const b of rawBlocks) {
        if (b.type !== 'img') continue;
        const usable = typeof b.src === 'string' && b.src.startsWith('data:image/');
        if (!usable) { b.dead = true; continue; }
        if (b.w > 0 && b.h > 0) continue;
        const dim = await getImageSize(b.src);
        if (dim && dim.w > 0 && dim.h > 0) { b.w = dim.w; b.h = dim.h; }
        else b.dead = true;
      }

      if (!rawBlocks.length) rawBlocks.push({ type: 'p', text: `《${fallbackTitle}》已载入。` });
      return { rawBlocks, coverDataUrl, parseVer: PARSE_VERSION };
    }

    async function handleFilesImport(files, uploadToCloud = false) {
      for (const file of Array.from(files || [])) {
        const ext = file.name.split('.').pop().toLowerCase();
        const title = file.name.replace(/\.(epub|pdf)$/i, '');
        const buf = await file.arrayBuffer();
        const defaultShelf = state.currentNav.startsWith('shelf:') ? state.currentNav.slice(6) : '';
        let created = null;

        if (ext === 'epub') {
          showToast(`正在解析《${title}》...`);
          const parsed = await parseEpubBuffer(buf, title);
          const { rawBlocks, coverDataUrl } = parsed;
          const newBook = {
            id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
            title, fileName: file.name, format: 'EPUB', shelf: defaultShelf,
            pinned: false, addedAt: Date.now(), coverUrl: coverDataUrl,
            hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
            rawBlocks, fileBytes: buf, isCloudOnly: false, parseVer: parsed.parseVer
          };
          state.books.unshift(newBook);
          await saveBookDB(newBook);
          renderLibrary();
          created = newBook;
        } else if (ext === 'pdf') {
          showToast(`正在载入 PDF《${title}》...`);
          const pdfDoc = await window.pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
          const newBook = {
            id: 'book-' + Date.now() + Math.random().toString(36).slice(2, 6),
            title, fileName: file.name, format: 'PDF', shelf: defaultShelf,
            pinned: false, addedAt: Date.now(), coverUrl: '',
            hasBeenRead: false, progressPercent: 0, lastPageIndex: 0,
            pdfDoc, numPages: pdfDoc.numPages, fileBytes: buf, isCloudOnly: false
          };
          state.books.unshift(newBook);
          await saveBookDB(newBook);
          renderLibrary();
          created = newBook;
        }

        if (created && uploadToCloud) {
          if (!isCloudConnected()) {
            showToast('未连接私有仓，已仅导入本地');
          } else {
            try {
              showToast(`正在上传《${created.title}》到私有仓...`);
              await uploadBookToCloud(created);
              await saveBookDB(created);
              showToast(`已导入并上传《${created.title}》`);
            } catch (e) {
              showToast(`上传失败：${e.message || '请检查仓库权限'}`);
            }
          }
        }

        if (created) openBook(created);
      }
    }

    function hasStaleImageBlock(book) {
      if (!book || book.format !== 'EPUB') return false;
      const blocks = book.rawBlocks || [];
      return blocks.some(b => {
        if (!b || b.type !== 'img') return false;
        const src = String(b.src || '');
        return src === '' || src.startsWith('blob:');
      });
    }

    async function healStaleImages(book) {
      if (!hasStaleImageBlock(book)) return false;
      if (book.fileBytes) {
        try {
          const parsed = await parseEpubBuffer(book.fileBytes.slice(0), book.title);
          const hasImg = parsed.rawBlocks.some(b => b.type === 'img');
          if (hasImg) {
            book.rawBlocks = parsed.rawBlocks;
            book.pages = undefined;
            if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
            await saveBookDB(book);
            return true;
          }
        } catch (e) {}
      }
      let marked = 0;
      (book.rawBlocks || []).forEach(b => {
        if (b && b.type === 'img' && !b.dead) {
          const src = String(b.src || '');
          if (src === '' || src.startsWith('blob:')) { b.dead = true; marked++; }
        }
      });
      if (marked) {
        book.pages = undefined;
        return false;
      }
      return false;
    }

    // ==================== 目录 / 书签 ====================
    function buildToc(book) {
      const toc = [];
      (book.rawBlocks || []).forEach((b, bi) => {
        if (b.type === 'heading' && b.text) toc.push({ text: b.text, blockIndex: bi });
      });
      return toc;
    }

    function findPageOfBlock(book, blockIndex) {
      const pages = book.pages || [];
      const block = (book.rawBlocks || [])[blockIndex];
      if (!block) return 0;
      for (let i = 0; i < pages.length; i++) {
        const hit = pages[i].find(x => x === block || (x.type === block.type && x.text === block.text));
        if (hit) return i;
      }
      return 0;
    }

    function renderTocList() {
      const book = state.currentBook;
      const box = $('toc-list');
      if (!box) return;
      box.innerHTML = '';
      if (!book) return;

      if (state.tocTab === 'bm') {
        const marks = book.bookmarks || [];
        if (!marks.length) {
          box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">还没有书签，点右上角 ＋ 把当前页加入书签</p>';
          return;
        }
        marks.forEach((m, i) => {
          const row = document.createElement('div');
          row.className = 'group flex items-start gap-2 px-5 py-4 border-b border-neutral-100 hover:bg-neutral-50 cursor-pointer';
          row.innerHTML = `
            <div class="flex-1 min-w-0">
              <div class="leading-relaxed text-[#3a3a3a]">${esc(m.label || '书签')}</div>
              <div class="flex items-center justify-between mt-2 opacity-70" style="font-size: 0.85em;">
                <span class="text-neutral-500">第 ${m.page + 1} 页</span>
                <span class="text-neutral-400">${m.progress || ''}</span>
              </div>
            </div>
            <button type="button" class="del-bm opacity-0 group-hover:opacity-100 text-neutral-400 hover:text-red-500 px-1 leading-none cursor-pointer" style="font-size: 0.85em;">✕</button>`;
          row.onclick = e => {
            if (e.target.classList.contains('del-bm')) return;
            state.currentPageIndex = m.page;
            renderReaderPages();
            closeTocDrawer();
          };
          row.querySelector('.del-bm').onclick = async ev2 => {
            ev2.stopPropagation();
            book.bookmarks.splice(i, 1);
            await saveBookDB(book);
            renderTocList();
          };
          box.appendChild(row);
        });
        return;
      }

      const toc = buildToc(book);
      if (!toc.length) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">这本书没有识别到章节</p>';
        return;
      }
      toc.forEach(item => {
        const page = findPageOfBlock(book, item.blockIndex);
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'w-full text-left px-5 py-4 border-b border-neutral-100 hover:bg-neutral-50 cursor-pointer flex items-baseline gap-3';
        row.innerHTML = `
          <span class="flex-1 min-w-0 leading-relaxed text-[#3a3a3a]">${esc(item.text)}</span>
          <span class="text-neutral-400 shrink-0 opacity-80 tabular-nums" style="font-size: 0.82em;">${page + 1}</span>`;
        row.onclick = () => {
          state.currentPageIndex = page;
          renderReaderPages();
          closeTocDrawer();
        };
        box.appendChild(row);
      });
    }

    function updateTocTabs() {
      const on = 'py-1 cursor-pointer text-[#2b2b2b] font-semibold';
      const off = 'py-1 cursor-pointer text-[#b8b8b8] hover:text-[#6b6b6b]';
      const a = $('toc-tab-toc'), b = $('toc-tab-bm');
      if (a) a.className = state.tocTab === 'toc' ? on : off;
      if (b) b.className = state.tocTab === 'bm' ? on : off;
    }

    // ==================== 全书搜索 ====================
    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightKeyword(text, keyword) {
      if (!keyword) return esc(text);
      const re = new RegExp(escapeRegExp(keyword), 'gi');
      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        out += esc(text.slice(last, m.index));
        out += `<strong class="text-[#e03131] font-semibold">${esc(m[0])}</strong>`;
        last = m.index + m[0].length;
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      out += esc(text.slice(last));
      return out;
    }

    function snippetAround(text, keyword, radius = 40) {
      const flat = String(text || '');
      const at = flat.toLowerCase().indexOf(String(keyword).toLowerCase());
      if (at < 0) return flat.slice(0, radius * 2);
      const start = Math.max(0, at - radius);
      const end = Math.min(flat.length, at + keyword.length + radius);
      return (start > 0 ? '…' : '') + flat.slice(start, end) + (end < flat.length ? '…' : '');
    }

    function runTocSearch() {
      const input = $('toc-search-input');
      const box = $('toc-search-results');
      if (!input || !box) return;
      const kw = input.value.trim();
      $('toc-search-clear').classList.toggle('hidden', !kw);
      box.innerHTML = '';

      const book = state.currentBook;
      if (!book) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">没有打开的书</p>';
        return;
      }
      if (!kw) {
        box.innerHTML = '<p class="text-sm text-neutral-400 mt-6 text-center">输入关键词搜索全书</p>';
        return;
      }

      const blocks = book.rawBlocks || [];
      const pages = book.pages || [];
      const lowerKw = kw.toLowerCase();

      const pageOfBlock = new Map();
      pages.forEach((pg, pi) => {
        pg.forEach(b => { if (!pageOfBlock.has(b)) pageOfBlock.set(b, pi); });
      });

      const groups = [];
      let curGroup = null;
      blocks.forEach((b, bi) => {
        if (b.type === 'img' || b.dead) return;
        const text = b.text || '';
        if (!text) return;
        if (b.type === 'heading') {
          curGroup = { title: text, items: [] };
          groups.push(curGroup);
          return;
        }
        if (!curGroup) {
          curGroup = { title: '正文开头', items: [] };
          groups.push(curGroup);
        }
        if (text.toLowerCase().includes(lowerKw)) {
          let pi = pageOfBlock.has(b) ? pageOfBlock.get(b) : -1;
          if (pi < 0) pi = Math.min((pages.length || 1) - 1, Math.floor(bi / 3));
          curGroup.items.push({ block: b, page: pi, snippet: snippetAround(text, kw) });
        }
      });

      const hitGroups = groups.filter(g => g.items.length);
      const total = hitGroups.reduce((n, g) => n + g.items.length, 0);

      if (!total) {
        box.innerHTML = `<p class="text-sm text-neutral-400 mt-6 text-center">没有找到「${esc(kw)}」</p>`;
        return;
      }

      hitGroups.forEach(g => {
        const sec = document.createElement('div');
        sec.className = 'mb-5';
        sec.innerHTML = `
          <div class="flex items-center justify-between py-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <svg class="w-3.5 h-3.5 shrink-0 text-neutral-500" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
              <span class="text-[15px] font-semibold text-[#2b2b2b] truncate">${esc(g.title)}</span>
            </div>
            <span class="text-[13px] text-neutral-400 shrink-0">(${g.items.length})</span>
          </div>`;
        g.items.forEach(it => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'w-full text-left block px-1 py-3 border-t border-neutral-100 hover:bg-neutral-50 cursor-pointer';
          row.innerHTML = `<p class="text-[14px] leading-relaxed text-[#4a4a4a]">${highlightKeyword(it.snippet, kw)}</p>`;
          row.onclick = () => {
            state.currentPageIndex = Math.max(0, it.page);
            renderReaderPages();
            closeTocDrawer();
          };
          sec.appendChild(row);
        });
        box.appendChild(sec);
      });
    }

    function openTocSearch() {
      $('toc-search-panel').classList.remove('hidden');
      $('toc-list').classList.add('hidden');
      runTocSearch();
      setTimeout(() => $('toc-search-input').focus(), 80);
    }

    function closeTocSearch() {
      $('toc-search-panel').classList.add('hidden');
      $('toc-list').classList.remove('hidden');
      $('toc-search-input').value = '';
      $('toc-search-clear').classList.add('hidden');
      $('toc-search-results').innerHTML = '';
    }

    function openTocDrawer() {
      state.tocTab = state.tocTab || 'toc';
      updateTocTabs();
      renderTocList();
      closeTocSearch();
      $('reader-toc-drawer').classList.remove('-translate-x-full');
      $('toc-backdrop').classList.remove('hidden');
    }
    function closeTocDrawer() {
      $('reader-toc-drawer').classList.add('-translate-x-full');
      $('toc-backdrop').classList.add('hidden');
    }

    async function openBook(book) {
      if (book.format === 'EPUB' && book.fileBytes && (book.parseVer || 0) < PARSE_VERSION) {
        try {
          const parsed = await parseEpubBuffer(book.fileBytes.slice(0), book.title);
          book.rawBlocks = parsed.rawBlocks;
          book.parseVer = parsed.parseVer;
          book.pages = undefined;
          if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
          await saveBookDB(book);
          showToast('已按新版规则重新解析本书');
        } catch (e) {}
      }

      const healed = await healStaleImages(book);
      if (healed) showToast('已修复本书图片显示');

      if (book.isCloudOnly && book.cloudPath) {
        const { owner, repo, branch, token } = state.github;
        if (!owner || !repo || !token) {
          $('cloud-hub-modal').classList.remove('hidden');
          return showToast('请配置 GitHub Token 以拉取书籍内容');
        }
        showToast(`正在下载《${book.title}》...`);
        try {
          const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(book.cloudPath)}?ref=${encodeURIComponent(branch || 'main')}&_t=${Date.now()}`;
          const res = await fetch(url, { headers: ghHeaders({ 'Accept': 'application/vnd.github.raw' }), cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const buf = await res.arrayBuffer();
          book.fileBytes = buf;
          if (book.format === 'EPUB') {
            const parsed = await parseEpubBuffer(buf, book.title);
            book.rawBlocks = parsed.rawBlocks;
            book.parseVer = parsed.parseVer;
            if (parsed.coverDataUrl) book.coverUrl = parsed.coverDataUrl;
          } else {
            book.pdfDoc = await window.pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
            book.numPages = book.pdfDoc.numPages;
          }
          book.isCloudOnly = false;
          await saveBookDB(book);
        } catch (e) {
          return showToast('云端图书下载失败');
        }
      } else if (book.format === 'PDF' && !book.pdfDoc && book.fileBytes) {
        book.pdfDoc = await window.pdfjsLib.getDocument({ data: book.fileBytes.slice(0) }).promise;
        book.numPages = book.pdfDoc.numPages;
      }

      state.currentBook = book;
      state.currentPageIndex = book.lastPageIndex || 0;
      book.hasBeenRead = true;

      $('library-view').classList.add('hidden');
      $('reader-view').classList.remove('hidden');

      applyThemeColors();
      applyLayoutStyles();
      requestAnimationFrame(() => {
        repaginate();
        renderReaderPages();
      });
    }

    // ==================== 性能核心：颜色0ms修改 vs 几何排版防抖 ====================
    function applyThemeColors() {
      const c = state.readerConfig;
      const root = document.documentElement;
      root.style.setProperty('--reader-bg', c.bgColor || '#ffffff');
      root.style.setProperty('--reader-text', c.textColor || '#1f1f1f');
      root.style.setProperty('--reader-brightness', c.brightness);
    }

    function applyLayoutStyles() {
      const c = state.readerConfig;
      const root = document.documentElement;
      root.style.setProperty('--reader-font-size', c.fontSize + 'px');
      root.style.setProperty('--reader-letter-spacing', c.letterSpacing + 'px');
      root.style.setProperty('--reader-para-spacing', c.paraSpacing + 'px');
      root.style.setProperty('--reader-font-family', state.fontMap[c.fontFamily] || state.fontMap.system);

      const padX = Math.max(16, (isMobile() ? 20 : 48) + Number(c.margin));
      const padY = Math.max(16, (isMobile() ? 22 : 36) + Number(c.margin) * 0.4);
      $('page-left').style.padding = `${padY}px ${padX}px ${padY}px ${padX}px`;
      $('page-right').style.padding = `${padY}px ${padX}px ${padY}px ${padX}px`;

      $('dual-page-spine').classList.toggle('hidden', c.viewMode !== 'dual');
      $('page-right-wrapper').classList.toggle('hidden', c.viewMode !== 'dual');

      const isScroll = c.viewMode === 'scroll';
      const leftLeaf = $('page-left');
      const leftWrap = $('page-left-wrapper');
      if (isScroll) {
        leftWrap.style.overflowY = 'auto';
        leftWrap.style.overflowX = 'hidden';
        leftWrap.style.webkitOverflowScrolling = 'touch';
        leftLeaf.style.position = 'static';
        leftLeaf.style.inset = 'auto';
        leftLeaf.style.height = 'auto';
        leftLeaf.style.overflow = 'visible';
      } else {
        leftWrap.style.overflowY = 'hidden';
        leftWrap.style.overflowX = 'hidden';
        leftLeaf.style.position = 'absolute';
        leftLeaf.style.inset = '0';
        leftLeaf.style.height = '';
        leftLeaf.style.overflow = 'hidden';
        leftWrap.scrollTop = 0;
      }

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        const on = b.dataset.mode === c.viewMode;
        b.className = `view-mode-btn py-2 rounded-xl border text-sm cursor-pointer transition ${on ? 'bg-[#484848] text-white border-[#484848]' : 'bg-white text-neutral-600 border-neutral-200'}`;
      });
    }

    function imgBlockHtml(item) {
      const alt = esc(item.alt || '');
      const w = Number(item.w) || 0;
      const h = Number(item.h) || 0;
      const ratio = (w > 0 && h > 0) ? `aspect-ratio:${w}/${h};` : '';
      const sizeStyle = (w > 0 && h > 0)
        ? `width:100%;max-width:min(100%, ${Math.round(w)}px);${ratio}`
        : 'width:100%;';
      return `<div class="fig-wrap my-3 flex justify-center"><img src="${esc(item.src)}" alt="${alt}" style="${sizeStyle}height:auto;max-height:45vh;object-fit:contain;border-radius:6px;" class="object-contain" loading="eager" decoding="sync" /></div>`;
    }

    function blockHtml(item) {
      if (!item) return '';
      if (item.type === 'heading') return `<h2 class="font-semibold mt-3" style="margin-bottom:var(--reader-para-spacing);font-size:calc(var(--reader-font-size)*1.22);">${esc(item.text)}</h2>`;
      if (item.type === 'img') return item.dead ? '' : imgBlockHtml(item);
      return `<p style="margin-bottom:var(--reader-para-spacing);text-align:justify;">${esc(item.text)}</p>`;
    }

    let imgFailHandlerBound = false;
    function bindImageFallback() {
      if (imgFailHandlerBound) return;
      imgFailHandlerBound = true;
      document.addEventListener('error', e => {
        const t = e.target;
        if (!t || t.tagName !== 'IMG') return;
        const wrap = t.closest('.fig-wrap');
        if (wrap) wrap.remove();
        else t.remove();
      }, true);
    }

    let repaginateTimer = null;
    function repaginateDebounced() {
      clearTimeout(repaginateTimer);
      repaginateTimer = setTimeout(() => {
        repaginate();
        renderReaderPages();
      }, 280);
    }

    function repaginate() {
      const book = state.currentBook;
      if (!book || book.format === 'PDF') return;
      const blocks = book.rawBlocks || [];
      const pageLeft = $('page-left');
      const measure = $('page-measure-box');
      const cs = getComputedStyle(pageLeft);
      const availW = Math.max(160, pageLeft.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      const availH = Math.max(140, pageLeft.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6);

      measure.style.width = availW + 'px';
      measure.innerHTML = `<div id="m-col" style="width:100%;font-family:var(--reader-font-family);font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;"></div>`;
      const col = $('m-col');

      const pages = [];
      let cur = [];
      const flush = () => {
        if (!cur.length) return;
        pages.push(cur);
        cur = [];
        col.innerHTML = '';
      };

      const splitParagraph = (text, remainH) => {
        if (remainH <= 0) return ['', text];
        const probe = document.createElement('p');
        probe.style.cssText = 'margin:0;padding-bottom:var(--reader-para-spacing);text-align:justify;';
        col.appendChild(probe);
        const limit = remainH - 2;
        let lo = 0, hi = text.length, best = 0;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          probe.textContent = text.slice(0, mid);
          if (probe.scrollHeight <= limit) { best = mid; lo = mid + 1; }
          else hi = mid - 1;
        }
        col.removeChild(probe);
        if (best <= 0) return ['', text];
        if (best >= text.length) return [text, ''];
        const head = text.slice(0, best);
        const m = head.match(/[\s，。、；：！？,.;:!?）》」』】—…](?![\s\S]*[\s，。、；：！？,.;:!?）》」』】—…])/);
        let cut = best;
        if (m && m.index > best * 0.6) cut = m.index + 1;
        return [text.slice(0, cut), text.slice(cut)];
      };

      const renderInto = (item, container) => {
        const w = document.createElement('div');
        w.innerHTML = blockHtml(item);
        const n = w.firstElementChild;
        if (n) container.appendChild(n);
        return n;
      };

      const rebuildCol = () => {
        col.innerHTML = '';
        for (const it of cur) renderInto(it, col);
      };

      const queue = blocks.slice();
      let guard = 0;
      const isDual = state.readerConfig.viewMode === 'dual';
      const forceChapterStart = () => {
        if (cur.length) flush();
        if (isDual && pages.length % 2 === 1) {
          pages.push([]);
        }
      };

      for (let qi = 0; qi < queue.length; qi++) {
        if (++guard > 200000) break;
        const b = queue[qi];
        if (b.forceNewPage) { forceChapterStart(); }
        if (b.type === 'img' && b.dead) continue;

        const node = renderInto(b, col);
        if (!node) continue;

        if (col.scrollHeight <= availH) {
          cur.push(b);
          continue;
        }

        col.removeChild(node);
        const remainH = availH - col.scrollHeight;
        const lineH = parseFloat(getComputedStyle(col).lineHeight) || 40;

        const isPlainText = b.type === 'p' && typeof b.text === 'string' && b.text.length > 0;
        if (isPlainText && !b.splitFrom && remainH >= lineH * 2) {
          const [head, tail] = splitParagraph(b.text, remainH);
          if (head && head.length >= 8 && tail && tail.length >= 8) {
            cur.push({ type: 'p', text: head });
            rebuildCol();
            queue.splice(qi + 1, 0, { ...b, text: tail, splitFrom: true });
            continue;
          }
        }

        flush();
        renderInto(b, col);
        cur.push(b);
      }
      if (cur.length) pages.push(cur);
      measure.innerHTML = '';

      const merged = [];
      for (const pg of pages) {
        if (!pg.length) { merged.push([]); continue; }
        const onlyImgs = pg.every(b => b.type === 'img');
        const last = merged[merged.length - 1];
        if (onlyImgs && last && last.length && last.every(b => b.type === 'img')) {
          last.push(...pg);
        } else {
          merged.push(pg.slice());
        }
      }

      if (isDual) {
        for (let i = 0; i < merged.length; i++) {
          const pg = merged[i];
          if (!pg.length) continue;
          if (!pg[0] || !pg[0].forceNewPage) continue;
          if (i % 2 === 1) merged.splice(i, 0, []);
        }
      }

      book.pages = merged.length ? merged : [[{ type: 'p', text: '暂无内容' }]];
    }

    function repaginateCurrentPageOnly() {
      const book = state.currentBook;
      if (!book || book.format === 'PDF' || !book.pages) return;
      const mode = state.readerConfig.viewMode;
      if (mode === 'scroll') { renderReaderPages(); return; }
      const leaf = $('page-left');
      const measure = $('page-measure-box');
      if (!leaf) return;
      const cs = getComputedStyle(leaf);
      const availW = Math.max(160, leaf.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      const availH = Math.max(140, leaf.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6);

      measure.style.width = availW + 'px';
      measure.innerHTML = `<div id="m-cur" style="width:100%;font-family:var(--reader-font-family);font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;"></div>`;
      const col = $('m-cur');

      const idx = state.currentPageIndex;
      const flat = [];
      for (let i = idx; i < book.pages.length && flat.length < 60; i++) flat.push(...book.pages[i]);

      const out = [];
      for (const b of flat) {
        if (b.type === 'img' && b.dead) continue;
        const w = document.createElement('div');
        w.innerHTML = blockHtml(b);
        const n = w.firstElementChild;
        if (!n) continue;
        col.appendChild(n);
        if (col.scrollHeight <= availH) {
          out.push(b);
        } else {
          col.removeChild(n);
          break;
        }
      }
      measure.innerHTML = '';

      if (out.length) {
        book.pages[idx] = out;
      }
      renderReaderPages();
    }

    async function renderPdfPage(pdfDoc, num, box) {
      box.innerHTML = '';
      if (num < 1 || num > pdfDoc.numPages) return;
      const page = await pdfDoc.getPage(num);
      const vp0 = page.getViewport({ scale: 1 });
      const scale = Math.min((box.clientWidth - 20) / vp0.width, (box.clientHeight - 20) / vp0.height);
      const vp = page.getViewport({ scale: Math.max(0.4, scale) });
      const canvas = document.createElement('canvas');
      canvas.className = 'mx-auto my-auto shadow-sm rounded max-w-full max-h-full object-contain';
      canvas.width = vp.width; canvas.height = vp.height;
      box.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }

    async function renderReaderPages() {
      const book = state.currentBook;
      if (!book) return;
      const mode = state.readerConfig.viewMode;
      const pL = $('page-left'), pR = $('page-right');

      const total = book.format === 'PDF' ? (book.numPages || 1) : ((book.pages && book.pages.length) || 1);
      state.currentPageIndex = Math.max(0, Math.min(state.currentPageIndex, total - 1));
      book.lastPageIndex = state.currentPageIndex;
      book.progressPercent = Math.min(100, Math.max(0.05, ((state.currentPageIndex + 1) / total) * 100));
      saveBookDB(book);

      if (book.format === 'PDF' && book.pdfDoc) {
        await renderPdfPage(book.pdfDoc, state.currentPageIndex + 1, pL);
        if (mode === 'dual') await renderPdfPage(book.pdfDoc, state.currentPageIndex + 2, pR);
        return;
      }

      if (mode === 'scroll') {
        pL.innerHTML = `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${(book.rawBlocks || []).map(blockHtml).join('')}</div>`;
        pR.innerHTML = '';
        applyNoteHighlights(pL);
      } else {
        const renderLeaf = idx => `<div style="font-size:var(--reader-font-size);letter-spacing:var(--reader-letter-spacing);line-height:1.72;">${((book.pages && book.pages[idx]) || []).map(blockHtml).join('')}</div>`;
        pL.innerHTML = renderLeaf(state.currentPageIndex);
        if (mode === 'dual') {
          pR.innerHTML = renderLeaf(state.currentPageIndex + 1);
          applyNoteHighlights($('reader-content-viewport'));
        } else {
          pR.innerHTML = '';
          applyNoteHighlights(pL);
        }
      }
    }

    function turnPage(dir) {
      if (!state.currentBook || state.readerConfig.viewMode === 'scroll') return;
      const step = state.readerConfig.viewMode === 'dual' ? 2 : 1;
      const total = state.currentBook.format === 'PDF' ? state.currentBook.numPages : state.currentBook.pages.length;
      const next = state.currentPageIndex + dir * step;
      if (next < 0) return showToast('已经是第一页');
      if (next >= total) return showToast('已经是最后一页');
      state.currentPageIndex = next;
      hideSelectionPopover();
      renderReaderPages();
    }

    function renderColorSwatches() {
      const cfg = state.readerConfig;
      const buildGroup = (containerId, listKey, activeKey, pickerId, emptyNotice) => {
        const box = $(containerId);
        box.innerHTML = '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'w-11 h-11 rounded-full bg-white border border-neutral-200 shadow-sm flex items-center justify-center text-[#554940] hover:bg-neutral-50 cursor-pointer';
        addBtn.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18.5" r="2"/></svg>`;
        addBtn.onclick = () => $(pickerId).click();
        box.appendChild(addBtn);

        cfg[listKey].forEach(color => {
          const selected = cfg[activeKey] && cfg[activeKey].toLowerCase() === color.toLowerCase();
          const wrap = document.createElement('div');
          wrap.className = 'relative flex items-center justify-center';
          wrap.innerHTML = `
            <button type="button" style="background-color:${esc(color)}" class="swatch-btn w-11 h-11 rounded-full border border-neutral-200 flex items-center justify-center transition cursor-pointer ${selected ? 'swatch-selected' : 'hover:scale-105'}">
              ${selected ? `<svg class="w-5 h-5 text-white drop-shadow" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
            </button>
            <button type="button" class="del-swatch absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#9e9a93] hover:bg-neutral-700 text-white flex items-center justify-center text-[10px] leading-none shadow cursor-pointer">✕</button>`;

          wrap.querySelector('.swatch-btn').onclick = () => {
            cfg[activeKey] = selected ? null : color;
            if (selected) showToast(emptyNotice);
            savePrefs();
            applyThemeColors();
            renderColorSwatches();
          };
          wrap.querySelector('.del-swatch').onclick = e => {
            e.stopPropagation();
            cfg[listKey] = cfg[listKey].filter(c => c.toLowerCase() !== color.toLowerCase());
            if (selected) cfg[activeKey] = null;
            savePrefs();
            applyThemeColors();
            renderColorSwatches();
          };
          box.appendChild(wrap);
        });
      };

      buildGroup('bg-color-swatches', 'customBgColors', 'bgColor', 'native-bg-picker', '已取消，恢复原书背景');
      buildGroup('text-color-swatches', 'customTextColors', 'textColor', 'native-text-picker', '已取消，恢复原书文字色');
    }

    // ==================== 事件监听绑定与初始化 ====================
    window.addEventListener('DOMContentLoaded', async () => {
      bindImageFallback();
      loadPrefs();
      state.books = await loadAllBooksDB();
      state.notes = await loadAllNotesDB();

      state.localFonts = await loadAllLocalFonts();
      state.localFonts.forEach(rec => {
        state.fontMap[rec.id] = `'${rec.family}', 'PingFang SC', 'Microsoft YaHei', sans-serif`;
        registerLocalFontFace(rec);
      });
      if (state.readerConfig.fontFamily && !state.fontMap[state.readerConfig.fontFamily]) {
        state.readerConfig.fontFamily = 'yeliqun';
        savePrefs();
      }

      const sliderDefs = [
        { key: 'fontSize', label: '字体大小', min: 13, max: 40, step: 1, isLayout: true },
        { key: 'margin', label: '页边距', min: -40, max: 80, step: 1, isLayout: true },
        { key: 'letterSpacing', label: '字间距', min: 0, max: 20, step: 1, isLayout: true },
        { key: 'paraSpacing', label: '段落间距', min: 0, max: 100, step: 1, isLayout: true },
        { key: 'brightness', label: '屏幕亮度', min: 0.4, max: 1, step: 0.05, isLayout: false }
      ];
      const sBox = $('sliders-container');
      sliderDefs.forEach(d => {
        const val = state.readerConfig[d.key];
        const div = document.createElement('div');
        div.className = 'space-y-2';
        div.innerHTML = `
          <div class="flex items-center justify-between text-[15px]">
            <span>${d.label}</span>
            <span id="lbl-${d.key}" class="font-medium">${val}</span>
          </div>
          <input id="rng-${d.key}" type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${val}" class="onereader-slider" />`;
        sBox.appendChild(div);

        div.querySelector('input').oninput = e => {
          const v = Number(e.target.value);
          state.readerConfig[d.key] = v;
          $(`lbl-${d.key}`).textContent = e.target.value;
          savePrefs();
          if (!d.isLayout) {
            applyThemeColors();
          } else {
            applyLayoutStyles();
            if (isMobile()) {
              repaginateCurrentPageOnly();
            } else {
              repaginateDebounced();
            }
          }
        };
        div.querySelector('input').onchange = () => {
          if (!d.isLayout) return;
          if (isMobile()) {
            repaginate();
            renderReaderPages();
          }
        };
      });

      renderShelves();
      renderLibrary();
      renderColorSwatches();
      renderFontOptions();
      applyThemeColors();
      applyLayoutStyles();
      updateCloudIndicator();
      updateStorageUsageDisplay();

      $('reader-fullscreen-toggle').onclick = toggleReaderFullscreen;

      // ==================== 笔记：选中文字 -> 划线弹窗 ====================
      const handleSelectionEnd = () => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (!$('note-editor-modal').classList.contains('hidden')) return;
        if (!$('toc-backdrop') || !$('toc-backdrop').classList.contains('hidden')) return;
        if (!$('settings-backdrop').classList.contains('hidden')) return;
        const info = captureSelection();
        if (!info) { hideSelectionPopover(); return; }
        pendingSelection = info;
        showSelectionPopover(info.rect);
      };

      document.addEventListener('mouseup', e => {
        const pop = $('selection-popover');
        if (!pop.classList.contains('hidden') && pop.contains(e.target)) return;
        setTimeout(handleSelectionEnd, 10);
      });

      let selChangeTimer = null;
      document.addEventListener('selectionchange', () => {
        if ($('reader-view').classList.contains('hidden')) return;
        clearTimeout(selChangeTimer);
        selChangeTimer = setTimeout(() => {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed || !sel.toString()) return;
          handleSelectionEnd();
        }, 220);
      });
      $('reader-content-viewport').addEventListener('touchend', () => setTimeout(handleSelectionEnd, 350), { passive: true });
      document.addEventListener('mousedown', e => {
        const pop = $('selection-popover');
        if (pop.classList.contains('hidden')) return;
        if (pop.contains(e.target)) return;
        hideSelectionPopover();
      });

      // 墨绿笔：新建带备注的笔记
      $('sel-note-btn').onclick = () => {
        if (!pendingSelection) return;
        hideSelectionPopover();
        const book = state.currentBook;
        const now = Date.now();
        const note = {
          id: newNoteId(),
          bookFile: book ? book.fileName : '',
          bookTitle: book ? book.title : '',
          chapter: currentChapterName(),
          quote: pendingSelection.quote,
          content: '',
          color: pendingSelection.color || lastNoteColor(),
          blockIndex: pendingSelection.blockIndex,
          createdAt: now,
          updatedAt: now,
          contentUpdatedAt: now,
          deletedAt: null,
          conflictOf: null
        };
        openNoteEditor(note);
        window.getSelection().removeAllRanges();
      };

      // 蓝色块：直接存为纯摘抄（content 为空）
      $('sel-quote-btn').onclick = async () => {
        if (!pendingSelection) return;
        hideSelectionPopover();
        const book = state.currentBook;
        const now = Date.now();
        const note = {
          id: newNoteId(),
          bookFile: book ? book.fileName : '',
          bookTitle: book ? book.title : '',
          chapter: currentChapterName(),
          quote: pendingSelection.quote,
          content: '',
          color: pendingSelection.color || lastNoteColor(),
          blockIndex: pendingSelection.blockIndex,
          createdAt: now,
          updatedAt: now,
          contentUpdatedAt: now,
          deletedAt: null,
          conflictOf: null
        };
        state.notes.push(note);
        await putNoteDB(note);
        window.getSelection().removeAllRanges();
        renderReaderPages();
        if (state.currentNav === 'notes') renderNotesBookFilter();
        showToast('已添加摘抄');
      };

      // 复制
      $('sel-copy-btn').onclick = async () => {
        if (!pendingSelection) return;
        try {
          await navigator.clipboard.writeText(pendingSelection.quote);
          showToast('已复制');
        } catch (e) {
          showToast('复制失败，请手动复制');
        }
        hideSelectionPopover();
      };

      // 编辑弹窗
      $('note-editor-confirm').onclick = saveEditedNote;
      $('note-editor-cancel').onclick = closeNoteEditor;
      $('note-editor-delete').onclick = () => {
        if (!editingNote) return;
        const existing = state.notes.find(n => n.id === editingNote.id);
        if (!existing) { closeNoteEditor(); return; }
        removeEditedNote();
      };
      $('note-editor-modal').onclick = e => {
        if (e.target === $('note-editor-modal')) closeNoteEditor();
      };

      let mobileCtrlTimer = null;
      const autoHideMobileControls = () => {
        clearTimeout(mobileCtrlTimer);
        mobileCtrlTimer = setTimeout(() => {
          $('reader-view').classList.remove('mobile-controls-active');
        }, 6000);
      };
      $('reader-view').addEventListener('touchstart', () => {
        if ($('reader-view').classList.contains('mobile-controls-active')) autoHideMobileControls();
      }, { passive: true });

      // 侧边栏
      $('toggle-sidebar-btn').onclick = () => {
        const sb = $('library-sidebar');
        if (isMobile()) {
          const open = sb.classList.contains('mobile-closed');
          sb.classList.toggle('mobile-closed', !open);
          $('mobile-sidebar-backdrop').classList.toggle('hidden', !open);
        } else {
          sb.classList.toggle('hidden');
        }
      };
      $('mobile-sidebar-backdrop').onclick = () => $('toggle-sidebar-btn').click();

      document.querySelector('[data-nav="all"]').onclick = () => {
        state.currentNav = 'all';
        hideNotesView();
        updateNavSelection();
      };
      document.querySelector('[data-nav="notes"]').onclick = () => {
        state.currentNav = 'notes';
        updateNavSelection();
        showNotesView();
      };
      $('notes-sync-btn').onclick = syncNotesWithCloud;
      $('notes-export-btn').onclick = exportNotesJSON;
      $('notes-book-filter').onchange = e => {
        state.notesBookFilter = e.target.value;
        renderNotes();
      };
      $('shelf-collapse-btn').onclick = () => {
        $('shelf-items-container').classList.toggle('hidden');
        $('shelf-chevron').classList.toggle('-rotate-90');
      };

      // ==================== 书库搜索：显式提交 ====================
      const libSearch = $('library-search-input');

      function applyLibrarySearch() {
        if (!libSearch) return;
        const kw = libSearch.value.trim();
        state.searchQuery = kw;
        const chip = $('library-search-chip');
        if (chip) {
          chip.classList.toggle('hidden', !kw);
          $('library-search-chip-text').textContent = kw;
        }
        renderLibrary();
      }

      function clearLibrarySearch() {
        if (libSearch) libSearch.value = '';
        state.searchQuery = '';
        const chip = $('library-search-chip');
        if (chip) chip.classList.add('hidden');
        renderLibrary();
      }

      if (libSearch) {
        libSearch.addEventListener('input', () => {
          const chip = $('library-search-chip');
          if (libSearch.value.trim() === '' && state.searchQuery) {
            state.searchQuery = '';
            if (chip) chip.classList.add('hidden');
            renderLibrary();
          }
        });

        libSearch.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyLibrarySearch();
            libSearch.blur();
          } else if (e.key === 'Escape') {
            libSearch.value = '';
            clearLibrarySearch();
            libSearch.blur();
          }
          e.stopPropagation();
        });

        libSearch.addEventListener('blur', () => {
          if (libSearch.value && document.activeElement !== libSearch) {
            if (libSearch.value.trim() !== state.searchQuery) {
              libSearch.value = state.searchQuery;
            }
          }
        });
      }

      $('library-search-btn').onclick = applyLibrarySearch;
      $('library-search-chip').onclick = clearLibrarySearch;

      state.searchQuery = '';
      if (libSearch) libSearch.value = '';

      // 书架管理
      $('create-shelf-btn').onclick = () => {
        openPrompt('新建书架', '请输入新书架名称：', '', name => {
          if (!name || state.shelves.includes(name)) return;
          state.shelves.push(name);
          savePrefs(); renderShelves();
          showToast(`已新建书架「${name}」`);
        });
      };
      $('modal-cancel-btn').onclick = () => $('custom-modal').classList.add('hidden');
      $('modal-confirm-btn').onclick = () => {
        const v = $('modal-input').value.trim();
        $('custom-modal').classList.add('hidden');
        if (state.modalConfirmCallback) state.modalConfirmCallback(v);
      };
      $('manage-shelf-btn').onclick = () => {
        renderManageShelvesList();
        $('manage-shelves-modal').classList.remove('hidden');
      };
      $('close-manage-shelves-btn').onclick = () => $('manage-shelves-modal').classList.add('hidden');

      // 云端弹窗交互
      $('open-cloud-modal-btn').onclick = () => {
        $('gh-owner-input').value = state.github.owner || '';
        $('gh-repo-input').value = state.github.repo || '';
        $('gh-branch-input').value = state.github.branch || '';
        $('gh-token-input').value = state.github.token || '';
        updateStorageUsageDisplay();
        $('cloud-hub-modal').classList.remove('hidden');
      };
      $('close-cloud-modal-btn').onclick = () => $('cloud-hub-modal').classList.add('hidden');
      $('toggle-token-vis-btn').onclick = e => {
        const inp = $('gh-token-input');
        const isPwd = inp.type === 'password';
        inp.type = isPwd ? 'text' : 'password';
        e.currentTarget.textContent = isPwd ? '隐藏' : '显示';
      };
      $('gh-connect-pull-btn').onclick = pullFromGitHubPrivateRepo;
      $('gh-clear-config-btn').onclick = () => {
        state.github = { owner: '', repo: '', branch: '', token: '', metaSha: '' };
        $('gh-owner-input').value = ''; $('gh-repo-input').value = ''; $('gh-branch-input').value = ''; $('gh-token-input').value = '';
        savePrefs(); updateCloudIndicator();
        showToast('已清除本地 GitHub 密钥');
      };
      $('purge-all-cache-btn').onclick = purgeAllLocalCache;

      $('hub-import-local-btn').onclick = () => {
        $('cloud-hub-modal').classList.add('hidden');
        pendingUploadToCloud = false;
        $('file-upload-input').click();
      };
      $('hub-import-cloud-btn').onclick = () => {
        if (!isCloudConnected()) return showToast('请先连接私有仓');
        $('cloud-hub-modal').classList.add('hidden');
        pendingUploadToCloud = true;
        $('file-upload-input').click();
      };
      $('hub-download-html-btn').onclick = () => {
        const src = '\uFEFF<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([src], { type: 'text/html;charset=utf-8' }));
        a.download = 'index.html';
        a.click();
        showToast('已下载 index.html');
      };
      $('file-upload-input').onchange = e => {
        const toCloud = pendingUploadToCloud;
        pendingUploadToCloud = false;
        handleFilesImport(e.target.files, toCloud);
        e.target.value = '';
      };

      const closeBookMenu = () => {
        $('book-action-popover').classList.add('hidden');
        $('book-action-backdrop').classList.add('hidden');
      };
      $('book-action-backdrop').onclick = closeBookMenu;

      const openAssignModal = ids => {
        const box = $('assign-shelf-options');
        box.innerHTML = '';
        state.shelves.forEach(s => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'w-full text-left px-4 py-2.5 rounded-xl hover:bg-neutral-100 text-[15px] cursor-pointer flex justify-between';
          b.innerHTML = `<span>${esc(s)}</span><span class="text-xs text-neutral-400">选择</span>`;
          b.onclick = () => {
            state.books.forEach(bk => { if (ids.includes(bk.id)) { bk.shelf = s; saveBookDB(bk); } });
            $('assign-shelf-modal').classList.add('hidden');
            state.multiSelectMode = false; state.selectedBookIds.clear();
            renderLibrary();
            showToast(`已添加到「${s}」`);
          };
          box.appendChild(b);
        });
        $('assign-shelf-modal').classList.remove('hidden');
      };
      $('close-assign-shelf-btn').onclick = () => $('assign-shelf-modal').classList.add('hidden');

      $('book-act-shelf').onclick = () => { closeBookMenu(); if (state.activeMenuBookId) openAssignModal([state.activeMenuBookId]); };
      $('book-act-multiselect').onclick = () => {
        closeBookMenu();
        state.multiSelectMode = true;
        state.selectedBookIds.clear();
        if (state.activeMenuBookId) state.selectedBookIds.add(state.activeMenuBookId);
        renderLibrary();
      };
      $('book-act-pin').onclick = () => {
        closeBookMenu();
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (bk) { bk.pinned = !bk.pinned; saveBookDB(bk); renderLibrary(); }
      };
      $('book-act-purge-one').onclick = async () => {
        closeBookMenu();
        const bk = state.books.find(b => b.id === state.activeMenuBookId);
        if (bk) {
          bk.fileBytes = null;
          bk.rawBlocks = null;
          bk.pdfDoc = null;
          bk.isCloudOnly = true;
          await saveBookDB(bk);
          renderLibrary();
          showToast(`已释放《${bk.title}》的本地缓存空间`);
        }
      };
      $('book-act-delete').onclick = async () => {
        closeBookMenu();
        const idx = state.books.findIndex(b => b.id === state.activeMenuBookId);
        if (idx !== -1) {
          const removed = state.books.splice(idx, 1)[0];
          await deleteBookDB(removed.id);
          renderLibrary();
          showToast(`已删除《${removed.title}》`);
        }
      };
      $('book-act-cloud-delete').onclick = async () => {
        closeBookMenu();
        if (!isCloudConnected()) return showToast('请先连接私有仓');
        const idx = state.books.findIndex(b => b.id === state.activeMenuBookId);
        if (idx === -1) return;
        const bk = state.books[idx];
        try {
          showToast(`正在从私有仓删除《${bk.title}》...`);
          await deleteBookFromCloud(bk);
          state.books.splice(idx, 1);
          await deleteBookDB(bk.id);
          renderLibrary();
          showToast(`已从本地与私有仓删除《${bk.title}》`);
        } catch (e) {
          showToast(`云端删除失败：${e.message || '请检查仓库权限'}`);
        }
      };

      $('batch-add-shelf-btn').onclick = () => openAssignModal(Array.from(state.selectedBookIds));
      $('batch-pin-btn').onclick = () => {
        state.books.forEach(b => { if (state.selectedBookIds.has(b.id)) { b.pinned = true; saveBookDB(b); } });
        state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary();
      };
      $('batch-delete-btn').onclick = async () => {
        for (const id of state.selectedBookIds) {
          const i = state.books.findIndex(b => b.id === id);
          if (i !== -1) { state.books.splice(i, 1); await deleteBookDB(id); }
        }
        state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary();
      };
      $('batch-exit-btn').onclick = () => { state.multiSelectMode = false; state.selectedBookIds.clear(); renderLibrary(); };

      $('reader-home-trigger').onclick = () => {
        exitFullscreenIfAny();
        $('reader-view').classList.add('hidden');
        $('library-view').classList.remove('hidden');
        renderLibrary();
      };
      $('reader-settings-trigger').onclick = () => {
        $('reader-settings-drawer').classList.remove('translate-x-full');
        $('settings-backdrop').classList.remove('hidden');
      };
      const closeDrawer = () => {
        $('reader-settings-drawer').classList.add('translate-x-full');
        $('settings-backdrop').classList.add('hidden');
        if (state.currentBook) {
          setTimeout(() => {
            repaginate();
            renderReaderPages();
          }, 60);
        }
      };
      $('close-settings-drawer-btn').onclick = closeDrawer;
      $('settings-backdrop').onclick = closeDrawer;

      $('reader-toc-trigger').onclick = () => {
        if ($('reader-toc-drawer').classList.contains('-translate-x-full')) openTocDrawer();
        else closeTocDrawer();
      };
      $('toc-backdrop').onclick = closeTocDrawer;
      $('toc-tab-toc').onclick = () => { state.tocTab = 'toc'; updateTocTabs(); renderTocList(); };
      $('toc-tab-bm').onclick = () => { state.tocTab = 'bm'; updateTocTabs(); renderTocList(); };

      $('toc-search-open').onclick = openTocSearch;
      $('toc-search-close').onclick = closeTocSearch;
      $('toc-search-input').oninput = () => runTocSearch();
      $('toc-search-clear').onclick = () => {
        $('toc-search-input').value = '';
        runTocSearch();
        $('toc-search-input').focus();
      };
      $('toc-search-input').onkeydown = e => {
        if (e.key === 'Escape') { e.stopPropagation(); closeTocSearch(); }
      };
      $('add-bookmark-btn').onclick = async () => {
        const book = state.currentBook;
        if (!book) return;
        book.bookmarks = book.bookmarks || [];
        let page = state.currentPageIndex;
        if (state.readerConfig.viewMode === 'dual' && page % 2 === 1) page = page - 1;
        const isEmpty = pg => !pg || pg.length === 0 || !pg.some(b => b.text);
        if (isEmpty(book.pages && book.pages[page]) && page > 0) page = page - 1;
        if (book.bookmarks.some(m => m.page === page)) return showToast('当前页已在书签中');
        const pageBlocks = (book.pages && book.pages[page]) || [];
        const first = pageBlocks.find(b => b.text);
        book.bookmarks.push({
          page,
          label: first ? first.text.slice(0, 40) : `第 ${page + 1} 页`,
          progress: `${Math.round(((page + 1) / Math.max(1, (book.pages || []).length)) * 100)}%`,
          createdAt: Date.now()
        });
        book.bookmarks.sort((a, b) => a.page - b.page);
        await saveBookDB(book);
        state.tocTab = 'bm';
        updateTocTabs();
        renderTocList();
        showToast('已加入书签');
      };

      document.querySelectorAll('.view-mode-btn').forEach(b => {
        b.onclick = () => {
          state.readerConfig.viewMode = b.dataset.mode;
          savePrefs(); applyLayoutStyles(); repaginate(); renderReaderPages();
        };
      });

      $('native-bg-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customBgColors.includes(hex)) state.readerConfig.customBgColors.push(hex);
        state.readerConfig.bgColor = hex;
        savePrefs(); applyThemeColors(); renderColorSwatches();
      };
      $('native-text-picker').onchange = e => {
        const hex = e.target.value;
        if (!state.readerConfig.customTextColors.includes(hex)) state.readerConfig.customTextColors.push(hex);
        state.readerConfig.textColor = hex;
        savePrefs(); applyThemeColors(); renderColorSwatches();
      };
      $('clear-bg-custom-btn').onclick = () => {
        state.readerConfig.customBgColors = [];
        state.readerConfig.bgColor = null;
        savePrefs(); applyThemeColors(); renderColorSwatches();
        showToast('已清除，还原原书背景');
      };
      $('clear-text-custom-btn').onclick = () => {
        state.readerConfig.customTextColors = [];
        state.readerConfig.textColor = null;
        savePrefs(); applyThemeColors(); renderColorSwatches();
        showToast('已清除，还原原书文字色');
      };

      $('select-font-family').onchange = e => {
        state.readerConfig.fontFamily = e.target.value;
        savePrefs(); applyLayoutStyles(); repaginate(); renderReaderPages();
      };

      $('import-local-font-btn').onclick = () => $('font-upload-input').click();
      $('font-upload-input').onchange = async e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        await handleLocalFontImport(file);
      };

      // ==================== 全能翻页：键盘、滚轮、触屏滑动 ====================
      let lastWheelTime = 0;
      window.addEventListener('wheel', e => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (state.readerConfig.viewMode === 'scroll') return;
        const now = Date.now();
        if (now - lastWheelTime < 240) return;
        if (Math.abs(e.deltaY) > 20) {
          lastWheelTime = now;
          turnPage(e.deltaY > 0 ? 1 : -1);
        }
      }, { passive: true });

      window.addEventListener('keydown', e => {
        if ($('reader-view').classList.contains('hidden')) return;
        if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) turnPage(-1);
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) turnPage(1);
      });

      let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
      $('reader-content-viewport').addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }, { passive: true });

      $('reader-content-viewport').addEventListener('touchend', e => {
        const held = Date.now() - touchStartTime;
        if (held > 350) return;
        if (window.getSelection().toString()) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (state.readerConfig.viewMode === 'scroll') {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            const v = $('reader-view');
            v.classList.toggle('mobile-controls-active');
            if (v.classList.contains('mobile-controls-active')) autoHideMobileControls();
            else clearTimeout(mobileCtrlTimer);
          }
          return;
        }
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          turnPage(dx < 0 ? 1 : -1);
        } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          const x = e.changedTouches[0].clientX, w = window.innerWidth;
          if (x < w * 0.25) turnPage(-1);
          else if (x > w * 0.75) turnPage(1);
          else {
            const v = $('reader-view');
            v.classList.toggle('mobile-controls-active');
            if (v.classList.contains('mobile-controls-active')) autoHideMobileControls();
            else clearTimeout(mobileCtrlTimer);
          }
        }
      }, { passive: true });
    });
  </script>
</body>
</html>
