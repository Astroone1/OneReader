      </button>
      <div class="w-px h-6 bg-neutral-200"></div>
      <div id="sel-colors" class="flex items-center gap-2"></div>
    </div>

    <!-- ==================== 笔记编辑弹窗 ==================== -->
    <div id="note-editor-modal" class="hidden fixed inset-0 z-[70] bg-black/35 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl p-6 flex flex-col" style="font-family: var(--reader-font-family);">
        <div class="flex gap-3">
          <div id="note-editor-swatch" class="w-[3px] rounded shrink-0" style="background:#86c99a;"></div>
          <p id="note-editor-quote" class="text-[15px] leading-relaxed text-[#3a3a3a] whitespace-pre-wrap max-h-[38vh] overflow-y-auto"></p>
        </div>
        <textarea id="note-editor-content" placeholder="写点想法…（可留空）" class="mt-5 w-full h-[130px] resize-none rounded-xl bg-[#f2f8f5] border border-transparent focus:border-[#cfe5d9] focus:outline-none px-4 py-3 text-[15px] leading-relaxed text-[#2f2f2f]"></textarea>
        <div id="note-editor-colors" class="mt-4 flex items-center gap-2.5"></div>
        <div id="note-editor-actions" class="mt-5 flex items-center justify-end gap-5 text-[15px]">
          <button id="note-editor-delete" type="button" class="text-neutral-600 hover:text-red-600 cursor-pointer">删除</button>
          <button id="note-editor-cancel" type="button" class="text-neutral-600 hover:text-black cursor-pointer">取消</button>
          <button id="note-editor-confirm" type="button" class="text-[#2f2f2f] font-medium hover:text-black cursor-pointer">确认</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-message" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-[#333]/95 text-white text-sm shadow-lg opacity-0 transition-opacity duration-200"></div>

  <script>
    const $ = id => document.getElementById(id);
    const isMobile = () => window.innerWidth <= 768;
    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const state = {
      shelves: ['交易', '世界', '小说', '技能'],
      currentNav: 'all',
      searchQuery: '',
      books: [],
      notes: [],
      notesBookFilter: '',
      notesPulledReady: false,
      lastPulledNotesSha: null,
      currentBook: null,
      currentPageIndex: 0,
      activeMenuBookId: null,
      multiSelectMode: false,
      selectedBookIds: new Set(),
      modalConfirmCallback: null,
      tocTab: 'toc',
      github: { owner: '', repo: '', branch: '', token: '' },
      fontMap: {
        system: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif",
        songti: "'SimSun', 'Songti SC', serif",
        kaiti: "'KaiTi', 'STKaiti', serif",
        yeliqun: "'叶立群几何体测试版', '叶立群几何体', 'YeLiQun Jiheti', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      },
      localFonts: [],
      readerConfig: {
        viewMode: isMobile() ? 'single' : 'dual',
        bgColor: '#fdf6e3',
        textColor: '#2f251e',
        customBgColors: ['#fdf6e3'],
        customTextColors: ['#2f251e'],
        fontSize: isMobile() ? 20 : 23,
        margin: 0,
        letterSpacing: 0,
        paraSpacing: 15,
        brightness: 1,
        fontFamily: 'yeliqun'
      }
    };

    const PREFS_KEY = 'onereader_prefs_v4';
    const GH_KEY = 'onereader_gh_v4';
    const PROGRESS_KEY = 'onereader_progress_v1';
    const PREFS_VER = 2;
    const DB_NAME = 'OneReaderDB_v4';
    const FONT_DB_NAME = 'OneReaderFonts_v1';
    const PARSE_VERSION = 5;

    // 极轻量进度表（避免每次翻页或改设置都把整本几十 MB 的书重写进 IndexedDB）
    function saveQuickProgress(book) {
      if (!book || !book.id) return;
      try {
        const map = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
        map[book.id] = {
          lastPageIndex: book.lastPageIndex || 0,
          lastBlockIndex: typeof book.lastBlockIndex === 'number' ? book.lastBlockIndex : undefined,
          progressPercent: book.progressPercent || 0,
          hasBeenRead: Boolean(book.hasBeenRead),
          lastReadAt: book.lastReadAt || 0,
          updatedAt: Date.now()
        };
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function mergeQuickProgress(books) {
      try {
        const map = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
        (books || []).forEach(b => {
          const p = map[b.id];
          if (p) {
            b.lastPageIndex = p.lastPageIndex ?? b.lastPageIndex ?? 0;
            if (typeof p.lastBlockIndex === 'number') b.lastBlockIndex = p.lastBlockIndex;
            b.progressPercent = p.progressPercent ?? b.progressPercent ?? 0;
            b.hasBeenRead = Boolean(p.hasBeenRead || b.hasBeenRead);
            if (p.lastReadAt && p.lastReadAt > (b.lastReadAt || 0)) b.lastReadAt = p.lastReadAt;
          }
        });
      } catch (e) {}
    }

    let toastTimer = null;
    let pendingUploadToCloud = false;
    function showToast(msg) {
      const el = $('toast-message');
      el.textContent = msg;
      el.classList.replace('opacity-0', 'opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.replace('opacity-100', 'opacity-0'), 2500);
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({ shelves: state.shelves, readerConfig: state.readerConfig, prefsVer: PREFS_VER }));
        localStorage.setItem(GH_KEY, JSON.stringify(state.github));
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (Array.isArray(p.shelves) && p.shelves.length) state.shelves = p.shelves;
        if (p.readerConfig) Object.assign(state.readerConfig, p.readerConfig);
        if (p.prefsVer !== PREFS_VER) {
          if (state.readerConfig.fontFamily === 'system') state.readerConfig.fontFamily = 'yeliqun';
        }
        const g = JSON.parse(localStorage.getItem(GH_KEY) || '{}');
        if (g && typeof g === 'object') Object.assign(state.github, g);
      } catch (e) {}
    }

    // ==================== IndexedDB 本地长期存储 ====================
    function openDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains('books')) {
            e.target.result.createObjectStore('books', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function saveBookDB(b) {
      const db = await openDB();
      if (!db) return;
      const copy = { ...b, pages: undefined };
      db.transaction('books', 'readwrite').objectStore('books').put(copy);
      updateStorageUsageDisplay();
    }

    async function saveBooksBatchDB(books) {
      const db = await openDB();
      if (!db || !books || !books.length) return;
      await new Promise(res => {
        const tx = db.transaction('books', 'readwrite');
        const store = tx.objectStore('books');
        books.forEach(b => store.put({ ...b, pages: undefined }));
        tx.oncomplete = res;
        tx.onerror = res;
      });
      updateStorageUsageDisplay();
    }

    async function deleteBookDB(id) {
      const db = await openDB();
      if (db) {
        db.transaction('books', 'readwrite').objectStore('books').delete(id);
        updateStorageUsageDisplay();
      }
    }

    async function loadAllBooksDB() {
      const db = await openDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction('books', 'readonly').objectStore('books').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    // ==================== 笔记：数据层 ====================
    const NOTES_STORE = 'notes';
    const HIGHLIGHT_COLORS = [
      { key: 'pink',   label: '粉', bg: '#f6c9c9' },
      { key: 'yellow', label: '黄', bg: '#f7e7a6' },
      { key: 'green',  label: '绿', bg: '#C7EDCC' },
      { key: 'blue',   label: '蓝', bg: '#bcd9f5' }
    ];
    const LAST_COLOR_KEY = 'onereader_last_note_color';

    function colorOf(key) {
      return HIGHLIGHT_COLORS.find(c => c.key === key) || HIGHLIGHT_COLORS[2];
    }
    function lastNoteColor() {
      try {
        const k = localStorage.getItem(LAST_COLOR_KEY);
        if (k && HIGHLIGHT_COLORS.some(c => c.key === k)) return k;
      } catch (e) {}
      return 'green';
    }
    function setLastNoteColor(key) {
      try { localStorage.setItem(LAST_COLOR_KEY, key); } catch (e) {}
    }
    function newNoteId() {
      return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function openNotesDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open('OneReaderNotes_v1', 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains(NOTES_STORE)) {
            e.target.result.createObjectStore(NOTES_STORE, { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function loadAllNotesDB() {
      const db = await openNotesDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction(NOTES_STORE, 'readonly').objectStore(NOTES_STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    async function putNoteDB(note) {
      const db = await openNotesDB();
      if (!db) return;
      db.transaction(NOTES_STORE, 'readwrite').objectStore(NOTES_STORE).put(note);
    }

    function sortedNotes(list) {
      return list
        .filter(n => !n.deletedAt)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function notesOfBook(book) {
      if (!book) return [];
      return state.notes.filter(n => !n.deletedAt && n.bookFile === book.fileName);
    }

    // ==================== 本地字体 ====================
    function openFontDB() {
      return new Promise(res => {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(FONT_DB_NAME, 1);
        r.onupgradeneeded = e => {
          if (!e.target.result.objectStoreNames.contains('fonts')) {
            e.target.result.createObjectStore('fonts', { keyPath: 'id' });
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    }

    async function loadAllLocalFonts() {
      const db = await openFontDB();
      if (!db) return [];
      return new Promise(res => {
        const req = db.transaction('fonts', 'readonly').objectStore('fonts').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    async function saveLocalFontDB(rec) {
      const db = await openFontDB();
      if (!db) return;
      db.transaction('fonts', 'readwrite').objectStore('fonts').put(rec);
    }

    async function deleteLocalFontDB(id) {
      const db = await openFontDB();
      if (!db) return;
      db.transaction('fonts', 'readwrite').objectStore('fonts').delete(id);
    }

    function registerLocalFontFace(rec) {
      if (!rec || !rec.buffer || !rec.family) return;
      try {
        const face = new FontFace(rec.family, rec.buffer.slice(0));
        face.load().then(f => document.fonts.add(f)).catch(() => {});
      } catch (e) {}
    }

    function renderFontOptions() {
      const sel = $('select-font-family');
      if (!sel) return;
      sel.querySelectorAll('option[data-local="1"]').forEach(o => o.remove());
      state.localFonts.forEach(rec => {
        const opt = document.createElement('option');
        opt.value = rec.id;
        opt.dataset.local = '1';
        opt.textContent = `本地：${rec.name}`;
        sel.appendChild(opt);
      });
      sel.value = state.readerConfig.fontFamily || 'system';
      if (!sel.value) sel.value = 'system';

      const box = $('local-font-list');
      if (!box) return;
      box.innerHTML = '';
      state.localFonts.forEach(rec => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1 max-w-full px-2 py-0.5 rounded-full bg-neutral-100 text-[11px] text-neutral-600';
        chip.innerHTML = `<span class="truncate max-w-[150px]"></span><button type="button" class="text-neutral-400 hover:text-red-500 leading-none px-0.5 cursor-pointer">✕</button>`;
        chip.firstElementChild.textContent = rec.name;
        chip.querySelector('button').onclick = async () => {
          await deleteLocalFontDB(rec.id);
          state.localFonts = state.localFonts.filter(f => f.id !== rec.id);
          if (state.readerConfig.fontFamily === rec.id) {
            state.readerConfig.fontFamily = 'yeliqun';
            savePrefs();
            applyLayoutStyles();
            repaginateDebounced();
          }
          renderFontOptions();
          showToast(`已移除本地字体「${rec.name}」`);
        };
        box.appendChild(chip);
      });
    }

    function guessFontFamilyFromName(name) {
      return String(name || '').replace(/\.(ttf|otf|woff2?|ttc)$/i, '').replace(/[_-]+/g, ' ').trim() || '本地字体';
    }

    async function handleLocalFontImport(file) {
      if (!file) return;
      if (!/\.(ttf|otf|woff2?|ttc)$/i.test(file.name)) return showToast('请选择 .ttf / .otf / .woff / .woff2 字体文件');
      const buf = await file.arrayBuffer();
      const family = guessFontFamilyFromName(file.name) + '_' + Date.now().toString(36);
      const displayName = guessFontFamilyFromName(file.name);

      try {
        const face = new FontFace(family, buf.slice(0));
        await face.load();
        document.fonts.add(face);
      } catch (e) {
        return showToast('这个字体文件无法解析，换一个 .ttf/.otf 试试');
      }

      const id = 'local:' + family;
      const rec = { id, name: displayName, family, mime: file.type || '', buffer: buf, addedAt: Date.now() };
      state.fontMap[id] = `'${family}', 'PingFang SC', 'Microsoft YaHei', sans-serif`;
      state.localFonts.push(rec);
      await saveLocalFontDB(rec);

      state.readerConfig.fontFamily = id;
      savePrefs();
      renderFontOptions();
      applyLayoutStyles();
      repaginateDebounced();
      showToast(`已导入并启用「${displayName}」`);
    }

    function updateStorageUsageDisplay() {
      let totalBytes = 0;
      let cachedCount = 0;
      state.books.forEach(b => {
        if (b.fileBytes) {
          totalBytes += (b.fileBytes.byteLength || 0);
          cachedCount++;
        }
      });
      const mb = (totalBytes / (1024 * 1024)).toFixed(1);
      $('local-storage-size').textContent = `已用 ${mb} MB (${cachedCount} 本已离线)`;
    }

    async function purgeAllLocalCache() {
      let freed = 0;
      const changed = [];
      for (const b of state.books) {
        if (b.fileBytes && (b.cloudPath || b.cloudSha)) {
          b.fileBytes = null;
          b.rawBlocks = null;
          b.isCloudOnly = true;
          changed.push(b);
          freed++;
        }
      }
      if (changed.length) await saveBooksBatchDB(changed);
      renderLibrary();
      updateStorageUsageDisplay();
      showToast(`已释放 ${freed} 本书的手机空间，云端记录已保留`);
    }

    // ==================== 全屏沉浸切换 ====================
    function toggleReaderFullscreen() {
      const doc = document;
      const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
      if (!isFs) {
        const el = $('reader-view') || doc.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
      } else {
        (doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen)?.call(doc);
      }
    }

    function exitFullscreenIfAny() {
      const doc = document;
      if (doc.fullscreenElement || doc.webkitFullscreenElement) {
        (doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen)?.call(doc);
      }
    }

    function updateFullscreenIcons() {
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      $('fs-icon-expand').classList.toggle('hidden', isFs);
      $('fs-icon-shrink').classList.toggle('hidden', !isFs);
      const modal = $('note-editor-modal');
      if (modal) {
        const readerView = $('reader-view');
        if (isFs && modal.parentElement !== readerView) {
          readerView.appendChild(modal);
        } else if (!isFs && modal.parentElement === readerView) {
          document.body.appendChild(modal);
        }
      }
      if (state.currentBook) {
        setTimeout(() => {
          const anchor = getCurrentReadingBlockIndex();
          applyLayoutStyles();
          repaginate();
          if (anchor >= 0 && state.readerConfig.viewMode !== 'scroll') {
            state.currentPageIndex = alignPageForMode(findPageOfBlock(state.currentBook, anchor));
          }
          renderReaderPages({ skipDbSave: true });
        }, 120);
      }
    }
    document.addEventListener('fullscreenchange', updateFullscreenIcons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!state.currentBook) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const anchor = getCurrentReadingBlockIndex();
        applyLayoutStyles();
        repaginate();
        if (anchor >= 0 && state.readerConfig.viewMode !== 'scroll') {
          state.currentPageIndex = alignPageForMode(findPageOfBlock(state.currentBook, anchor));
        }
        renderReaderPages({ skipDbSave: true });
      }, 200);
    });

    // ==================== GitHub REST API 私有仓直连 & 文件夹书架同步 ====================
    function updateCloudIndicator() {
      const connected = Boolean(state.github.owner && state.github.repo && state.github.token);
      $('cloud-status-dot').className = `absolute top-2 right-2 w-2.5 h-2.5 rounded-full ring-2 ring-white transition-colors ${connected ? 'bg-emerald-500' : 'bg-neutral-400'}`;
      const badge = $('cloud-conn-badge');
      badge.textContent = connected ? `已连 ${state.github.owner}/${state.github.repo}` : '未连接';
      badge.className = `text-xs px-2.5 py-0.5 rounded-full ${connected ? 'bg-emerald-50 text-emerald-700 font-medium' : 'bg-neutral-100 text-neutral-500'}`;
      const cloudButtons = {
        'hub-import-cloud-btn': '连接仓库后可用：在具体书架内导入并上传到对应文件夹',
        'hub-sync-shelves-btn': '连接仓库后可用：将书架归类与顺序同步到仓库文件夹',
        'book-act-cloud-delete': '连接仓库后可用：同时删除仓库里的这本'
      };
      Object.entries(cloudButtons).forEach(([id, tip]) => {
        const el = $(id);
        if (!el) return;
        el.disabled = !connected;
        el.title = connected ? tip.replace(/^连接仓库后可用：/, '') : tip;
      });
    }

    function ghHeaders(extra = {}) {
      return {
        'Authorization': `Bearer ${state.github.token.trim()}`,
        'Accept': 'application/vnd.github+json',
        ...extra
      };
    }

    function isCloudConnected() {
      return Boolean(state.github.owner && state.github.repo && state.github.token);
    }

    function repoApiBase() {
      const { owner, repo } = state.github;
      return `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
    }

    function encodeRepoPath(p) {
      return String(p || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
    }

    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    async function getCloudFileSha(path) {
      const branch = state.github.branch || 'main';
      const url = `${repoApiBase()}/contents/${encodeRepoPath(path)}?ref=${encodeURIComponent(branch)}&_t=${Date.now()}`;
      const res = await fetch(url, { headers: ghHeaders(), cache: 'no-store' });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data && data.sha ? data.sha : null;
    }

    async function uploadBookToCloud(book) {
      if (!isCloudConnected()) throw new Error('未连接私有仓');
      if (!book.fileBytes) throw new Error('本地没有原始文件，无法上传');
      const branch = state.github.branch || 'main';
      const fileName = book.fileName || `${book.title}.epub`;
      const targetPath = book.shelf ? `${book.shelf}/${fileName}` : fileName;
      const sha = await getCloudFileSha(targetPath);
      const body = {
        message: `upload: ${targetPath}`,
        content: arrayBufferToBase64(book.fileBytes),
        branch
      };
      if (sha) body.sha = sha;
      const res = await fetch(`${repoApiBase()}/contents/${encodeRepoPath(targetPath)}`, {
        method: 'PUT',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 120)}`);
      }
      const data = await res.json();
      book.cloudPath = targetPath;
      book.cloudSha = data && data.content ? data.content.sha : (sha || '');
      return targetPath;
    }

    async function deleteBookFromCloud(book) {
      if (!isCloudConnected()) throw new Error('未连接私有仓');
      const branch = state.github.branch || 'main';
      const path = book.cloudPath || (book.shelf ? `${book.shelf}/${book.fileName}` : book.fileName);
      if (!path) throw new Error('该书没有云端路径');
      const sha = await getCloudFileSha(path);
      if (!sha) return { skipped: true };
      const res = await fetch(`${repoApiBase()}/contents/${encodeRepoPath(path)}`, {
        method: 'DELETE',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ message: `delete: ${path}`, sha, branch })
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 120)}`);
      }
      book.cloudPath = '';
      book.cloudSha = '';
      return { deleted: true };
    }

    async function pullFromGitHubPrivateRepo() {
      const owner = $('gh-owner-input').value.trim();
      const repo = $('gh-repo-input').value.trim();
      const branch = $('gh-branch-input').value.trim() || 'main';
      const token = $('gh-token-input').value.trim();
      if (!owner || !repo || !token) return showToast('请完整输入 GitHub 用户名、仓库名与 Token');

      state.github = { ...state.github, owner, repo, branch, token };
      savePrefs();

      const progBox = $('sync-progress-box');
      const progTxt = $('sync-progress-text');
      const progBar = $('sync-progress-bar');
      progBox.classList.remove('hidden');
      progTxt.textContent = '正在连接私有仓库...';
      progBar.style.width = '20%';

      try {
        try {
          const gotShelves = await getCloudJSON('data/shelves.json');
          if (gotShelves && gotShelves.data && Array.isArray(gotShelves.data.shelves)) {
            gotShelves.data.shelves.forEach(s => {
              if (s && !state.shelves.includes(s)) state.shelves.push(s);
            });
            const ordered = gotShelves.data.shelves.filter(Boolean);
            state.shelves.forEach(s => { if (!ordered.includes(s)) ordered.push(s); });
            state.shelves = ordered;
          }
        } catch (e) {}

        progBar.style.width = '45%';
        progTxt.textContent = '正在读取仓库目录树...';

        const refRes = await fetch(`${repoApiBase()}/git/ref/heads/${encodeURIComponent(branch)}?_t=${Date.now()}`, {
          headers: ghHeaders(),
          cache: 'no-store'
        });
        if (!refRes.ok) throw new Error(`HTTP ${refRes.status}`);
        const refData = await refRes.json();
        const headCommitSha = refData.object.sha;

        const treeRes = await fetch(`${repoApiBase()}/git/trees/${encodeURIComponent(headCommitSha)}?recursive=1&_t=${Date.now()}`, {
          headers: ghHeaders(),
          cache: 'no-store'
        });
        if (!treeRes.ok) throw new Error(`HTTP ${treeRes.status}`);
        const treeData = await treeRes.json();
        const treeList = Array.isArray(treeData.tree) ? treeData.tree : [];

        treeList.forEach(item => {
          if (item.type !== 'blob') return;
          const parts = String(item.path || '').split('/');
          if (parts.length >= 2 && parts[0] !== 'data' && !parts[0].startsWith('.')) {
            const folderName = parts[0];
            if (folderName && !state.shelves.includes(folderName)) {
              state.shelves.push(folderName);
            }
          }
        });

        const bookEntries = treeList.filter(item => item.type === 'blob' && /\.epub$/i.test(item.path));
        progBar.style.width = '75%';
        progTxt.textContent = `索引 ${bookEntries.length} 本云端图书...`;

        const toSave = [];
        for (let i = 0; i < bookEntries.length; i++) {
          const entry = bookEntries[i];
          const parts = entry.path.split('/');
          const fileName = parts[parts.length - 1];
          const folderShelf = (parts.length >= 2 && parts[0] !== 'data' && !parts[0].startsWith('.')) ? parts[0] : '';
          const title = fileName.replace(/\.epub$/i, '');

          let exist = state.books.find(b => b.cloudSha === entry.sha || b.fileName === fileName || b.title === title);
          if (!exist) {
            const newCloudBook = {
              id: 'cloud-' + entry.sha.slice(0, 10) + '-' + i,
              title,
              fileName,
              format: 'EPUB',
              shelf: folderShelf,
              addedAt: Date.now(),
              lastReadAt: 0,
              coverUrl: '',
              hasBeenRead: false,
              progressPercent: 0,
              lastPageIndex: 0,
              cloudPath: entry.path,
              cloudSha: entry.sha,
              isCloudOnly: true
            };
            state.books.push(newCloudBook);
            toSave.push(newCloudBook);
          } else {
            exist.cloudPath = entry.path;
            exist.cloudSha = entry.sha;
            exist.shelf = folderShelf;
            toSave.push(exist);
          }
        }

        if (toSave.length) await saveBooksBatchDB(toSave);
        savePrefs();
        updateCloudIndicator();
        renderShelves();
        renderLibrary();
        progBox.classList.add('hidden');
        $('cloud-hub-modal').classList.add('hidden');
        showToast(`同步完成：已索引 ${bookEntries.length} 本云端图书`);
      } catch (err) {
        console.error(err);
        progBox.classList.add('hidden');
        showToast('连接失败：请核对用户名、仓库名或 Token');
      }
    }

    async function syncShelvesWithCloud() {
      if (!isCloudConnected()) return showToast('请先连接私有仓');
      const btn = $('hub-sync-shelves-btn');
      const progBox = $('sync-progress-box');
      const progTxt = $('sync-progress-text');
      const progBar = $('sync-progress-bar');

      btn.disabled = true;
      progBox.classList.remove('hidden');
      progTxt.textContent = '正在读取云端目录树...';
      progBar.style.width = '25%';

      try {
        const branch = state.github.branch || 'main';
        const refRes = await fetch(`${repoApiBase()}/git/ref/heads/${encodeURIComponent(branch)}?_t=${Date.now()}`, {
          headers: ghHeaders(),
          cache: 'no-store'
        });
        if (!refRes.ok) throw new Error(`HTTP ${refRes.status}`);
        const refData = await refRes.json();
        const latestCommitSha = refData.object.sha;

        const commitRes = await fetch(`${repoApiBase()}/git/commits/${encodeURIComponent(latestCommitSha)}?_t=${Date.now()}`, {
          headers: ghHeaders(),
          cache: 'no-store'
        });
        if (!commitRes.ok) throw new Error(`HTTP ${commitRes.status}`);
        const commitData = await commitRes.json();
        const baseTreeSha = commitData.tree.sha;

        const treeRes = await fetch(`${repoApiBase()}/git/trees/${encodeURIComponent(baseTreeSha)}?recursive=1&_t=${Date.now()}`, {
          headers: ghHeaders(),
          cache: 'no-store'
        });
        if (!treeRes.ok) throw new Error(`HTTP ${treeRes.status}`);
        const treeData = await treeRes.json();
        const oldBlobs = (treeData.tree || []).filter(it => it.type === 'blob');

        progBar.style.width = '55%';
        progTxt.textContent = '正在整理书架文件夹结构...';

        const newTreeItems = [];
        const usedPaths = new Set();
        const updatedLocalBooks = [];

        oldBlobs.forEach(item => {
          const isBook = /\.epub$/i.test(item.path);
          const isGitKeep = item.path.endsWith('/.gitkeep');
          const isShelvesJson = item.path === 'data/shelves.json';
          if (!isBook && !isGitKeep && !isShelvesJson) {
            newTreeItems.push({
              path: item.path,
              mode: item.mode || '100644',
              type: 'blob',
              sha: item.sha
            });
            usedPaths.add(item.path);
          }
        });

        oldBlobs.forEach(item => {
          if (!/\.epub$/i.test(item.path)) return;
          const fileName = item.path.split('/').pop();
          const localBook = state.books.find(b => b.cloudPath === item.path || b.cloudSha === item.sha || b.fileName === fileName);
          let targetPath = item.path;
          if (localBook) {
            const validShelf = (localBook.shelf && state.shelves.includes(localBook.shelf)) ? localBook.shelf : '';
            localBook.shelf = validShelf;
            targetPath = validShelf ? `${validShelf}/${localBook.fileName || fileName}` : (localBook.fileName || fileName);
            if (localBook.cloudPath !== targetPath || localBook.cloudSha !== item.sha) {
              localBook.cloudPath = targetPath;
              localBook.cloudSha = item.sha;
              updatedLocalBooks.push(localBook);
            }
          }
          if (!usedPaths.has(targetPath)) {
            newTreeItems.push({
              path: targetPath,
              mode: item.mode || '100644',
              type: 'blob',
              sha: item.sha
            });
            usedPaths.add(targetPath);
          }
        });

        state.shelves.forEach(shelfName => {
          const keepPath = `${shelfName}/.gitkeep`;
          if (!usedPaths.has(keepPath)) {
            newTreeItems.push({
              path: keepPath,
              mode: '100644',
              type: 'blob',
              content: ''
            });
            usedPaths.add(keepPath);
          }
        });

        newTreeItems.push({
          path: 'data/shelves.json',
          mode: '100644',
          type: 'blob',
          content: JSON.stringify({ shelves: state.shelves, updatedAt: Date.now() }, null, 2)
        });

        progBar.style.width = '80%';
        progTxt.textContent = '正在提交云端书架结构...';

        const createTreeRes = await fetch(`${repoApiBase()}/git/trees`, {
          method: 'POST',
          headers: ghHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ tree: newTreeItems })
        });
        if (!createTreeRes.ok) throw new Error(`HTTP ${createTreeRes.status}`);
        const newTreeData = await createTreeRes.json();

        if (newTreeData.sha === baseTreeSha) {
          progBox.classList.add('hidden');
          showToast('云端书架已是最新，无需更改');
          return;
        }

        const createCommitRes = await fetch(`${repoApiBase()}/git/commits`, {
          method: 'POST',
          headers: ghHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            message: 'shelves: sync folder structure',
            tree: newTreeData.sha,
            parents: [latestCommitSha]
          })
        });
        if (!createCommitRes.ok) throw new Error(`HTTP ${createCommitRes.status}`);
        const newCommitData = await createCommitRes.json();

        const updateRefRes = await fetch(`${repoApiBase()}/git/refs/heads/${encodeURIComponent(branch)}`, {
          method: 'PATCH',
          headers: ghHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ sha: newCommitData.sha })
        });
        if (!updateRefRes.ok) throw new Error(`HTTP ${updateRefRes.status}`);

        if (updatedLocalBooks.length) await saveBooksBatchDB(updatedLocalBooks);
        savePrefs();
        renderShelves();
        renderLibrary();
        progBox.classList.add('hidden');
        showToast('已同步书架结构到云端仓库');
      } catch (e) {
        console.error(e);
        progBox.classList.add('hidden');
        showToast(`同步书架失败：${e.message || '请检查仓库权限'}`);
      } finally {
        btn.disabled = !isCloudConnected();
      }
    }

    // ==================== 书架管理与圆角排序弹窗 ====================
    function renderShelves() {
      const box = $('custom-shelf-list');
      box.innerHTML = '';
      state.shelves.forEach(name => {
        const key = `shelf:${name}`;
        const active = state.currentNav === key;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-[15px] transition cursor-pointer ${active ? 'bg-[#4a4a4a] text-white font-medium' : 'text-neutral-700 hover:bg-neutral-100'}`;
        btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><rect x="4" y="13" width="16" height="5" rx="1.5"/></svg><span class="truncate">${esc(name)}</span>`;
        btn.onclick = () => { state.currentNav = key; updateNavSelection(); };
        box.appendChild(btn);
      });
    }

    function updateNavSelection() {
      document.querySelectorAll('#main-nav-list .nav-item').forEach(b => {
        const active = b.dataset.nav === state.currentNav;
        b.className = `nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full text-[15px] transition cursor-pointer ${active ? 'bg-[#4a4a4a] text-white font-medium' : 'text-neutral-700 hover:bg-neutral-100'}`;
      });
      renderShelves();
      if (state.currentNav === 'notes') { showNotesView(); return; }
      hideNotesView();
      renderLibrary();
    }

    let dragIdx = null;
    function renderManageShelvesList() {
      const list = $('manage-shelves-list');
      list.innerHTML = '';
      state.shelves.forEach((name, idx) => {
        const row = document.createElement('div');
        row.draggable = true;
        row.className = 'flex items-center justify-between py-3 px-2 rounded-xl hover:bg-neutral-50 transition select-none';
        row.innerHTML = `
          <span class="text-[18px] text-[#3a3a3a] truncate pr-4">${esc(name)}</span>
          <div class="flex items-center gap-4 text-[#4a4a4a] shrink-0">
            <button type="button" class="del-btn p-1 hover:text-red-600 cursor-pointer" title="删除">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
            <button type="button" class="ren-btn p-1 hover:text-black cursor-pointer" title="重命名">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 15l6.232-6.232a2.5 2.5 0 013.536 3.536L12.536 18.5H9V15z"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 21h16"/></svg>
            </button>
            <span class="p-1 cursor-grab active:cursor-grabbing" title="拖动排序">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
            </span>
          </div>`;

        row.querySelector('.del-btn').onclick = async () => {
          state.shelves.splice(idx, 1);
          const affected = [];
          state.books.forEach(b => {
            if (b.shelf === name) {
              b.shelf = '';
              affected.push(b);
            }
          });
          if (affected.length) await saveBooksBatchDB(affected);
          if (state.currentNav === `shelf:${name}`) state.currentNav = 'all';
          savePrefs(); renderShelves(); renderLibrary(); renderManageShelvesList();
          showToast(`已删除书架「${name}」，原书已移回本地图书`);
        };
        row.querySelector('.ren-btn').onclick = async () => {
          openPrompt('重命名书架', `将「${name}」修改为：`, name, async val => {
            if (!val || val === name) return;
            state.shelves[idx] = val;
            const affected = [];
            state.books.forEach(b => {
              if (b.shelf === name) {
                b.shelf = val;
                affected.push(b);
              }
            });
            if (affected.length) await saveBooksBatchDB(affected);
            if (state.currentNav === `shelf:${name}`) state.currentNav = `shelf:${val}`;
            savePrefs(); renderShelves(); renderLibrary(); renderManageShelvesList();
          });
        };
        row.ondragstart = () => { dragIdx = idx; row.classList.add('opacity-50'); };
        row.ondragend = () => { dragIdx = null; row.classList.remove('opacity-50'); };
        row.ondragover = e => e.preventDefault();
        row.ondrop = e => {
          e.preventDefault();
          if (dragIdx === null || dragIdx === idx) return;
          const moved = state.shelves.splice(dragIdx, 1)[0];
          state.shelves.splice(idx, 0, moved);
          savePrefs(); renderShelves(); renderManageShelvesList();
        };
        list.appendChild(row);
      });
    }

    function openPrompt(title, desc, defVal, cb) {
      $('modal-title').textContent = title;
      $('modal-desc').textContent = desc;
      $('modal-input').value = defVal || '';
      state.modalConfirmCallback = cb;
      $('custom-modal').classList.remove('hidden');
      setTimeout(() => $('modal-input').focus(), 30);
    }

    // ==================== 笔记：列表渲染 ====================
    function fmtNoteTime(ts) {
      const d = new Date(ts || Date.now());
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function renderNotes() {
      const grid = $('notes-grid');
      if (!grid) return;

      const filterBook = state.notesBookFilter || '';
      let list = sortedNotes(state.notes);

      if (filterBook) {
        list = list
          .filter(n => n.bookFile === filterBook)
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      } else {
        list = list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }

      $('notes-empty').classList.toggle('hidden', list.length > 0);
      grid.innerHTML = '';

      list.forEach(n => {
        const bookExists = Boolean(n.bookFile && state.books.some(b => b.fileName === n.bookFile));
        const card = document.createElement('div');
        card.className = 'relative bg-white rounded-2xl border border-neutral-200/80 shadow-[0_1px_4px_rgba(0,0,0,0.04)] p-4 flex flex-col';
        card.style.height = '290px';
        card.style.fontFamily = 'var(--reader-font-family)';
        card.innerHTML = `
          <div class="text-[13.5px] text-neutral-500 shrink-0 note-card-text">${fmtNoteTime(n.createdAt)}</div>
          <div class="shrink-0 mt-4" style="height:96px;">
            ${n.content ? `<p class="note-card-text text-[15.5px] leading-relaxed text-[#2f2f2f] overflow-hidden whitespace-pre-wrap" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;">${esc(n.content)}</p>` : ''}
          </div>
          <div class="flex-1 min-h-0">
            <p class="note-card-text text-[15.5px] leading-relaxed text-[#3a3a3a] overflow-hidden whitespace-pre-wrap" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;">${esc(n.quote)}</p>
          </div>
          <div class="shrink-0 mt-2">
            <div class="text-[12px] text-neutral-400 truncate text-right">来自《${esc(n.bookTitle || '')}》${esc(n.chapter || '')}</div>
            <div class="flex items-center justify-end gap-1 mt-1.5">
              <button type="button" class="note-edit w-7 h-7 flex items-center justify-center rounded-lg hover:bg-neutral-100 text-neutral-600 cursor-pointer" title="编辑备注">
                <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 20l4.5-1.2L20 7.3a2 2 0 000-2.8l-.5-.5a2 2 0 00-2.8 0L5.2 15.5 4 20z"/></svg>
              </button>
              <button type="button" ${bookExists ? '' : 'disabled'} class="note-jump w-7 h-7 flex items-center justify-center rounded-lg ${bookExists ? 'hover:bg-neutral-100 text-neutral-600 cursor-pointer' : 'text-neutral-300 opacity-50 cursor-not-allowed'}" title="${bookExists ? '在书中展示' : '原书不在当前书库中'}">
                <svg class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0012 3z"/></svg>
              </button>
            </div>
          </div>`;
        card.querySelector('.note-edit').onclick = () => openNoteEditor(n);
        if (bookExists) {
          card.querySelector('.note-jump').onclick = () => jumpToNote(n);
        }
        grid.appendChild(card);
      });
    }

    function renderNotesBookFilter() {
      const sel = $('notes-book-filter');
      if (!sel) return;
      const current = state.notesBookFilter || '';
      const books = new Map();
      sortedNotes(state.notes).forEach(n => {
        if (n.bookFile) books.set(n.bookFile, n.bookTitle || n.bookFile);
      });
      sel.innerHTML = '<option value="">请选择</option>';
      [...books.entries()]
        .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'zh'))
        .forEach(([file, title]) => {
          const o = document.createElement('option');
          o.value = file;
          o.textContent = title;
          sel.appendChild(o);
        });
      sel.value = books.has(current) ? current : '';
      state.notesBookFilter = sel.value;
    }

    function showNotesView() {
      $('empty-library-state').classList.add('hidden');
      $('books-grid-container').classList.add('hidden');
      $('notes-view').classList.remove('hidden');
      renderNotesBookFilter();
      renderNotes();
      updateNotesSyncBtn();
    }
    function hideNotesView() {
      $('notes-view').classList.add('hidden');
    }

    function updateNotesSyncBtn() {
      const btn = $('notes-sync-btn');
      if (!btn) return;
      btn.disabled = !isCloudConnected();
      btn.title = isCloudConnected() ? '与私有仓同步笔记' : '连接仓库后可用';
    }

    // ==================== 笔记：划线弹窗 ====================
    let pendingSelection = null;

    function buildColorDots(container, activeKey, onPick) {
      container.innerHTML = '';
      HIGHLIGHT_COLORS.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.title = c.label;
        b.className = 'w-6 h-6 rounded-full cursor-pointer';
        b.style.background = c.bg;
        b.style.border = activeKey === c.key ? '2px solid #2f2f2f' : '2px solid transparent';
        b.style.boxShadow = activeKey === c.key ? '0 0 0 2px #fff inset' : 'none';
        b.onclick = () => onPick(c.key);
        container.appendChild(b);
      });
    }

    function showSelectionPopover(rect) {
      const pop = $('selection-popover');
      pop.classList.remove('hidden');
      const r = pop.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - r.width / 2;
      let top = rect.bottom + 8;
      left = Math.max(8, Math.min(window.innerWidth - r.width - 8, left));
      if (top + r.height > window.innerHeight - 8) {
        const above = rect.top - r.height - 8;
        top = above >= 8 ? above : Math.max(8, window.innerHeight - r.height - 8);
      }
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      const pick = key => {
        setLastNoteColor(key);
        if (pendingSelection) pendingSelection.color = key;
        buildColorDots($('sel-colors'), key, pick);
      };
      if (pendingSelection) pendingSelection.color = lastNoteColor();
      buildColorDots($('sel-colors'), lastNoteColor(), pick);
    }

    function hideSelectionPopover() {
      $('selection-popover').classList.add('hidden');
    }

    // ==================== 笔记：编辑弹窗 ====================
    let editingNote = null;

    function openNoteEditor(note) {
      editingNote = { ...note };
      $('note-editor-quote').textContent = note.quote || '';
      $('note-editor-swatch').style.background = colorOf(note.color).bg;
      $('note-editor-content').value = note.content || '';
      const pick = key => {
        editingNote.color = key;
        $('note-editor-swatch').style.background = colorOf(key).bg;
        buildColorDots($('note-editor-colors'), key, pick);
      };
      buildColorDots($('note-editor-colors'), note.color || lastNoteColor(), pick);
      mountNoteEditor();
      $('note-editor-modal').classList.remove('hidden');
      setTimeout(() => $('note-editor-content').focus(), 60);
    }

    let editorMountParent = null;
    function mountNoteEditor() {
      const modal = $('note-editor-modal');
      if (!modal) return;
      const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const readerView = $('reader-view');
      if (isFs) {
        if (modal.parentElement !== readerView) { editorMountParent = modal.parentElement; readerView.appendChild(modal); }
        return;
      }
      if (modal.parentElement === readerView) {
        document.body.appendChild(modal);
      }
    }

    function closeNoteEditor() {
      $('note-editor-modal').classList.add('hidden');
      editingNote = null;
    }

    async function saveEditedNote() {
      if (!editingNote) return;
      const content = $('note-editor-content').value.trim();
      const now = Date.now();
      const existing = state.notes.find(n => n.id === editingNote.id);
      const note = existing || editingNote;
      const contentChanged = (note.content || '') !== content;
      note.content = content;
      note.color = editingNote.color;
      note.updatedAt = now;
      if (contentChanged) {
        note.contentUpdatedAt = now;
      }
      if (!existing) {
        note.createdAt = note.createdAt || now;
        note.contentUpdatedAt = now;
        state.notes.push(note);
      }
      await putNoteDB(note);
      closeNoteEditor();
      if (!$('reader-view').classList.contains('hidden')) renderReaderPages();
      renderNotesBookFilter();
      renderNotes();
      showToast(content ? '已保存笔记' : '已保存为摘抄');
    }
    function currentChapterName() {
      const book = state.currentBook;
      if (!book) return '';
      const bi = getCurrentReadingBlockIndex();
      return getChapterNameForBlock(book, bi).slice(0, 40);
    }

    function extractExactRangeText(range) {
      const frag = range.cloneContents();
      const spine = frag.querySelector && frag.querySelector('#dual-page-spine');
      if (spine) spine.remove();

      const blockTags = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'LI', 'BLOCKQUOTE']);
      const blocks = [];
      let inlineBuf = '';

      const flushInline = () => {
        if (inlineBuf.length > 0) {
          blocks.push(inlineBuf);
          inlineBuf = '';
        }
      };

      const walk = node => {
        if (!node) return;
        if (node.nodeType === Node.TEXT_NODE) {
          inlineBuf += node.nodeValue || '';
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.id === 'dual-page-spine') return;

        if (blockTags.has(node.tagName)) {
          flushInline();
          const txt = node.textContent || '';
          if (txt.length > 0) blocks.push(txt);
          return;
        }
        for (const child of node.childNodes) walk(child);
      };

      for (const child of frag.childNodes) walk(child);
      flushInline();

      if (!blocks.length) return range.toString();

      if (blocks.length >= 2 && state.currentBook && state.readerConfig.viewMode === 'dual') {
        const pages = state.currentBook.pages || [];
        const rightPage = pages[state.currentPageIndex + 1] || [];
        const firstRightBlock = rightPage[0];
        if (firstRightBlock && firstRightBlock.splitFrom) {
          const leafL = $('page-left');
          const leafR = $('page-right');
          const spansBoth = leafL && leafR &&
            (leafL.contains(range.startContainer) || range.startContainer === leafL) &&
            (leafR.contains(range.endContainer) || range.endContainer === leafR);
          if (spansBoth) {
            const leftWrapper = frag.querySelector && frag.querySelector('#page-left-wrapper');
            const rightWrapper = frag.querySelector && frag.querySelector('#page-right-wrapper');
            if (leftWrapper && rightWrapper) {
              const collectFrom = root => {
                const arr = [];
                let buf = '';
                const f = () => { if (buf.length > 0) { arr.push(buf); buf = ''; } };
                const w = n => {
                  if (n.nodeType === Node.TEXT_NODE) { buf += n.nodeValue || ''; return; }
                  if (n.nodeType !== Node.ELEMENT_NODE) return;
                  if (blockTags.has(n.tagName)) { f(); if ((n.textContent || '').length > 0) arr.push(n.textContent); return; }
                  for (const c of n.childNodes) w(c);
                };
                for (const c of root.childNodes) w(c);
                f();
                return arr;
              };
              const leftArr = collectFrom(leftWrapper);
              const rightArr = collectFrom(rightWrapper);
              if (leftArr.length && rightArr.length) {
                const leftDomBlocks = leafL.querySelectorAll('p, h2, h3, li');
                const rightDomBlocks = leafR.querySelectorAll('p, h2, h3, li');
                const lastLeftDom = leftDomBlocks[leftDomBlocks.length - 1];
                const firstRightDom = rightDomBlocks[0];
                const touchesLeftEnd = lastLeftDom && range.intersectsNode(lastLeftDom);
                const touchesRightStart = firstRightDom && range.intersectsNode(firstRightDom);
                if (touchesLeftEnd && touchesRightStart) {
                  leftArr[leftArr.length - 1] = leftArr[leftArr.length - 1] + rightArr[0];
                  rightArr.shift();
                  return leftArr.concat(rightArr).join('\n');
                }
              }
            }
          }
        }
      }

      return blocks.join('\n');
    }

    function captureSelection() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return null;

      const range = sel.getRangeAt(0);
      const viewport = $('reader-content-viewport');
      const leafL = $('page-left'), leafR = $('page-right');
      if (!viewport) return null;

      const startIn = viewport.contains(range.startContainer);
      const endIn = viewport.contains(range.endContainer);
      if (!startIn || !endIn) return null;

      const quote = extractExactRangeText(range);
      if (!quote || quote.length < 1) return null;

      let rect = null;
      const clientRects = range.getClientRects();
      const spansDualPages = leafL && leafR &&
        (leafL.contains(range.startContainer) || range.startContainer === leafL) &&
        (leafR.contains(range.endContainer) || range.endContainer === leafR);

      if (spansDualPages && clientRects && clientRects.length) {
        for (let i = clientRects.length - 1; i >= 0; i--) {
          const r = clientRects[i];
          if (r.width > 0 || r.height > 0) {
            rect = r;
            break;
          }
        }
      }

      if (!rect) {
        const bRect = range.getBoundingClientRect();
        if (bRect && (bRect.width || bRect.height)) {
          rect = bRect;
        } else if (clientRects && clientRects.length) {
          let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
          for (const r of clientRects) {
            if (!r.width && !r.height) continue;
            left = Math.min(left, r.left); top = Math.min(top, r.top);
            right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom);
          }
          if (isFinite(left)) rect = { left, top, right, bottom, width: right - left, height: bottom - top };
        }
      }
      if (!rect || (!rect.width && !rect.height)) return null;

      // 优先直接从选中节点所属的 DOM [data-bi] 获取精确 blockIndex
      let idx = -1;
      const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      const biHost = startEl && startEl.closest ? startEl.closest('[data-bi]') : null;
      if (biHost && biHost.dataset.bi !== undefined) {
        const parsedBi = parseInt(biHost.dataset.bi, 10);
        if (!isNaN(parsedBi) && parsedBi >= 0) idx = parsedBi;
      }

      const book = state.currentBook;
      const norm = s => String(s || '').replace(/\s+/g, '');
      const firstLine = norm(quote.split('\n')[0] || quote);
      if (idx < 0 && book && firstLine) {
        idx = (book.rawBlocks || []).findIndex(b => b.type !== 'img' && norm(b.text).includes(firstLine));
        if (idx < 0) {
          const head = firstLine.slice(0, 12);
          if (head) idx = (book.rawBlocks || []).findIndex(b => b.type !== 'img' && norm(b.text).includes(head));
        }
      }

      return { quote, blockIndex: idx, rect };
    }

    async function jumpToNote(note) {
      const book = state.books.find(b => b.fileName === note.bookFile);
      if (!book) return;
      if ($('reader-view').classList.contains('hidden') || state.currentBook !== book) {
        await openBook(book);
      }

      const bk = state.currentBook;
      if (!bk) return;
      ensureBlockIndices(bk);
      const blocks = bk.rawBlocks || [];
      const norm = s => String(s || '').replace(/\s+/g, '');
      const firstPara = String(note.quote || '').split('\n').map(s => s.trim()).find(Boolean) || '';
      const target = norm(firstPara);

      let blockIdx = (typeof note.blockIndex === 'number' && note.blockIndex >= 0 && note.blockIndex < blocks.length)
        ? note.blockIndex
        : -1;

      if (blockIdx >= 0 && target) {
        const candidate = blocks[blockIdx];
        if (!candidate || candidate.type === 'img' || !norm(candidate.text).includes(target.slice(0, 8))) {
          blockIdx = -1;
        }
      }

      if (blockIdx < 0 && target) {
        blockIdx = blocks.findIndex(b => b.type !== 'img' && norm(b.text).includes(target));
        if (blockIdx < 0) {
          const head = target.slice(0, 12);
          if (head) blockIdx = blocks.findIndex(b => b.type !== 'img' && norm(b.text).includes(head));
        }
      }
      if (blockIdx < 0 && note.chapter) {
        const normChap = norm(note.chapter);
        const tocHit = (bk.toc || []).find(t => norm(t.text).includes(normChap));
        if (tocHit && typeof tocHit.blockIndex === 'number') {
          blockIdx = tocHit.blockIndex;
        } else {
          blockIdx = blocks.findIndex(b => b.type === 'heading' && norm(b.text).includes(normChap));
        }
      }

      $('reader-view').classList.remove('hidden');
      $('library-view').classList.add('hidden');
      applyThemeColors();
      applyLayoutStyles();
      repaginate();

      if (blockIdx >= 0) {
        await jumpToBookLocation({ blockIndex: blockIdx });
      } else {
        await renderReaderPages();
        showToast('未能精确定位，已打开当前位置');
      }
    }

    function wrapTextNodeSlice(textNode, startOffset, endOffset, note) {
      if (!textNode || endOffset <= startOffset) return;
      try {
        const range = document.createRange();
        range.setStart(textNode, startOffset);
        range.setEnd(textNode, endOffset);
        const mark = document.createElement('mark');
        mark.dataset.noteId = note.id;
        mark.style.background = colorOf(note.color).bg;
        mark.style.color = 'inherit';
        mark.style.borderRadius = '2px';
        mark.style.cursor = 'pointer';
        mark.onclick = e => {
          e.stopPropagation();
          openNoteEditor(note);
        };
        range.surroundContents(mark);
      } catch (e) {}
    }

    function applyNoteHighlights(root) {
      if (!root) return;
      const book = state.currentBook;
      if (!book) return;
      const list = notesOfBook(book).filter(n => n.quote && n.quote.length > 0);
      if (!list.length) return;

      root.querySelectorAll('mark[data-note-id]').forEach(m => {
        const parent = m.parentNode;
        while (m.firstChild) parent.insertBefore(m.firstChild, m);
        parent.removeChild(m);
        parent.normalize();
      });

      const blockEls = Array.from(root.querySelectorAll('p, h2, h3, li'));
      if (!blockEls.length) return;

      const charMap = [];
      let streamStr = '';

      blockEls.forEach(el => {
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
        let tn;
        while ((tn = walker.nextNode())) {
          const s = tn.nodeValue || '';
          for (let i = 0; i < s.length; i++) {
            const ch = s[i];
            if (/\s/.test(ch)) continue;
            streamStr += ch;
            charMap.push({ node: tn, offset: i });
          }
        }
      });

      if (!streamStr.length) return;

      const taken = [];
      const sliceOps = [];

      const addMatchRange = (sIdx, eIdx, note) => {
        taken.push([sIdx, eIdx]);
        let curNode = null;
        let segStart = 0;
        let segEnd = 0;
        for (let k = sIdx; k < eIdx; k++) {
          const item = charMap[k];
          if (item.node !== curNode) {
            if (curNode) sliceOps.push({ node: curNode, start: segStart, end: segEnd, note });
            curNode = item.node;
            segStart = item.offset;
            segEnd = item.offset + 1;
          } else {
            segEnd = item.offset + 1;
          }
        }
        if (curNode) sliceOps.push({ node: curNode, start: segStart, end: segEnd, note });
      };

      list.slice()
        .sort((a, b) => (b.quote || '').length - (a.quote || '').length)
        .forEach(note => {
          const cleanNeedle = String(note.quote || '').replace(/\s+/g, '');
          if (!cleanNeedle) return;

          let pos = streamStr.indexOf(cleanNeedle);
          if (pos >= 0) {
            const end = pos + cleanNeedle.length;
            if (!taken.some(([s, e]) => pos < e && s < end)) {
              addMatchRange(pos, end, note);
              return;
            }
          }

          if (cleanNeedle.length >= 6) {
            const maxOverlap = Math.min(cleanNeedle.length - 1, streamStr.length);
            for (let len = maxOverlap; len >= 4; len--) {
              if (streamStr.endsWith(cleanNeedle.slice(0, len))) {
                const s = streamStr.length - len;
                const e = streamStr.length;
                if (!taken.some(([ts, te]) => s < te && ts < e)) {
                  addMatchRange(s, e, note);
                }
                break;
              }
            }
            for (let len = maxOverlap; len >= 4; len--) {
              if (streamStr.startsWith(cleanNeedle.slice(cleanNeedle.length - len))) {
                const s = 0;
                const e = len;
                if (!taken.some(([ts, te]) => s < te && ts < e)) {
                  addMatchRange(s, e, note);
                }
                break;
              }
            }
          }
        });

      if (!sliceOps.length) return;

      const byNode = new Map();
      sliceOps.forEach(op => {
        if (!byNode.has(op.node)) byNode.set(op.node, []);
        byNode.get(op.node).push(op);
      });

      byNode.forEach((ops, textNode) => {
        ops.sort((a, b) => b.start - a.start);
        ops.forEach(op => wrapTextNodeSlice(textNode, op.start, op.end, op.note));
      });
    }

    async function removeEditedNote() {
      if (!editingNote) return;
      const note = state.notes.find(n => n.id === editingNote.id);
      if (note) {
        note.deletedAt = Date.now();
        note.updatedAt = note.deletedAt;
        await putNoteDB(note);
      }
      closeNoteEditor();
      if (!$('reader-view').classList.contains('hidden')) renderReaderPages();
      renderNotesBookFilter();
      renderNotes();
      showToast('已删除笔记');
    }

    const NOTES_CLOUD_PATH = 'data/notes.json';

    function deterministicConflictId(baseId, content, quote) {
      const str = `${baseId}|${quote || ''}|${content || ''}`;
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `${baseId}_c_${(h >>> 0).toString(36)}`;
    }

    function mergeNoteLists(localList, remoteList) {
      const byId = new Map();

      const saveConflictCopy = (winner, loser) => {
        const loserContent = (loser.content || '').trim();
        const winnerContent = (winner.content || '').trim();
        if (!loserContent || loserContent === winnerContent) return;
        const cid = deterministicConflictId(winner.id, loserContent, loser.quote);
        if (byId.has(cid)) return;
        const alreadyExists = Array.from(byId.values()).some(x =>
          !x.deletedAt &&
          (x.conflictOf === winner.id || x.id === winner.id) &&
          (x.content || '').trim() === loserContent &&
          (x.quote || '') === (loser.quote || '')
        );
        if (alreadyExists) return;
        byId.set(cid, {
          ...loser,
          id: cid,
          conflictOf: winner.id,
          deletedAt: null,
          createdAt: loser.createdAt || Date.now(),
          updatedAt: loser.updatedAt || Date.now(),
          syncedContent: loserContent
        });
      };

      const mergeTwo = (cur, inc) => {
        const curDel = Boolean(cur.deletedAt);
        const incDel = Boolean(inc.deletedAt);
        const curText = (cur.content || '').trim();
        const incText = (inc.content || '').trim();
        const baseText = (cur.syncedContent ?? inc.syncedContent ?? '').trim();

        if (curDel || incDel) {
          if (curDel && incDel) {
            return (inc.updatedAt || 0) > (cur.updatedAt || 0) ? { ...inc } : { ...cur };
          }
          const alive = curDel ? inc : cur;
          const dead = curDel ? cur : inc;
          const aliveText = (alive.content || '').trim();
          const deadText = (dead.content || '').trim();
          const aliveContentTime = alive.contentUpdatedAt || alive.updatedAt || 0;
          const delTime = dead.deletedAt || dead.updatedAt || 0;

          if (aliveText && (aliveText !== deadText || aliveContentTime > delTime)) {
            return { ...alive, deletedAt: null, updatedAt: Math.max(alive.updatedAt || 0, delTime + 1) };
          }
          return { ...dead };
        }

        if (curText === incText && (cur.quote || '') === (inc.quote || '')) {
          const newer = (inc.updatedAt || 0) >= (cur.updatedAt || 0) ? inc : cur;
          return { ...newer, syncedContent: curText };
        }

        const curChanged = curText !== baseText;
        const incChanged = incText !== baseText;

        if (curChanged && !incChanged) {
          const latestColor = (inc.updatedAt || 0) > (cur.updatedAt || 0) ? inc.color : cur.color;
          return { ...cur, color: latestColor, updatedAt: Math.max(cur.updatedAt || 0, inc.updatedAt || 0), syncedContent: curText };
        }
        if (!curChanged && incChanged) {
          const latestColor = (cur.updatedAt || 0) > (inc.updatedAt || 0) ? cur.color : inc.color;
          return { ...inc, color: latestColor, updatedAt: Math.max(cur.updatedAt || 0, inc.updatedAt || 0), syncedContent: incText };
        }

        if (!curText && incText) {
          return { ...inc, updatedAt: Math.max(cur.updatedAt || 0, inc.updatedAt || 0), syncedContent: incText };
        }
        if (curText && !incText) {
          return { ...cur, updatedAt: Math.max(cur.updatedAt || 0, inc.updatedAt || 0), syncedContent: curText };
        }

        const curTime = cur.contentUpdatedAt || cur.updatedAt || 0;
        const incTime = inc.contentUpdatedAt || inc.updatedAt || 0;
        const winner = incTime >= curTime ? { ...inc, syncedContent: incText } : { ...cur, syncedContent: curText };
        const loser = incTime >= curTime ? cur : inc;
        saveConflictCopy(winner, loser);
        return winner;
      };

      localList.forEach(n => {
        if (!n || !n.id) return;
        byId.set(n.id, { ...n });
      });

      remoteList.forEach(n => {
        if (!n || !n.id) return;
        const cur = byId.get(n.id);
        if (!cur) {
          byId.set(n.id, { ...n, syncedContent: (n.content || '').trim() });
        } else {
          const mergedNote = mergeTwo(cur, n);
          byId.set(n.id, mergedNote);
        }
      });

      for (const [, note] of byId.entries()) {
        if (!note.deletedAt) {
          note.syncedContent = (note.content || '').trim();
        }
      }

      return Array.from(byId.values());
    }

    function openNotesSyncModal() {
      if (!isCloudConnected()) return showToast('请先连接私有仓');
      updateNotesSyncModalUI();
      $('notes-sync-modal').classList.remove('hidden');
    }

    function updateNotesSyncModalUI() {
      const badge = $('notes-sync-status-badge');
      const pushBtn = $('notes-push-btn');
      if (state.notesPulledReady) {
        badge.className = 'px-3.5 py-2.5 rounded-xl bg-emerald-50 text-emerald-800 text-xs leading-relaxed';
        badge.textContent = `已在本地完成云端笔记合并（当前共 ${sortedNotes(state.notes).length} 条有效笔记）。你现在可以随时编辑/删除远古笔记，或点击下方「上行」直接替换上传。`;
        pushBtn.disabled = false;
      } else {
        badge.className = 'px-3.5 py-2.5 rounded-xl bg-neutral-100 text-neutral-600 text-xs leading-relaxed';
        badge.textContent = '上传前请先执行「1. 下行：拉取云笔记并本地合并」，确保远古笔记与多端改动已在本地对齐。';
        pushBtn.disabled = true;
      }
    }

    async function pullNotesFromCloud() {
      if (!isCloudConnected()) return showToast('请先连接私有仓');
      const pullBtn = $('notes-pull-btn');
      const syncIconBtn = $('notes-sync-btn');
      pullBtn.disabled = true;
      syncIconBtn.classList.add('is-syncing');
      try {
        const got = await getCloudJSON(NOTES_CLOUD_PATH);
        const remoteNotes = (got && got.data && Array.isArray(got.data.notes)) ? got.data.notes : [];
        const merged = mergeNoteLists(state.notes, remoteNotes);
        state.notes = merged;
        state.lastPulledNotesSha = got ? got.sha : null;
        state.notesPulledReady = true;

        const db = await openNotesDB();
        if (db) {
          const tx = db.transaction(NOTES_STORE, 'readwrite');
          const store = tx.objectStore(NOTES_STORE);
          await new Promise(res => { tx.oncomplete = res; tx.onerror = res; store.clear(); merged.forEach(n => store.put(n)); });
        }
        if (!$('reader-view').classList.contains('hidden')) renderReaderPages();
        renderNotesBookFilter();
        renderNotes();
        updateNotesSyncModalUI();
        showToast(`下行合并完成：本地现有 ${sortedNotes(state.notes).length} 条笔记，已解锁上行`);
      } catch (e) {
        showToast(`拉取云笔记失败：${e.message || '请检查仓库权限'}`);
      } finally {
        pullBtn.disabled = false;
        syncIconBtn.classList.remove('is-syncing');
      }
    }

    async function pushNotesToCloud() {
      if (!isCloudConnected()) return showToast('请先连接私有仓');
      if (!state.notesPulledReady) return showToast('请先执行下行拉取合并');
      const pushBtn = $('notes-push-btn');
      const syncIconBtn = $('notes-sync-btn');
      pushBtn.disabled = true;
      syncIconBtn.classList.add('is-syncing');
      try {
        const currentJsonSha = await getCloudFileSha(NOTES_CLOUD_PATH);
        if (currentJsonSha && state.lastPulledNotesSha && currentJsonSha !== state.lastPulledNotesSha) {
          state.notesPulledReady = false;
          updateNotesSyncModalUI();
          showToast('检测到云端刚刚有新改动，请先重新点一次「下行」合并后再上行');
          return;
        }

        state.notes.forEach(n => {
          if (!n.deletedAt) n.syncedContent = (n.content || '').trim();
        });
        const payload = { version: 1, updatedAt: Date.now(), notes: state.notes };
        const okJson = await putCloudJSON(NOTES_CLOUD_PATH, payload, currentJsonSha, 'notes: push replace');
        if (!okJson) throw new Error('写入 notes.json 冲突，请重新下行后再试');

        state.lastPulledNotesSha = await getCloudFileSha(NOTES_CLOUD_PATH);

        const htmlPath = 'data/notes.html';
        const built = buildNotesHtml(state.notes);
        const htmlContent = built ? built.html : '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Notes</title></head><body><p>暂无笔记</p></body></html>';
        const currentHtmlSha = await getCloudFileSha(htmlPath);
        await putCloudText(htmlPath, htmlContent, currentHtmlSha, 'notes: replace html');

        $('notes-sync-modal').classList.add('hidden');
        showToast(`上行替换成功：共上传 ${sortedNotes(state.notes).length} 条笔记及 HTML`);
      } catch (e) {
        showToast(`上行失败：${e.message || '请检查仓库权限'}`);
      } finally {
        pushBtn.disabled = !state.notesPulledReady;
        syncIconBtn.classList.remove('is-syncing');
      }
    }

    async function getCloudJSONRaw(path) {
      const branch = state.github.branch || 'main';
      const url = `${repoApiBase()}/contents/${encodeRepoPath(path)}?ref=${encodeURIComponent(branch)}&_t=${Date.now()}`;
      const res = await fetch(url, { headers: ghHeaders(), cache: 'no-store' });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const meta = await res.json();
      let b64 = meta.content ? meta.content.replace(/\s/g, '') : '';
      if (!b64 && meta.sha) {
        const blobUrl = `${repoApiBase()}/git/blobs/${encodeURIComponent(meta.sha)}?_t=${Date.now()}`;
        const blobRes = await fetch(blobUrl, { headers: ghHeaders(), cache: 'no-store' });
        if (blobRes.ok) {
          const blobMeta = await blobRes.json();
          b64 = blobMeta.content ? blobMeta.content.replace(/\s/g, '') : '';
        }
      }
      const raw = b64 ? atob(b64) : '';
      const text = new TextDecoder('utf-8').decode(Uint8Array.from(raw, c => c.charCodeAt(0)));
      return { sha: meta.sha, text };
    }

    async function getCloudJSON(path) {
      const got = await getCloudJSONRaw(path);
      if (!got) return null;
      let data = null;
      try { data = JSON.parse(got.text); } catch (e) {}
      return { data, sha: got.sha };
    }

    async function putCloudJSON(path, obj, sha, message) {
      return putCloudText(path, JSON.stringify(obj, null, 2), sha, message);
    }

    async function putCloudText(path, text, sha, message) {
      const branch = state.github.branch || 'main';
      const bytes = new TextEncoder().encode(text);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const body = { message, content: btoa(bin), branch };
      if (sha) body.sha = sha;
      const res = await fetch(`${repoApiBase()}/contents/${encodeRepoPath(path)}`, {
        method: 'PUT',
        headers: ghHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body),
        cache: 'no-store'
      });
      if (res.status === 409 || res.status === 422) return false;
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${t.slice(0, 100)}`);
      }
      return true;
    }
