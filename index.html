<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OneReader" />
  <title>OneReader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --reader-bg: #fdf6e3;
      --reader-text: #2f251e;
      --reader-font-size: 22px;
      --reader-margin: 0px;
      --reader-letter-spacing: 0px;
      --reader-para-spacing: 15px;
      --reader-brightness: 1;
      --reader-font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; user-select: none; overflow: hidden; background: #fff; color: #2c2c2c; }
    #book-stage, #page-left, #page-left *, #page-right, #page-right *, #page-measure-box, #page-measure-box * { font-family: var(--reader-font-family) !important; }
    input[type='range'].onereader-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: #6c6c6c; border-radius: 999px; outline: none; }
    input[type='range'].onereader-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #6b6863; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .swatch-selected { box-shadow: 0 0 0 3px #fafafa, 0 0 0 5px #443c35; }
    .paginated-leaf { overflow: hidden !important; }
    .paginated-leaf::-webkit-scrollbar { display: none !important; }
    #reader-view.mobile-controls-active .corner-float-btn { opacity: 1 !important; pointer-events: auto !important; }
    @media (hover: none) {
      #fs-sense-zone { pointer-events: none !important; }
      #fs-sense-zone #reader-fullscreen-toggle { pointer-events: none; }
      #reader-view.mobile-controls-active #fs-sense-zone #reader-fullscreen-toggle { pointer-events: auto; }
    }
    @keyframes cloudPulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    .cloud-btn-hover:hover svg .cloud-arrow { animation: cloudPulse 1.2s ease-in-out infinite; }
    @keyframes noteSyncSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #notes-sync-btn.is-syncing svg { animation: noteSyncSpin 1.4s linear infinite; }
    .note-card-text {
      -webkit-text-stroke: 0.35px currentColor;
      text-shadow: 0.2px 0 0 currentColor, -0.2px 0 0 currentColor;
    }
    @media (max-width: 768px) {
      #library-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 45; background: #fff; box-shadow: 4px 0 24px rgba(0,0,0,.14); transition: transform .22s ease; }
      #library-sidebar.mobile-closed { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- 隐藏文件/字体选择器 -->
  <input id="file-upload-input" type="file" accept=".epub,application/epub+zip" multiple class="hidden" />
  <input id="font-upload-input" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" class="hidden" />

  <!-- ==================== 1. 书库主页 ==================== -->
  <div id="library-view" class="flex-1 flex flex-col h-full w-full bg-white overflow-hidden">
    <header class="h-20 w-full flex items-center justify-between px-4 sm:px-8 shrink-0">
      <div class="flex items-center gap-3 sm:gap-6 flex-1 min-w-0">
        <button id="toggle-sidebar-btn" type="button" title="导航菜单" class="p-2.5 rounded-xl hover:bg-neutral-100 text-neutral-700 transition cursor-pointer shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center ml-1 sm:ml-14 md:ml-20 flex-1 min-w-0">
          <div class="relative w-full max-w-[270px]">
            <input id="library-search-input" type="text" placeholder="搜索我的书库"
                   name="onereader-q-not-a-real-field" autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false" enterkeyhint="search"
                   data-lpignore="true" data-form-type="other"
                   class="w-full h-11 pl-5 pr-10 rounded-full bg-[#ebebeb] text-[15px] text-neutral-700 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400 transition" />
            <button id="library-search-btn" type="button" title="搜索" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full text-neutral-500 hover:text-black hover:bg-neutral-200/70 transition cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
            </button>
          </div>
          <button id="library-search-chip" type="button" class="hidden ml-2 shrink-0 max-w-[180px] flex items-center gap-1 px-2.5 py-1 rounded-full bg-neutral-800 text-white text-[12px] cursor-pointer">
            <span id="library-search-chip-text" class="truncate"></span>
            <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <!-- 右上角精美云端图标与状态点 -->
      <div class="relative flex items-center gap-2 shrink-0">
        <button id="open-cloud-modal-btn" type="button" title="云端私有书库与同步管理" class="cloud-btn-hover group relative p-2.5 rounded-2xl hover:bg-neutral-100 active:scale-95 transition flex items-center justify-center cursor-pointer">
          <svg class="w-10 h-10 text-[#3b3b3b] group-hover:text-black transition" viewBox="0 0 40 32" fill="none">
            <path d="M11.5 26.5H29.5C33.6421 26.5 37 23.1421 37 19C37 15.203 34.1783 12.065 30.514 11.568C29.389 6.657 25.002 3 19.75 3C13.675 3 8.75 7.925 8.75 14C8.75 14.389 8.77 14.773 8.81 15.151C5.534 15.792 3 18.678 3 22.15C3 24.552 4.948 26.5 7.35 26.5H11.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(59,59,59,0.03)"/>
            <g class="cloud-arrow" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 19.5V12.5M16.5 12.5L13.8 15.2M16.5 12.5L19.2 15.2"/>
              <path d="M23.5 13.5V20.5M23.5 20.5L20.8 17.8M23.5 20.5L26.2 17.8"/>
            </g>
          </svg>
          <span id="cloud-status-dot" class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-neutral-400 ring-2 ring-white transition-colors"></span>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
      <div id="mobile-sidebar-backdrop" class="hidden fixed inset-0 bg-black/30 z-40 md:hidden"></div>

      <!-- 左侧精简导航栏 -->
      <aside id="library-sidebar" class="mobile-closed md:transform-none w-[230px] shrink-0 flex flex-col justify-between pr-3 pb-4 select-none overflow-y-auto">
        <div class="space-y-1 pt-2 md:pt-0">
          <nav id="main-nav-list" class="space-y-1">
            <button type="button" data-nav="all" class="nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full bg-[#4a4a4a] text-white text-[15px] font-medium transition cursor-pointer">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
              <span>本地图书</span>
            </button>
            <button type="button" data-nav="notes" class="nav-item w-full flex items-center gap-4 pl-6 pr-4 py-3 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5v-13z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 4h9.5A1.5 1.5 0 0120 5.5v13a1.5 1.5 0 01-1.5 1.5H9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12.5 9h4M12.5 13h4"/></svg>
              <span>我的笔记</span>
            </button>
          </nav>

          <div class="pt-4">
            <button id="shelf-collapse-btn" type="button" class="w-full flex items-center justify-between pl-6 pr-5 py-2.5 text-[15px] font-semibold text-neutral-800 hover:bg-neutral-50 rounded-r-full cursor-pointer">
              <span>我的书架</span>
              <svg id="shelf-chevron" class="w-4 h-4 text-neutral-600 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="shelf-items-container" class="mt-1 space-y-1">
              <button id="create-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700 text-base leading-none">+</span>
                <span>新建书架</span>
              </button>
              <button id="manage-shelf-btn" type="button" class="w-full flex items-center gap-4 pl-6 pr-4 py-2.5 rounded-r-full text-neutral-700 hover:bg-neutral-100 text-[15px] transition cursor-pointer">
                <span class="w-6 h-6 rounded-md bg-neutral-200/80 flex items-center justify-center text-neutral-700">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M4 20h4l10.5-10.5a2.5 2.5 0 00-3.536-3.536L4 16v4z"/></svg>
                </span>
                <span>管理书架</span>
              </button>
              <div id="custom-shelf-list" class="space-y-1"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 书库列表展示 -->
      <main class="flex-1 h-full overflow-y-auto px-6 sm:px-12 pt-6 sm:pt-8 pb-24">
        <div id="empty-library-state" class="mt-16 sm:mt-20 ml-2 sm:ml-4 max-w-md">
          <h1 class="text-[32px] sm:text-[38px] font-normal text-[#3c3c3c] tracking-wide">图书库为空</h1>
          <p class="mt-4 text-[19px] sm:text-[22px] text-[#9e9e9e] leading-relaxed font-light">
            请点击右上角的云端图标连接私有仓或从本地导入图书
          </p>
        </div>
        <div id="books-grid-container" class="hidden">
          <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-6 gap-y-8"></div>
        </div>

        <!-- 我的笔记 -->
        <div id="notes-view" class="hidden">
          <div class="flex items-center justify-end gap-2 -mt-6 sm:-mt-8 h-[47px] mb-4">
            <label class="text-sm text-neutral-500">按图书筛选</label>
            <select id="notes-book-filter" class="h-9 px-2.5 rounded-lg border border-neutral-300 bg-white text-sm text-neutral-700 focus:outline-none cursor-pointer max-w-[240px]">
              <option value="">请选择</option>
            </select>
            <button id="notes-sync-btn" type="button" title="与私有仓同步笔记" class="w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-300 hover:bg-neutral-100 text-neutral-600 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
              <svg class="w-[19px] h-[19px]" viewBox="0 0 40 32" fill="none">
                <path d="M11.5 26.5H29.5C33.6421 26.5 37 23.1421 37 19C37 15.203 34.1783 12.065 30.514 11.568C29.389 6.657 25.002 3 19.75 3C13.675 3 8.75 7.925 8.75 14C8.75 14.389 8.77 14.773 8.81 15.151C5.534 15.792 3 18.678 3 22.15C3 24.552 4.948 26.5 7.35 26.5H11.5Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(59,59,59,0.03)"/>
                <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16.5 19.5V12.5M16.5 12.5L13.8 15.2M16.5 12.5L19.2 15.2"/>
                  <path d="M23.5 13.5V20.5M23.5 20.5L20.8 17.8M23.5 20.5L26.2 17.8"/>
                </g>
              </svg>
            </button>
            <button id="notes-export-btn" type="button" title="导出全部笔记为 HTML" class="w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-300 hover:bg-neutral-100 text-neutral-600 transition cursor-pointer">
              <svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
              </svg>
            </button>
          </div>
          <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-x-5 gap-y-5"></div>
          <div id="notes-empty" class="hidden mt-16 text-center text-[#9e9e9e]">
            <p class="text-[20px]">还没有笔记</p>
            <p class="mt-2 text-[15px]">打开一本书，选中文字即可添加笔记</p>
          </div>
        </div>
      </main>

      <!-- 批量多选栏 -->
      <div id="multiselect-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-[#3b3b3b] text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-4 text-sm">
        <span id="multiselect-count" class="text-neutral-200 font-medium">已选 0 本</span>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-add-shelf-btn" type="button" class="hover:text-amber-300 transition cursor-pointer">移动书架</button>
        <button id="batch-delete-btn" type="button" class="text-red-300 hover:text-red-400 transition cursor-pointer">删除</button>
        <div class="h-4 w-[1px] bg-neutral-600"></div>
        <button id="batch-exit-btn" type="button" class="px-2.5 py-1 rounded-lg bg-white/15 hover:bg-white/25 transition cursor-pointer">退出</button>
      </div>
    </div>
  </div>

  <!-- ==================== 1.5 云笔记上下行同步弹窗 ==================== -->
  <div id="notes-sync-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-[400px] w-full p-6 shadow-2xl border border-neutral-100 flex flex-col">
      <div class="relative flex items-center justify-center pb-4 border-b border-neutral-100">
        <h3 class="text-[18px] font-medium text-[#333]">云端笔记同步</h3>
        <button id="close-notes-sync-modal-btn" type="button" class="absolute right-0 p-1.5 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">✕</button>
      </div>
      <div class="pt-4 space-y-3 text-sm">
        <div id="notes-sync-status-badge" class="px-3.5 py-2.5 rounded-xl bg-neutral-100 text-neutral-600 text-xs leading-relaxed">
          上传前请先「下行拉取合并」云端笔记，确保远古笔记与多端修改已在本地合并对齐。
        </div>
        <button id="notes-pull-btn" type="button" class="w-full py-3 px-4 rounded-2xl bg-[#3b3b3b] hover:bg-black text-white font-medium text-sm transition flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
          <span>1. 下行：拉取云笔记并本地合并</span>
        </button>
        <button id="notes-push-btn" type="button" disabled class="w-full py-3 px-4 rounded-2xl bg-[#3b3b3b] hover:bg-black text-white font-medium text-sm transition flex items-center justify-center gap-2 cursor-pointer disabled:opacity-35 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20V8m0 0l-4 4m4-4l4 4M4 4h16"/></svg>
          <span>2. 上行：替换上传当前本地笔记</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 云端弹窗 ==================== -->
  <div id="cloud-hub-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-[470px] w-full p-6 shadow-2xl border border-neutral-100 flex flex-col max-h-[90vh] overflow-y-auto">
      <div class="relative flex items-center justify-center pb-4 border-b border-neutral-100">
        <h3 class="text-[19px] font-medium text-[#333]">云端私有仓与存储管理</h3>
        <button id="close-cloud-modal-btn" type="button" class="absolute right-0 p-1.5 text-neutral-500 hover:text-black rounded-full hover:bg-neutral-100 transition cursor-pointer">✕</button>
      </div>

      <!-- 本地缓存与容量管理 -->
      <div class="py-4 border-b border-neutral-100 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-neutral-400 uppercase tracking-wider">手机/本地缓存空间</span>
          <span id="local-storage-size" class="text-xs font-semibold text-neutral-700">计算中...</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <button id="purge-all-cache-btn" type="button" class="flex-1 py-2 px-3 rounded-xl bg-neutral-100 hover:bg-red-50 text-neutral-700 hover:text-red-600 text-xs font-medium transition cursor-pointer border border-neutral-200">
            🧹 清空本地图书文件 (防爆炸)
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="hub-import-local-btn" type="button" class="py-2 px-4 rounded-xl bg-[#484848] hover:bg-black text-white text-xs font-medium transition cursor-pointer">
            📂 导入
          </button>
          <button id="hub-import-cloud-btn" type="button" title="连接仓库后可用：在具体书架内导入并上传到对应文件夹" class="py-2 px-4 rounded-xl bg-[#484848] hover:bg-black text-white text-xs font-medium transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
            ☁️ 云导入
          </button>
        </div>
        <p class="text-[11px] text-neutral-400 leading-tight">注：清空缓存仅删除手机内占空间的电子书大文件，保留云端记录和阅读进度，需阅读时可重新从私库拉取。</p>
      </div>

      <!-- GitHub 配置 -->
      <div class="pt-4 space-y-3.5 text-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-neutral-400 uppercase tracking-wider">GitHub 私有仓直连</span>
          <span id="cloud-conn-badge" class="text-xs px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-500">未连接</span>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">GitHub 用户名 (Owner)</label>
          <input id="gh-owner-input" type="text" value="" placeholder="GitHub 用户名" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-neutral-700 mb-1">私有仓库名 (Repo)</label>
            <input id="gh-repo-input" type="text" value="" placeholder="仓库名" autocomplete="off" class="w-full h-10 px-3.5 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
          <div>
            <label class="block text-neutral-700 mb-1">分支 (Branch)</label>
            <input id="gh-branch-input" type="text" value="" placeholder="main" autocomplete="off" class="w-full h-10 px-3 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:border-neutral-700" />
          </div>
        </div>

        <div>
          <label class="block text-neutral-700 mb-1">细粒度访问令牌 (Fine-grained Token)</label>
          <div class="relative">
            <input id="gh-token-input" type="password" value="" placeholder="粘贴 Token 密钥" autocomplete="off" class="w-full h-10 pl-3.5 pr-14 rounded-xl border border-neutral-300 text-sm font-mono focus:outline-none focus:border-neutral-700" />
            <button id="toggle-token-vis-btn" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-neutral-500 hover:text-black px-1.5 py-0.5 rounded cursor-pointer">显示</button>
          </div>
        </div>

        <div id="sync-progress-box" class="hidden text-xs py-2 px-3 rounded-xl bg-blue-50 text-blue-800 space-y-1">
          <div id="sync-progress-text">正在连接云端...</div>
          <div class="w-full bg-blue-200 h-1.5 rounded-full overflow-hidden">
            <div id="sync-progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-150"></div>
          </div>
        </div>

        <div class="pt-2 flex flex-col gap-2">
          <button id="gh-connect-pull-btn" type="button" class="w-full py-2.5 rounded-2xl bg-[#3b3b3b] hover:bg-black text-white font-medium text-sm transition cursor-pointer">
            保存并拉取私有仓书库
          </button>
          <div class="grid grid-cols-2 gap-2">
